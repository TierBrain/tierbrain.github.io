  try { const m = await access.membership(saved); if (m) { ME = m; CODE = saved; afterJoin(); } } catch (e) {} })();

/* ---------- following the game ---------- */
function show(id){ ['vJoin', 'vWait', 'vBout', 'vTable'].forEach(v => { $(v).hidden = v !== id; }); view = id; }
async function tick(){
  clearTimeout(timer); if (!CODE) return;
  try { S = await access.playerState(CODE); render(); }
  catch (e) {
    if (/no longer available|cannot access/.test(access.message(e))) { $('status').textContent = ''; show('vJoin'); $('joinErr').textContent = 'You have left this game, or it has ended. Join again with the code on the TV.'; $('leaveBtn').hidden = true; access.forgetPlayer(); CODE = ''; return; }
  }
  const live = S && S.phase === 'live' && S.bout && !S.bout.closed;
  timer = setTimeout(tick, live && inBout() ? 250 : live ? 500 : 900);
}
function roster(){ return (S && S.run && S.run.roster) || []; }
function idx(id){ return roster().findIndex(m => m.id === id); }
function colourOf(id){ const i = idx(id); return i < 0 ? '#95a5a6' : COLOURS[i]; }
function nameOf(id){ const m = roster().find(x => x.id === id); return m ? m.name : ''; }
function myIdx(){ return ME ? idx(ME.id) : -1; }
function inBout(){ return !!(S && S.bout && ME && (S.bout.a === ME.id || S.bout.b === ME.id)); }
function paintMe(){ const i = myIdx(); $('meTag').hidden = !ME; if (ME) $('meTag').innerHTML = '<span class="b">' + robin(i < 0 ? '#95a5a6' : COLOURS[i]) + '</span>' + esc(ME.name); }
function render(){
  paintMe();
  const phase = S.phase;
  if (phase === 'lobby' || !S.run) { if (view !== 'vWait' || lastPhase !== 'lobby') waiting('You’re in, ' + ME.name + '!', 'Watch the TV. The game starts soon.'); lastPhase = 'lobby'; return; }
  if (phase === 'live' && S.bout) { lastPhase = phase; return bout(); }
  if (phase !== lastPhase || view !== 'vTable') table(phase === 'final');
  lastPhase = phase;
}
function waiting(head, line){ show('vWait'); $('waitHead').textContent = head; $('waitLine').textContent = line; $('waitBird').innerHTML = robin(myIdx() < 0 ? '#3b82f6' : COLOURS[myIdx()]); $('waitPanel').hidden = true; }

/* ---------- the Pecking Order, with the game's tie-breaks ---------- */
function standings(){
  const R = roster(), res = S.run.results || [], pts = S.run.points || {};
  const h2h = (id, group) => res.filter(x => x.winner === id && group.includes(x.a === id ? x.b : x.a)).length * 2;
  const avg = id => { const t = res.filter(x => x.winner === id).map(x => x.peck_ms || 0); return t.length ? t.reduce((a, b) => a + b, 0) / t.length : Infinity; };
  const ids = R.map(m => m.id).sort((a, b) => (pts[b] || 0) - (pts[a] || 0));
  const out = [];
  for (let i = 0; i < ids.length;) { let j = i; while (j < ids.length && (pts[ids[j]] || 0) === (pts[ids[i]] || 0)) j++;
    const g = ids.slice(i, j); g.sort((a, b) => (h2h(b, g) - h2h(a, g)) || (avg(a) - avg(b))); out.push(...g); i = j; }
  return out.map(id => ({ id, pts: pts[id] || 0 }));
}
function table(final){
  show('vTable');
  const st = standings(), mine = st.findIndex(x => ME && x.id === ME.id);
  $('tableHead').textContent = final ? (st[0] ? 'Top of the tree: ' + nameOf(st[0].id) : 'Game over') : 'The Pecking Order';
  const done = (S.run.results || []).length, n = roster().length, total = n * (n - 1) / 2;
  $('tableLine').textContent = final ? (mine === 0 ? 'Ruler of the roost: that’s you!' : mine > 0 ? 'You finished ' + ord(mine + 1) + '.' : 'Thanks for watching!')
    : mine >= 0 ? 'You’re ' + ord(mine + 1) + ' after ' + done + ' of ' + total + ' bouts.' : 'After ' + done + ' of ' + total + ' bouts.';
  const R = roster();
  $('tableList').innerHTML = st.map((x, i) => { const m = R.find(r => r.id === x.id);
    return '<div class="row' + (ME && x.id === ME.id ? ' me' : '') + (m && !m.active ? ' left' : '') + '" style="--i:' + i + '"><span class="pos">' + (i + 1) + '</span><span class="b">' + robin(colourOf(x.id), { crown: final && i === 0 }) + '</span><span class="n">' + esc(nameOf(x.id)) + '</span><span class="p">' + x.pts + (x.pts === 1 ? ' pt' : ' pts') + '</span></div>'; }).join('');
  if (final && mine === 0) { SFX.right(myIdx()); }
}
function ord(n){ const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

/* ---------- a bout ---------- */
let BV = null;
function bout(){
  const b = S.bout, me = ME.id, mine = inBout(), now = access.now();
  if (lastBout !== b.id) {
    lastBout = b.id; BV = { result: false };
    show('vBout');
    $('vs').innerHTML = '<span class="b">' + robin(colourOf(b.a)) + '</span><span>' + esc(nameOf(b.a)) + '</span><span class="v">v</span><span>' + esc(nameOf(b.b)) + '</span><span class="b r">' + robin(colourOf(b.b)) + '</span>';
    $('kick').textContent = 'Bout ' + b.ordinal + (mine ? ': you’re up!' : ': watch along');
    $('q').textContent = b.q;
    $('opts').className = 'opts'; $('opts').style.setProperty('--pc', mine ? colourOf(me) : '#f0b44c');
    $('opts').innerHTML = b.opts.map((o, i) => '<button class="opt" type="button" disabled data-i="' + i + '"><b>' + 'ABCD'[i] + '</b><span>' + esc(o) + '</span></button>').join('');
    $('card').style.animation = 'none'; void $('card').offsetWidth; $('card').style.animation = '';
    $('peck').hidden = !mine; $('peck').style.setProperty('--pc', colourOf(me)); $('peckBird').innerHTML = robin(colourOf(me));
    $('bar').hidden = true; status(mine ? 'Read the question…' : esc(nameOf(b.a)) + ' v ' + esc(nameOf(b.b)), false);
    if (mine && navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  }
  (b.wrong || []).forEach(w => { const el = $('opts').children[w.choice]; if (el) el.classList.add('gone', 'wrong'); });
  if (b.closed) return result(b);
  const open = now >= b.open_at, chooser = b.chooser, locked = (b.locked || []).includes(me);
  const myTurn = chooser === me && now < b.choose_deadline;
  $('opts').classList.toggle('live', myTurn);
  [...$('opts').children].forEach(el => { el.disabled = !myTurn || el.classList.contains('gone'); });
  $('bar').hidden = !myTurn;
  if (myTurn) $('bar').firstElementChild.style.width = Math.max(0, (b.choose_deadline - now) / 60) + '%';
  if (mine) {
    const canPeck = open && !chooser && !locked;
    $('peck').hidden = myTurn; $('peck').disabled = !canPeck || busy; $('peck').classList.toggle('ready', canPeck && !busy);
    $('peckSub').textContent = locked ? 'Locked out' : !open ? 'Get ready…' : chooser && chooser !== me ? nameOf(chooser) + ' pecked first' : '';
    if (myTurn) status('You pecked first! Choose your answer.', BV.st !== 'turn'), BV.st = 'turn';
    else if (locked) status('Locked out. Fingers crossed…', BV.st !== 'locked'), BV.st = 'locked';
    else if (chooser) status(nameOf(chooser) + ' is choosing…', BV.st !== 'wait'), BV.st = 'wait';
    else if (open) status((b.locked || []).length ? 'Still open. Peck if you know it!' : 'Peck when you know!', BV.st !== 'open'), BV.st = 'open';
  } else {
    status(chooser ? nameOf(chooser) + ' pecked first…' : open ? 'Who will peck first?' : 'Read along…', false);
  }
}
function status(t, pop){ const el = $('status'); if (el.textContent !== t) el.textContent = t; if (pop && !STILL) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } }
function result(b){
  if (BV.result) return; BV.result = true;
  $('peck').hidden = true; $('bar').hidden = true; $('opts').classList.remove('live');
  [...$('opts').children].forEach((el, i) => { el.disabled = true; if (i === b.correct) el.classList.add('right'); });
  const me = ME.id;
  if (b.winner === me) { status('Correct! +2 points', true); SFX.right(myIdx()); if (navigator.vibrate) try { navigator.vibrate([40, 60, 40]); } catch (e) {} }
  else if (b.winner) status('Two points to ' + nameOf(b.winner) + '.', true);
  else status(b.reason === 'time' ? 'Time’s up: 0–0' : b.reason === 'host' ? 'Nobody knew: 0–0' : 'Both wrong: 0–0', true);
  if (inBout() && b.winner && b.winner !== me) SFX.wrong();
}
$('peck').addEventListener('pointerdown', async e => {
  e.preventDefault(); if ($('peck').disabled || busy || !S || !S.bout) return;
  busy = true; $('peck').classList.add('hit'); actx();
  try { S = await access.peck(CODE, S.bout.id); if (S.bout && S.bout.chooser === ME.id) { SFX.peck(myIdx()); if (navigator.vibrate) try { navigator.vibrate(30); } catch (e2) {} } render(); }
  catch (err) { status(access.message(err), true); }
  finally { busy = false; setTimeout(() => $('peck').classList.remove('hit'), 120); }
});
$('opts').addEventListener('click', async e => {
  const el = e.target.closest('.opt'); if (!el || el.disabled || busy) return;
  busy = true; [...$('opts').children].forEach(x => { x.disabled = true; });
  try { S = await access.answer(CODE, S.bout.id, +el.dataset.i); if (!S.bout.closed) SFX.wrong(); render(); }
  catch (err) { status(access.message(err), true); }
  finally { busy = false; }
});
window.__rp = { get S(){ return S; }, get ME(){ return ME; } };
</script>
