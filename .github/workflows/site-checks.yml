name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Validate pages, scripts, data and sitemap targets
        run: python scripts/check_site.py
      - name: Validate catalogue totals and targets
        run: python sync-catalogue.py --check
      - name: Verify validators and preview build isolation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run browser regressions with synthetic data and blocked external requests
        run: python tests/browser_checks.py
      - name: Verify score policies and rollback in disposable PostgreSQL
        run: |
          docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          python tests/check_score_policy.py
      - name: Verify cleanup permissions and rollback in disposable PostgreSQL
        run: python tests/check_cleanup_permissions.py
      - name: Verify Show ownership and rollback in disposable PostgreSQL
        run: python tests/check_show_access.py
      - name: Build and validate preview and production hosting assets
        run: |
          python build-site.py --preview
          python scripts/check_site.py --root dist
          python build-site.py
          python scripts/check_site.py --root dist
