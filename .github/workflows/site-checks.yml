name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Validate pages, scripts, data and sitemap targets
        run: python scripts/check_site.py
      - name: Validate catalogue totals and targets
        run: python sync-catalogue.py --check
      - name: Verify validator detects broken fixtures
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run browser regressions with synthetic data and blocked external requests
        run: python tests/browser_checks.py
      - name: Build and validate only the public hosting assets
        run: |
          python build-site.py
          python scripts/check_site.py --root dist
