name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser test dependencies
        run: |
          timeout 180 python -m pip install --timeout 30 --retries 2 -r requirements-dev.txt
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            timeout 180 python -m playwright install --with-deps chromium
          fi
      - name: Validate pages, scripts, data and sitemap targets
        run: python scripts/check_site.py
      - name: Validate catalogue totals and targets
        run: python sync-catalogue.py --check
      - name: Verify validators and preview build isolation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run browser regressions with synthetic data and blocked external requests
        run: python tests/browser_checks.py
      - name: Verify both Throne host and phone pages with isolated adapter fixtures
        run: python tests/throne_browser_checks.py
      - name: Verify Party host, phone, reconnect and solo behavior with blocked external requests
        run: python tests/party_browser_checks.py
      - name: Verify score policies and rollback in disposable PostgreSQL
        run: |
          docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          python tests/check_score_policy.py
      - name: Verify cleanup permissions and rollback in disposable PostgreSQL
        run: python tests/check_cleanup_permissions.py
      - name: Verify Show ownership and rollback in disposable PostgreSQL
        run: python tests/check_show_access.py
      - name: Verify Big Quiz ownership and cross-edition isolation in disposable PostgreSQL
        run: python tests/check_big_quiz_access.py
      - name: Verify Throne ownership, gameplay, historical Hall access and rollback in disposable PostgreSQL
        run: python tests/check_throne_access.py --report /tmp/tierbrain-throne-access.json
      - name: Verify Throne SDK sessions and gameplay through real isolated Auth and PostgREST
        if: ${{ !cancelled() }}
        run: python tests/throne_stack/run-acceptance.py --report /tmp/tierbrain-throne-http.json
      - name: Verify Party ownership, gameplay, prior families and rollback in disposable PostgreSQL
        if: ${{ !cancelled() }}
        run: python tests/check_party_access.py --report /tmp/tierbrain-party-access.json
      - name: Verify all six Party editions through real isolated Auth and PostgREST
        if: ${{ !cancelled() }}
        run: python tests/party_stack/run-acceptance.py --report /tmp/tierbrain-party-http.json
      - name: Preserve redacted Throne verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: throne-verification
          path: |
            /tmp/tierbrain-throne-access.json
            /tmp/tierbrain-throne-http.json
            /tmp/tierbrain-party-access.json
            /tmp/tierbrain-party-http.json
          if-no-files-found: ignore
      - name: Build and validate preview and production hosting assets
        run: |
          python build-site.py --preview
          python scripts/check_site.py --root dist
          python build-site.py
          python scripts/check_site.py --root dist
