name: Supabase availability check

# A bounded, read-only check of the public score API. A successful response
# confirms this endpoint is available; it is not a backup or a guarantee that
# a Free plan project will remain active. Inspect failed runs in Actions.

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC on every third calendar day of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the public score API
        run: |
          code=$(curl --fail --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 3 --retry-max-time 65 \
            "https://cgrbwtcydgfkbqhseeap.supabase.co/rest/v1/scores?select=id&limit=0" \
            -H "apikey: sb_publishable_YHNDjX8gcSYJYJVWo_TmMw_8z6BBVAU")
          echo "Supabase score API responded with HTTP $code"
          if [ "$code" != "200" ]; then echo "Unexpected status"; exit 1; fi
