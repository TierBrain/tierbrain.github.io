<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  :root{--deep:#101b22;--water:#16232b;--plank:#8a6e4e;--plank-lit:#a58760;--plank-dark:#6b5540;
        --bone:#e8dcc4;--gold:#d8a23c;--rust:#b5654a;--line:rgba(232,220,196,.14);}
  html,body{height:100%;}
  body{font-family:'Archivo',system-ui,sans-serif;color:var(--bone);
    background:radial-gradient(120% 70% at 50% -20%,#22323c,transparent 60%),
      linear-gradient(180deg,var(--water),var(--deep));background-attachment:fixed;
    min-height:100dvh;padding:16px;display:flex;flex-direction:column;align-items:center;}
  .wrap{width:100%;max-width:1000px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  h1{font-weight:800;font-size:clamp(20px,3.4vw,30px);}
  h1 b{color:var(--gold);font-weight:800;}
  .status{font-weight:700;font-size:13px;color:rgba(232,220,196,.6);}
  .status .live{color:#6ad39a;}

  .lobby{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;}
  @media(max-width:780px){.lobby{grid-template-columns:1fr;}}
  .card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .code{font-weight:800;font-size:clamp(34px,8vw,58px);letter-spacing:.14em;color:var(--gold);text-align:center;}
  .codelab{text-align:center;font-weight:700;font-size:11px;letter-spacing:.16em;
    color:rgba(232,220,196,.5);text-transform:uppercase;}
  .qr{display:block;width:160px;height:160px;margin:14px auto 6px;background:#fff;border-radius:10px;}
  .joinurl{display:block;text-align:center;font-weight:700;font-size:13.5px;color:var(--gold);word-break:break-all;}
  .hd{font-weight:800;font-size:14px;letter-spacing:.04em;margin-bottom:10px;}
  .plist{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;}
  .pchip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;}
  .pdot{width:11px;height:11px;border-radius:50%;}
  .go{margin-top:16px;background:var(--gold);border:0;border-radius:10px;color:#241905;
    font-family:inherit;font-weight:800;font-size:16px;padding:14px 28px;cursor:pointer;
    box-shadow:0 4px 0 #8f6a1f;}
  .go:disabled{opacity:.4;box-shadow:none;cursor:default;}
  .go:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 #8f6a1f;}
  .hint{color:rgba(232,220,196,.55);font-weight:600;font-size:13px;margin-top:10px;line-height:1.5;}

  /* the floor */
  .stage{display:none;margin-top:16px;}
  .stage.on{display:block;}
  .arena{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start;}
  @media(max-width:820px){.arena{grid-template-columns:1fr;}}
  .board{display:grid;gap:5px;aspect-ratio:1;max-width:560px;margin:0 auto;}
  .tile{position:relative;border-radius:4px;
    background:linear-gradient(170deg,var(--plank-lit),var(--plank) 45%,var(--plank-dark));
    box-shadow:0 3px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .5s cubic-bezier(.5,.05,.7,.3),opacity .5s ease;}
  .tile::after{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;
    background:repeating-linear-gradient(97deg,rgba(0,0,0,.07) 0 1px,transparent 1px 6px);}
  .tile.gone{transform:translateY(52px) scale(.8) rotate(var(--tilt,4deg));opacity:0;}
  .tile.lit{box-shadow:0 3px 0 rgba(0,0,0,.4), inset 0 0 0 2px var(--gold), 0 0 18px rgba(216,162,60,.45);}
  .tok{position:absolute;inset:13%;border-radius:50%;box-shadow:0 2px 7px rgba(0,0,0,.5);}
  .tok.turn{outline:3px solid #fff;outline-offset:2px;}

  .side{display:flex;flex-direction:column;gap:12px;}
  .standing{display:flex;flex-direction:column;gap:7px;}
  .srow{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;}
  .srow.out{opacity:.35;text-decoration:line-through;}
  .srow.now{border-color:var(--gold);background:rgba(216,162,60,.12);}
  .srow .gr{margin-left:auto;font-weight:800;font-size:12.5px;color:rgba(232,220,196,.6);}

  .qbox{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .qwho{font-weight:800;font-size:13px;color:var(--gold);}
  .qtext{font-weight:700;font-size:16px;line-height:1.4;margin-top:7px;}
  .qopts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px;}
  .qopt{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;
    padding:10px 8px;font-weight:700;font-size:13.5px;text-align:center;}
  .qopt.right{border-color:var(--gold);background:rgba(216,162,60,.2);}
  .say{text-align:center;font-weight:700;font-size:15px;margin-top:12px;min-height:22px;}
  .say.good{color:var(--gold);} .say.bad{color:var(--rust);}

  .winner{text-align:center;padding:26px 10px;}
  .winner h2{font-weight:800;font-size:clamp(26px,5vw,40px);}
  .winner p{color:rgba(232,220,196,.7);font-weight:600;margin-top:10px;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<body>
<div class="wrap">
  <div class="top">
    <h1>Standing <b>Room</b></h1>
    <div class="status" id="status">Opening a room&hellip;</div>
  </div>

  <div class="lobby" id="lobby">
    <div class="card">
      <div class="codelab">Tonight&rsquo;s code</div>
      <div class="code" id="code">&middot;&middot;&middot;&middot;&middot;</div>
      <img class="qr" id="qr" alt="QR code to join">
      <a class="joinurl" id="joinurl" href="#"></a>
    </div>
    <div class="card">
      <div class="hd">Standing at the edge <span id="pcount" style="color:rgba(232,220,196,.5)">(0)</span></div>
      <div class="plist" id="plist"><span class="hint">Waiting for people to join&hellip;</span></div>
      <button class="go" id="startBtn" disabled>Start</button>
      <p class="hint">Two or more to begin. Everyone stands on the same floor, and every
        step any of you takes sinks a board for good. Last one standing wins.</p>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="arena">
      <div><div class="board" id="board"></div></div>

          <div class="qwho" id="qwho"></div>

          <div class="qopts" id="qopts"></div>
        </div>

  </div>

  <div class="stage" id="endStage">
    <div class="winner">
      <h2 id="wTitle"></h2>
      <p id="wSub"></p>
      <button class="go" id="againBtn" style="margin-top:20px">Another round</button>
    </div>
  </div>
</div>

<script>
"use strict";
var SB_URL='https://cgrbwtcydgfkbqhseeap.supabase.co';
var SB_KEY='sb_publishable_YHNDjX8gcSYJYJVWo_TmMw_8z6BBVAU';
async function sb(path,opts){ opts=opts||{}; try{
  var headers=Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},opts.headers||{});
  if(opts.method==='POST'||opts.method==='PATCH') headers['Prefer']='return=minimal';
  var r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opts,{headers}));
  if(r.ok){ if(opts.method) return {ok:true}; return await r.json(); }
  return opts.method?{ok:false}:[];
}catch(e){ return opts.method?null:[]; } }

var $=function(i){return document.getElementById(i);};
var COLOURS=['#d8a23c','#4fb0a8','#c96fa8','#7fb85c','#6f8fd8','#e0855c'];

/* ---------- questions ---------- */
var FALLBACK=[
 {q:"What is the capital of France?",correct:"Paris",wrong:["Rome","Madrid","Berlin"]},
 {q:"What is the largest planet in our solar system?",correct:"Jupiter",wrong:["Saturn","Neptune","Mars"]},
 {q:"How many continents are there?",correct:"Seven",wrong:["Five","Six","Eight"]},
 {q:"What is the chemical symbol for gold?",correct:"Au",wrong:["Ag","Go","Gd"]},
 {q:"Which ocean is the largest?",correct:"The Pacific",wrong:["The Atlantic","The Indian","The Arctic"]},
 {q:"Who painted the Mona Lisa?",correct:"Leonardo da Vinci",wrong:["Michelangelo","Raphael","Titian"]},
 {q:"What is the hardest natural substance?",correct:"Diamond",wrong:["Quartz","Steel","Granite"]},
 {q:"How many players are on a football team on the pitch?",correct:"Eleven",wrong:["Nine","Ten","Twelve"]}
];
var BANK=[];
(function(){ try{ if(window.TB&&window.TB.bank){ var b=window.TB.bank('gk');
  ['1','2','3','4'].forEach(function(t){ (b[t]||[]).forEach(function(q){ BANK.push(q); }); }); } }catch(e){}
  if(!BANK.length) BANK=FALLBACK.slice(); })();
var used={};
function pickQ(){ var pool=BANK.filter(function(q){return !used[q.q];});
  if(!pool.length){ used={}; pool=BANK.slice(); }
  var q=pool[(Math.random()*pool.length)|0]; used[q.q]=true; return q; }
function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function code5(){var s='',A='ABCDEFGHJKLMNPQRSTUVWXYZ';for(var i=0;i<5;i++)s+=A[(Math.random()*A.length)|0];return s;}
function baseUrl(){var h=location.href;if(/^https?:\/\//.test(h)){var b=h.replace(/\/[^\/]*\.html.*$/,'').replace(/\/$/,'');if(b)return b;}return 'https://tierbrain.co';}

/* ---------- state ---------- */
var G={code:'',phase:'lobby',players:[],N:6,solid:[],pos:{},outOf:{},order:[],turn:0,q:null,qId:'',seq:0};

function idx(r,c){return r*G.N+c;}
function rc(i){return {r:(i/G.N)|0,c:i%G.N};}
function neighbours(i){var p=rc(i),o=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){ if(!dr&&!dc)continue;
    var r=p.r+dr,c=p.c+dc; if(r<0||c<0||r>=G.N||c>=G.N)continue; o.push(idx(r,c)); }
  return o;}
function occupied(exceptId){ var s={};
  for(var k=0;k<G.order.length;k++){ var pid=G.order[k];
    if(G.outOf[pid]||pid===exceptId) continue; s[G.pos[pid]]=true; }
  return s; }
function legal(pid){ var occ=occupied(pid);
  return neighbours(G.pos[pid]).filter(function(i){ return G.solid[i] && !occ[i]; }); }

/* Territory: how much floor this player reaches before anyone else.
   This is what the game is actually about, so it is what we show. */
function reachFrom(start,blocked){ var seen={},q=[start],h=0; seen[start]=0;
  while(h<q.length){ var cur=q[h++],nb=neighbours(cur);
    for(var i=0;i<nb.length;i++){ var n=nb[i];
      if(G.solid[n] && !blocked[n] && !(n in seen)){ seen[n]=seen[cur]+1; q.push(n); } } }
  return seen; }
function groundFor(pid){
  var mine=reachFrom(G.pos[pid],occupied(pid)), score=0;
  var rivals=[];
  for(var k=0;k<G.order.length;k++){ var o=G.order[k];
    if(o===pid||G.outOf[o]) continue; rivals.push(reachFrom(G.pos[o],occupied(o))); }
  for(var cell in mine){
    var d=mine[cell], best=1e9;
    for(var r=0;r<rivals.length;r++){ var dd=(cell in rivals[r])?rivals[r][cell]:1e9; if(dd<best) best=dd; }
    if(d<best) score++;
  }
  return score; }

/* ---------- board ---------- */
function boardSize(n){ return n<=2?6 : n===3?7 : n===4?8 : 9; }
function buildBoard(){
  var b=$('board'); b.innerHTML='';
  b.style.gridTemplateColumns='repeat('+G.N+',1fr)';
  for(var i=0;i<G.N*G.N;i++){
    var d=document.createElement('div'); d.className='tile'; d.dataset.i=i;
    d.style.setProperty('--tilt',(Math.random()*16-8).toFixed(1)+'deg');
    b.appendChild(d);
  }
}
function paint(){
  for(var i=0;i<G.N*G.N;i++){
    var t=$('board').children[i];
    t.classList.toggle('gone',!G.solid[i]);
    t.classList.remove('lit');
    var k=t.querySelector('.tok'); if(k) k.remove();
  }
  var now=G.order[G.turn];
  for(var p=0;p<G.order.length;p++){
    var pid=G.order[p]; if(G.outOf[pid]) continue;
    var el=document.createElement('i');
    el.className='tok'+(pid===now?' turn':'');
    el.style.background=colourOf(pid);
    $('board').children[G.pos[pid]].appendChild(el);
  }
  renderStanding();
}
function colourOf(pid){ var i=G.order.indexOf(pid); return COLOURS[i%COLOURS.length]; }
function nameOf(pid){ for(var i=0;i<G.players.length;i++) if(G.players[i].id===pid) return G.players[i].name; return 'Player'; }
function renderStanding(){
  var box=$('standing'); box.innerHTML='';
  var now=G.order[G.turn];
  for(var i=0;i<G.order.length;i++){
    var pid=G.order[i];
    var row=document.createElement('div');
    row.className='srow'+(G.outOf[pid]?' out':'')+(pid===now&&!G.outOf[pid]?' now':'');
    row.innerHTML='<i class="pdot" style="background:'+colourOf(pid)+'"></i>'+nameOf(pid)
      +'<span class="gr">'+(G.outOf[pid]?'under':groundFor(pid)+' ground')+'</span>';
    box.appendChild(row);
  }
}

/* ---------- room ---------- */
async function writeState(){
  await sb('rooms?code=eq.'+G.code,{method:'PATCH',body:JSON.stringify({
    phase:G.phase, updated_at:new Date().toISOString(),
    state:{ game:'standing-room', phase:G.phase, N:G.N, solid:G.solid, pos:G.pos,
            outOf:G.outOf, order:G.order, turn:G.turn, seq:G.seq,
            qId:G.qId, q:G.q?{q:G.q.q,opts:G.q.opts}:null,
            names:G.players.map(function(p){return {id:p.id,name:p.name};}) }
  })});
}
async function createRoom(){
  G.code=code5();
  var made=await sb('rooms',{method:'POST',body:JSON.stringify({code:G.code,phase:'lobby',state:{game:'standing-room',phase:'lobby'}})});
  if(!made||made.ok===false){
    $('code').textContent='----';
    $('status').textContent='No connection';
    $('joinurl').textContent='Cannot reach the game server. Check the internet and reload.';
    return;
  }
  $('code').textContent=G.code;
  var link=baseUrl()+'/standing-room-play.html?c='+G.code;
  $('joinurl').textContent=link.replace(/^https?:\/\//,''); $('joinurl').href=link;
  $('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=170x170&data='+encodeURIComponent(link);
  $('status').innerHTML='<span class="live">Live</span> &middot; room '+G.code;
  writeState();
}
async function pollPlayers(){
  var r=await sb('players?code=eq.'+G.code+'&select=id,name&order=joined_at.asc');
  if(r) G.players=r;
  $('pcount').textContent='('+G.players.length+')';
  var box=$('plist');
  if(!G.players.length){ box.innerHTML='<span class="hint">Waiting for people to join&hellip;</span>'; }
  else{
    box.innerHTML='';
    for(var i=0;i<G.players.length;i++){
      var c=document.createElement('div'); c.className='pchip';
      c.innerHTML='<i class="pdot" style="background:'+COLOURS[i%COLOURS.length]+'"></i>'+G.players[i].name;
      box.appendChild(c);
    }
  }
  $('startBtn').disabled = G.players.length<2 || G.phase!=='lobby';
}

/* ---------- play ---------- */
function startGame(){
  if(G.players.length<2) return;
  G.N=boardSize(G.players.length);
  G.solid=[]; for(var i=0;i<G.N*G.N;i++) G.solid[i]=true;
  G.order=G.players.map(function(p){return p.id;});
  G.outOf={}; G.pos={};
  /* spread the starts evenly round the edge */
  var edge=[];
  for(var c=0;c<G.N;c++) edge.push(idx(0,c));
  for(var r=1;r<G.N;r++) edge.push(idx(r,G.N-1));
  for(var c2=G.N-2;c2>=0;c2--) edge.push(idx(G.N-1,c2));
  for(var r2=G.N-2;r2>0;r2--) edge.push(idx(r2,0));
  for(var k=0;k<G.order.length;k++){
    G.pos[G.order[k]]=edge[Math.round(k*edge.length/G.order.length)%edge.length];
  }
  G.turn=0; G.phase='live'; G.seq=0;
  $('lobby').style.display='none';
  $('stage').classList.add('on');
  $('endStage').classList.remove('on');
  buildBoard(); paint(); askTurn();
}

function askTurn(){
  /* skip anyone already under, and eliminate anyone with nowhere to go */
  var guard=0;
  while(guard++<G.order.length*2){
    var pid=G.order[G.turn];
    if(G.outOf[pid]){ G.turn=(G.turn+1)%G.order.length; continue; }
    if(!legal(pid).length){
      G.outOf[pid]=true;
      $('say').textContent=nameOf(pid)+' has nowhere left to step.';
      $('say').className='say bad';
      paint();
      if(alive().length<=1){ return finish(); }
      G.turn=(G.turn+1)%G.order.length; continue;
    }
    break;
  }
  if(alive().length<=1) return finish();

  var who=G.order[G.turn];
  G.q=pickQ();
  G.q.opts=shuffled([G.q.correct].concat(G.q.wrong));
  G.qId='q'+(++G.seq);
  $('qwho').textContent=nameOf(who)+'\u2019s turn';
  $('qtext').textContent=G.q.q;
  var box=$('qopts'); box.innerHTML='';
  G.q.opts.forEach(function(o){ var d=document.createElement('div'); d.className='qopt'; d.textContent=o; box.appendChild(d); });
  paint(); writeState();
  waitForAnswer(who);
}
function alive(){ return G.order.filter(function(p){ return !G.outOf[p]; }); }

var pollTimer=null;
function waitForAnswer(who){
  clearInterval(pollTimer);
  var started=Date.now();
  pollTimer=setInterval(async function(){
    var rows=await sb('moves?code=eq.'+G.code+'&player_id=eq.'+who+'&q_id=eq.'+G.qId+'&select=choice');
    if(rows && rows.length){
      clearInterval(pollTimer);
      resolveAnswer(who, rows[0].choice);
      return;
    }
    if(Date.now()-started>45000){   /* nobody there: move them badly and carry on */
      clearInterval(pollTimer);
      resolveAnswer(who, '__timeout__');
    }
  },900);
}

function resolveAnswer(who, choice){
  var right = choice===G.q.correct;
  var opts=legal(who);
  var box=$('qopts').children;
  for(var i=0;i<box.length;i++) if(box[i].textContent===G.q.correct) box[i].classList.add('right');

  if(!opts.length){ G.outOf[who]=true; paint(); return nextTurn(); }

  if(right){
    $('say').textContent=nameOf(who)+' got it. Choosing a step\u2026';
    $('say').className='say good';
    opts.forEach(function(i){ $('board').children[i].classList.add('lit'); });
    G.qId=G.qId+':step';
    writeState();
    waitForStep(who,opts);
  } else {
    $('say').textContent=(choice==='__timeout__'?nameOf(who)+' hesitated.':nameOf(who)+' got it wrong.')+' The water chooses.';
    $('say').className='say bad';
    /* the step that surrenders the most ground */
    var worst=opts[0], worstScore=1e9;
    opts.forEach(function(o){
      var from=G.pos[who], wasSolid=G.solid[from];
      G.solid[from]=false; G.pos[who]=o;
      var s=groundFor(who);
      G.pos[who]=from; G.solid[from]=wasSolid;
      if(s<worstScore){ worstScore=s; worst=o; }
    });
    setTimeout(function(){ stepTo(who,worst); },1100);
  }
}

function waitForStep(who,opts){
  clearInterval(pollTimer);
  var started=Date.now();
  pollTimer=setInterval(async function(){
    var rows=await sb('moves?code=eq.'+G.code+'&player_id=eq.'+who+'&q_id=eq.'+encodeURIComponent(G.qId)+'&select=choice');
    if(rows && rows.length){
      var t=parseInt(rows[0].choice,10);
      if(opts.indexOf(t)>=0){ clearInterval(pollTimer); stepTo(who,t); return; }
    }
    if(Date.now()-started>30000){
      clearInterval(pollTimer);
      stepTo(who,opts[(Math.random()*opts.length)|0]);
    }
  },800);
}

function stepTo(who,tile){
  var from=G.pos[who];
  G.pos[who]=tile;
  G.solid[from]=false;
  paint();
  setTimeout(nextTurn,700);
}
function nextTurn(){
  $('say').textContent=''; $('say').className='say';
  G.turn=(G.turn+1)%G.order.length;
  if(alive().length<=1) return finish();
  askTurn();
}

function finish(){
  clearInterval(pollTimer);
  G.phase='over';
  var left=alive();
  $('stage').classList.remove('on');
  $('endStage').classList.add('on');
  if(left.length===1){
    $('wTitle').textContent=nameOf(left[0])+' is still standing';
    $('wSub').textContent='Everyone else went under.';
  } else {
    $('wTitle').textContent='Everyone went under';
    $('wSub').textContent='Nobody found dry board.';
  }
  writeState();
}

$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',function(){
  G.phase='lobby'; $('endStage').classList.remove('on'); $('lobby').style.display='';
  $('stage').classList.remove('on'); used={}; writeState(); pollPlayers();
});

createRoom().then(function(){ pollPlayers(); setInterval(function(){ if(G.phase==='lobby') pollPlayers(); },1500); });
window.__SR=G;
</script>
</body>
</html>
