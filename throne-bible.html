<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold The Throne · Bible Edition — Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#0e1230;--indigo2:#080a1c;--panel:#151936;--gold:#f5b23e;--gold-hi:#ffd47a;--teal:#2fb6a6;--teal-hi:#79e6d8;--ink:#f4eede;--dim:#b7b0a2;--line:rgba(245,178,62,.18);--good:#57d38a;--bad:#e0728a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  .hide{display:none!important;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 70% at 50% -10%,rgba(245,178,62,.10),transparent 55%),linear-gradient(180deg,#0e1230,#080a1c);min-height:100vh;overflow-x:hidden;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(20px,2.4vw,30px);}
  .brand b{color:var(--gold-hi);}
  .brand .ed{font-family:'Nunito';font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-hi);vertical-align:middle;margin-left:6px;}
  .status{font-weight:800;font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;background:#555;}
  .dot.live{background:var(--good);box-shadow:0 0 10px var(--good);}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 22px 60px;}

  /* lobby */
  .lobby{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;}
  .hymn{text-align:center;}
  .hymn .lab{font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-size:12px;}
  .code{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(44px,7vw,84px);letter-spacing:.14em;color:var(--gold-hi);margin:6px 0;}
  .qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:8px;margin:12px auto 8px;}
  .qr img{width:100%;height:100%;}
  .url{font-weight:800;color:var(--teal-hi);font-size:15px;word-break:break-all;}
  .plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .pchip{background:rgba(255,255,255,.06);border-radius:999px;padding:6px 14px;font-weight:800;}
  .hd{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin-bottom:12px;}
  .btn{border:0;border-radius:12px;padding:14px 22px;font-weight:900;font-size:17px;cursor:pointer;font-family:inherit;}
  .go{background:linear-gradient(180deg,var(--gold),#e0912f);color:#241a12;}
  a.url{display:inline-block;text-decoration:none;}
  a.url:hover{text-decoration:underline;}
  .btn.copy{margin-top:12px;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);font-size:14px;padding:10px 16px;}
  .btn.copy.done{background:rgba(87,211,138,.18);color:var(--good);}
  .btn:disabled{opacity:.4;cursor:default;}
  .row{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;}
  .step{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--dim);}
  .step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer;}

  /* arena */
  .arena{display:none;}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .qnum{font-weight:800;color:var(--gold-hi);letter-spacing:.06em;}
  .qmeta{color:var(--dim);font-weight:800;}
  .qbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center;margin-bottom:14px;}
  .qtext{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,3vw,38px);line-height:1.25;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
  .opt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:2px solid transparent;border-radius:12px;padding:14px 16px;font-weight:800;font-size:clamp(15px,1.8vw,21px);text-align:left;}
  .opt .k{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#12162e;}
  .opt.c0 .k{background:#f5b23e;}.opt.c1 .k{background:#2fb6a6;}.opt.c2 .k{background:#8f7be6;}.opt.c3 .k{background:#e0728a;}
  .opt.right{border-color:var(--good);background:rgba(87,211,138,.14);}
  .opt.wrong{border-color:var(--bad);opacity:.6;}
  .timer{height:12px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:16px;}
  .timer > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .25s linear;}
  .timer.ans > i{background:linear-gradient(90deg,var(--teal),var(--teal-hi));}

  .seats{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:16px 0;}
  .seat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;position:relative;}
  .seat.champ{border-color:rgba(245,178,62,.5);box-shadow:0 0 0 1px rgba(245,178,62,.25);}
  .seat .role{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--dim);}
  .seat.champ .role{color:var(--gold-hi);}
  .seat .who{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(20px,2.4vw,30px);margin-top:4px;}
  .seat .streak{margin-top:6px;font-weight:900;color:var(--gold-hi);}
  .seat.buzzed{outline:3px solid var(--teal-hi);}
  .vs{font-family:'Fraunces',serif;font-weight:700;color:var(--dim);font-size:22px;}
  .crown{font-size:26px;position:absolute;top:-14px;left:50%;transform:translateX(-50%);}

  .queue{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
  .queue .lab{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--dim);margin-bottom:8px;}
  .queue .qq{display:flex;flex-wrap:wrap;gap:8px;}
  .queue .qq span{background:rgba(255,255,255,.05);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;}
  .queue .empty{color:var(--dim);font-weight:700;}
  .progress{height:7px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-bottom:14px;}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-hi));transition:width .3s;}
  .beststreak{text-align:center;color:var(--dim);font-weight:800;margin-top:12px;font-size:14px;}
  .beststreak b{color:var(--gold-hi);}
  .hostrow{display:flex;justify-content:center;margin-bottom:8px;}
  .host{position:relative;width:clamp(150px,26vw,240px);height:clamp(140px,20vh,210px);}
  .host canvas{position:absolute;inset:0;width:100%;height:100%;}
  .hostbubble{position:absolute;top:-4px;left:50%;transform:translateX(-50%);background:#f7efdd;color:#2a2519;font-family:'Fraunces',serif;font-weight:600;font-size:14px;padding:7px 13px;border-radius:13px;box-shadow:0 6px 16px rgba(0,0,0,.4);white-space:nowrap;z-index:3;}
  .hostbubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#f7efdd;border-bottom:0;}
  .hostbubble.hide{display:none;}
  .hostbubble.pop{animation:bpop .35s cubic-bezier(.2,1.3,.4,1) both;}
  @keyframes bpop{from{opacity:0;transform:translateX(-50%) translateY(-5px) scale(.85);}to{opacity:1;transform:translateX(-50%);}}
  .banner.good{animation:bgood .5s ease both;} @keyframes bgood{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ .hostbubble.pop,.banner.good{animation:none;} }
  .hoflist{display:flex;flex-direction:column;gap:8px;}
  .hofempty{color:var(--dim);font-weight:700;}
  .hofrow{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.04);border-radius:11px;padding:9px 13px;font-weight:800;}
  .hofrow .em{font-size:18px;}
  .hofrow .nm{flex:1;}
  .hofrow .st{color:var(--dim);font-size:13px;font-weight:800;}
  .hofrow.legend{background:rgba(245,178,62,.13);border:1px solid rgba(245,178,62,.32);}
  .hofrow.legend .nm{color:var(--gold-hi);}

  .banner{text-align:center;font-family:'Fraunces',serif;font-weight:700;font-size:clamp(22px,3.2vw,40px);padding:26px;}
  .banner.good{color:var(--good);}.banner.bad{color:var(--bad);}
  .sub{color:var(--dim);font-weight:800;margin-top:8px;font-family:'Nunito';font-size:16px;}
  .ops{position:fixed;bottom:14px;right:14px;display:flex;gap:8px;}
  .ops button{border:1px solid var(--line);background:rgba(20,24,52,.9);color:var(--dim);border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:13px;}
  @media(max-width:720px){.lobby{grid-template-columns:1fr;}.opts{grid-template-columns:1fr;}.seats{grid-template-columns:1fr;}.vs{display:none;}}
</style>
</head>
<body>
  <div class="top"><div class="brand">Hold The <b>Throne</b> <span class="ed">Bible Edition</span></div><div class="status"><span class="dot" id="dot"></span><span id="stat">starting…</span></div></div>
  <div class="wrap">

    <div class="lobby" id="lobby">
      <div class="card hymn">
        <div class="lab">Join code</div>
        <div class="code" id="code">·····</div>
        <div class="qr" id="qrwrap"><img id="qr" alt="Join QR"></div>
        <a class="url" id="url" target="_blank" rel="noopener">tierbrain.github.io/throne-bible-play.html</a>
        <div><button class="btn copy" id="copyBtn" type="button">Copy join link</button></div>
      </div>
      <div class="card">
        <div class="hd">Challengers <span id="pcount" style="color:var(--dim)">(0)</span></div>
        <div class="plist" id="plist"><span class="empty" style="color:var(--dim);font-weight:700">Waiting for players to join…</span></div>
        <div class="row">
          <div class="step">Questions
            <button id="qMinus">–</button><span id="qTot">20</span><button id="qPlus">+</button>
          </div>
        </div>
        <div class="row"><button class="btn go" id="startBtn" disabled>Start the game ▸</button>
          <span style="color:var(--dim);font-weight:700;font-size:14px">Need 2+ players</span></div>
      </div>
      <div class="card hof" id="hofCard" style="grid-column:1/-1">
        <div class="hd">🏆 Hall of Fame</div>
        <div id="hofList" class="hoflist"><span class="hofempty">No champions yet — be the first!</span></div>
      </div>
    </div>

    <div class="arena" id="arena">
      <div class="hostrow"><div class="host"><canvas id="hostCv"></canvas><div class="hostbubble hide" id="hostBubble"></div></div></div>
      <div id="playView">
        <div class="qhead"><span class="qnum" id="qnum">Question 1</span><span class="qmeta" id="qmeta">of 20</span></div>
        <div class="progress"><i id="prog"></i></div>
        <div class="qbox">
          <div class="qtext" id="qtext">—</div>
          <div class="opts" id="opts"></div>
          <div class="timer" id="timerWrap"><i id="timer"></i></div>
        </div>
        <div class="seats">
          <div class="seat champ" id="seatChamp"><div class="crown">👑</div><div class="role">On the throne</div><div class="who" id="champName">—</div><div class="streak" id="champStreak"></div></div>
          <div class="vs">vs</div>
          <div class="seat" id="seatChal"><div class="role">Challenger</div><div class="who" id="chalName">—</div><div class="streak" id="chalTag"></div></div>
        </div>
        <div class="queue"><div class="lab">Queue</div><div class="qq" id="queue"><span class="empty">—</span></div></div>
        <div class="beststreak" id="best"></div>
      </div>
      <div id="bannerView" class="hide"><div class="banner" id="banner">—</div></div>
    </div>

  </div>
  <div class="ops"><button id="muteBtn" title="Sound">🔊</button><button id="newBtn">New room</button></div>

<script>

/* ---- Chapter & Verse — animated host (first pass; tunable) ---- */
(function(){
  const HCV=document.getElementById('hostCv'); if(!HCV) return;
  const X=HCV.getContext('2d');
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let HW=0,HH=0,HDPR=1,started=false;
  function hsize(){ const r=HCV.parentElement.getBoundingClientRect(); if(!r.width) return;
    HW=r.width; HH=r.height; HDPR=Math.min(2,window.devicePixelRatio||1);
    HCV.width=HW*HDPR; HCV.height=HH*HDPR; X.setTransform(HDPR,0,0,HDPR,0,0); }
  window.addEventListener('resize',hsize);
  const lerp=(a,b,t)=>a+(b-a)*t, clamp01=x=>x<0?0:x>1?1:x, ease=x=>{x=clamp01(x);return x*x*(3-2*x);};
  const rgb=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
  const rgba=(c,a)=>'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';
  const shade=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
  function circ(x,y,r){X.beginPath();X.arc(x,y,r,0,7);X.fill();}
  function rrp(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
  const SKIN=[150,96,60], SKSH=shade(SKIN,0.80), HAIR=[38,28,24];
  const JACKET=[214,158,54], JKSH=shade(JACKET,0.72), LAPEL=[26,30,66], SHIRT=[245,238,224], TIE=[176,60,80], TIESH=shade(TIE,0.75);
  const POSES={
    idle:     {lUp:.02,lOut:.10,rUp:.02,rOut:.10,smile:.45,browR:.12,browA:0,  look:0,  open:0, point:0},
    welcome:  {lUp:.82,lOut:.85,rUp:.82,rOut:.85,smile:1,  browR:.55,browA:.12,look:0,  open:.4,point:0},
    present:  {lUp:.06,lOut:.12,rUp:.55,rOut:1.0,smile:.75,browR:.4, browA:.05,look:.55,open:0, point:0},
    point:    {lUp:.05,lOut:.10,rUp:1.0,rOut:.35,smile:.85,browR:.65,browA:.18,look:.15,open:.4,point:1},
    celebrate:{lUp:1.0,lOut:.7, rUp:1.0,rOut:.7, smile:1,  browR:.6, browA:.12,look:0,  open:.5,point:0},
    ask:      {lUp:.06,lOut:.12,rUp:.5, rOut:.9, smile:.5, browR:.35,browA:.05,look:.35,open:0, point:0},
    wince:    {lUp:.08,lOut:.16,rUp:.12,rOut:.22,smile:-.4,browR:-.12,browA:.35,look:0,  open:0, point:0},
    calm:     {lUp:.09,lOut:.18,rUp:.09,rOut:.18,smile:.42,browR:.12,browA:0,  look:0,  open:0, point:0}
  };
  const REEL=[{p:'idle',d:2600},{p:'welcome',d:3200,say:1},{p:'present',d:3000},{p:'point',d:2600,say:1},{p:'celebrate',d:2600}];
  const FIELDS=['lUp','lOut','rUp','rOut','smile','browR','browA','look','open','point'];
  const TRANS=650;
  let A=Object.assign({},POSES.idle), from=Object.assign({},POSES.idle), ri=0, stepStart=0;
  let mode='reel', holdPose='idle'; const TALK={welcome:1,ask:1,celebrate:1};

  function drawArm(side,sx,sy,s,up,out,point,T){
    const sway=Math.sin(T*0.0016+side)*s*0.03;
    const hx=sx+side*s*(0.5+out*0.55), hy=sy+s*(0.9-up*2.0)+sway;
    const ex=sx+side*s*(0.34+out*0.4), ey=sy+s*(0.5-up*0.95);
    X.lineCap='round'; X.lineJoin='round';
    X.strokeStyle=rgb(JKSH); X.lineWidth=s*0.36;
    X.beginPath(); X.moveTo(sx,sy); X.lineTo(ex,ey); X.lineTo(hx,hy); X.stroke();
    X.fillStyle=rgb(SHIRT); circ(hx,hy,s*0.12);
    X.fillStyle=rgb(SKIN); circ(hx,hy,s*0.15);
    if(point>0.5){ X.save(); X.translate(hx,hy); X.rotate(Math.atan2(hy-ey,hx-ex));
      X.fillStyle=rgb(SKIN); rrp(0,-s*0.07,s*0.34*point,s*0.14,s*0.07); X.fill(); X.restore(); }
  }
  function star(x,y,r){ X.save(); X.translate(x,y); X.beginPath();
    for(let i=0;i<8;i++){ const a=i/8*Math.PI*2, rr=(i%2? r*0.4:r); const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0) X.moveTo(px,py); else X.lineTo(px,py); }
    X.closePath(); X.fill(); X.restore(); }

  function draw(P,T,openNow){
    X.clearRect(0,0,HW,HH);
    const s=Math.min(HW,HH)*0.15, cx=HW/2;
    const br=Math.sin(T*0.0022)*s*0.03, tilt=Math.sin(T*0.0013)*0.02;
    const shoulderY=HH*0.60, shHalf=s*1.18;
    const gg=X.createRadialGradient(cx,HH*0.30,0,cx,HH*0.34,HH*0.8);
    gg.addColorStop(0,'rgba(255,214,140,0.20)'); gg.addColorStop(0.5,'rgba(255,214,140,0.05)'); gg.addColorStop(1,'rgba(255,214,140,0)');
    X.fillStyle=gg; X.fillRect(0,0,HW,HH);
    X.fillStyle='rgba(0,0,0,0.28)'; X.save(); X.translate(cx,HH*0.99); X.scale(1,0.16); circ(0,0,s*1.5); X.restore();
    drawArm(-1, cx-shHalf*0.86, shoulderY+br, s, P.lUp, P.lOut, 0, T);
    X.fillStyle=rgb(JACKET);
    X.beginPath(); X.moveTo(cx-shHalf,shoulderY+br);
    X.quadraticCurveTo(cx-shHalf*1.2,HH*0.9,cx-shHalf*1.25,HH+s); X.lineTo(cx+shHalf*1.25,HH+s);
    X.quadraticCurveTo(cx+shHalf*1.2,HH*0.9,cx+shHalf,shoulderY+br); X.closePath(); X.fill();
    const collarY=shoulderY+br+s*0.05;
    X.fillStyle=rgb(SHIRT); X.beginPath(); X.moveTo(cx-s*0.5,collarY); X.lineTo(cx+s*0.5,collarY); X.lineTo(cx,HH+s); X.closePath(); X.fill();
    X.fillStyle=rgb(LAPEL);
    X.beginPath(); X.moveTo(cx-shHalf*0.9,shoulderY+br); X.lineTo(cx-s*0.12,collarY+s*0.1); X.lineTo(cx-s*0.55,HH*0.98); X.lineTo(cx-shHalf*1.05,HH*0.9); X.closePath(); X.fill();
    X.beginPath(); X.moveTo(cx+shHalf*0.9,shoulderY+br); X.lineTo(cx+s*0.12,collarY+s*0.1); X.lineTo(cx+s*0.55,HH*0.98); X.lineTo(cx+shHalf*1.05,HH*0.9); X.closePath(); X.fill();
    X.fillStyle=rgb(TIE);
    X.beginPath(); X.moveTo(cx,collarY+s*0.18); X.lineTo(cx-s*0.42,collarY-s*0.02); X.lineTo(cx-s*0.42,collarY+s*0.38); X.closePath(); X.fill();
    X.beginPath(); X.moveTo(cx,collarY+s*0.18); X.lineTo(cx+s*0.42,collarY-s*0.02); X.lineTo(cx+s*0.42,collarY+s*0.38); X.closePath(); X.fill();
    X.fillStyle=rgb(TIESH); circ(cx,collarY+s*0.18,s*0.1);
    drawArm(1, cx+shHalf*0.86, shoulderY+br, s, P.rUp, P.rOut, P.point, T);
    const headCY=shoulderY+br - s*1.02, headR=s*0.66;
    X.fillStyle=rgb(SKSH); rrp(cx-s*0.22, headCY+headR*0.5, s*0.44, s*0.6, s*0.16); X.fill();
    X.save(); X.translate(cx+P.look*s*0.12, headCY+br*0.5); X.rotate(tilt+P.look*0.03);
    X.fillStyle=rgb(SKIN); circ(0,0,headR);
    X.save(); X.beginPath(); X.arc(0,0,headR,0,7); X.clip(); X.fillStyle=rgba(SKSH,0.5); circ(headR*0.5,headR*0.2,headR); X.restore();
    X.fillStyle=rgb(SKIN); circ(-headR*0.98,0,headR*0.16); circ(headR*0.98,0,headR*0.16);
    X.fillStyle=rgb(HAIR);
    X.beginPath(); X.arc(0,-headR*0.12,headR*0.99,Math.PI*1.04,Math.PI*1.96);
    X.quadraticCurveTo(headR*0.7,-headR*1.1,0,-headR*1.02); X.quadraticCurveTo(-headR*0.7,-headR*1.1,-headR*0.98,-headR*0.2); X.fill();
    const eY=-headR*0.02, eX=headR*0.36, bl=((T*0.001+0.3)%3.6)>3.42;
    const px=P.look*headR*0.14;
    for(const sx of [-1,1]){

  if(ok){ await win(G.answerer); return; }
  if(!G.firstResolved){ G.firstResolved=true; G.lockedOut.push(G.answerer.id);
    const opp=(G.answerer.id===G.champ.id)?G.chal:G.champ; G.answerer={id:opp.id,name:opp.name}; G.ansWin=Date.now()+ANS_MS; writeState();
  } else { await bothMiss(); }
}
async function win(p){
  const isChamp = G.champ && p.id===G.champ.id;
  G.pendingLoser = isChamp? G.chal : G.champ;
  if(isChamp){ G.streak++; } else { G.champ={id:p.id,name:p.name}; G.streak=1; }
  G.totalCorrect[p.id]=(G.totalCorrect[p.id]||0)+1;
  G.bestStreak[p.id]=Math.max(G.bestStreak[p.id]||0, G.streak);
  G.lastWinner={id:p.id,name:p.name};
  if(G.pendingLoser) blemish(G.pendingLoser.id);
  SFX.correct(); HS('celebrate');
  G.outcome='win';
  banner(true, esc(p.name)+' takes it!', G.streak>1?('A streak of '+G.streak+'!'):'Holds the throne.');
}
function blemish(id){ if(id && G.blemished.indexOf(id)<0) G.blemished.push(id); }
function nameFor(id){ if(G.champ&&G.champ.id===id) return G.champ.name; if(G.chal&&G.chal.id===id) return G.chal.name; const q=G.queue.find(p=>p.id===id); if(q) return q.name; const p=G.players.find(x=>x.id===id); return p?p.name:'\u2014'; }
function streakKing(){ let best=null; Object.keys(G.bestStreak).forEach(function(id){ const sc=G.bestStreak[id]; if(!best || sc>best.s || (sc===best.s && (G.totalCorrect[id]||0)>(G.totalCorrect[best.id]||0))){ best={id:id, s:sc, name:nameFor(id)}; } }); return best; }
async function bothMiss(){ G.outcome='bothmiss'; G.pendingLoser=null;
  if(G.champ) blemish(G.champ.id); if(G.chal) blemish(G.chal.id);
  SFX.wrong(); HS('wince');
  banner(false, 'Nobody got it!', 'Both step aside — two new challengers.');
}
function banner(ok,msg,sub){
  G.phase='reveal'; G.revealOk=ok; G.revealMsg=msg; G.revealSub=sub; writeState(); render();
  clearTimeout(G._t); G._t=setTimeout(afterReveal, REVEAL_MS);
}
function afterReveal(){
  if(G.mode==='finale'){
    if(G.outcome==='finalewin'){ finishGame(G.finaleWinner); return; }
    G.phase='between'; G.betweenMsg=scoreStr(); writeState(); render();
    clearTimeout(G._t); G._t=setTimeout(nextFinaleQuestion, BETWEEN_MS); return;
  }
  if(G.outcome==='win'){ enqueue(G.pendingLoser); G.chal=dequeue(); }
  else if(G.outcome==='bothmiss'){ enqueue(G.champ); enqueue(G.chal); G.champ=dequeue(); G.chal=dequeue(); G.streak=0; }
  if(!G.champ || !G.chal){ G.phase='gameover'; G.winner=G.champ||G.chal; G.deadmsg='Not enough players left.'; writeState(); render(); return; }
  G.phase='between'; G.betweenMsg = (G.streak>0? (esc(G.champ.name)+' holds — streak '+G.streak) : 'Fresh duel!')+' · Next: '+esc(G.chal.name);
  writeState(); render();
  clearTimeout(G._t); G._t=setTimeout(nextOrEnd, BETWEEN_MS);
}
function nextOrEnd(){
  if(G.qIndex>=G.qTotal){
    if(G.outcome==='win'){ G.closer=G.lastWinner; enterFinale(); return; }
    nextQuestion(); return;   // both-miss on/after the final question -> sudden-death decider
  }
  nextQuestion();
}
function enterFinale(){
  const sk=streakKing(); const closer=G.closer;
  if(!closer){ finishGame(G.champ); return; }
  if(!sk || sk.id===closer.id || !isLive(sk.id)){ finishGame({id:closer.id,name:closer.name}); return; }
  if(!isLive(closer.id)){ finishGame({id:sk.id,name:sk.name}); return; }
  G.mode='finale';
  G.finalists={ closer:{id:closer.id,name:closer.name}, king:{id:sk.id,name:sk.name} };
  G.champ={id:closer.id,name:closer.name}; G.chal={id:sk.id,name:sk.name}; G.queue=[]; G.streak=0;
  G.finaleScore={}; G.finaleScore[closer.id]=0; G.finaleScore[sk.id]=0;
  G.phase='finintro'; G.finIntroMsg='Grand Finale! '+esc(closer.name)+' vs '+esc(sk.name)+' — first to 2 wins.';
  SFX.sting(); HS('present'); hostSay(pick(QUIPS.finale));
  writeState(); render();
  clearTimeout(G._t); G._t=setTimeout(serveQuestion, 3200);
}
function scoreStr(){ const c=G.finalists.closer, k=G.finalists.king; return esc(c.name)+' '+(G.finaleScore[c.id]||0)+' — '+(G.finaleScore[k.id]||0)+' '+esc(k.name); }
function gradeFinale(ok){
  if(ok){ const id=G.answerer.id; G.finaleScore[id]=(G.finaleScore[id]||0)+1; SFX.correct(); HS('celebrate');
    if(G.finaleScore[id]>=2){ G.finaleWinner={id:id,name:G.answerer.name}; G.outcome='finalewin'; banner(true, esc(G.answerer.name)+' wins the Finale!', scoreStr()); }
    else { G.outcome='finalepoint'; banner(true, esc(G.answerer.name)+' scores!', scoreStr()); }
  } else {
    if(!G.firstResolved){ G.firstResolved=true; G.lockedOut.push(G.answerer.id); const opp=(G.answerer.id===G.champ.id)?G.chal:G.champ; G.answerer={id:opp.id,name:opp.name}; G.ansWin=Date.now()+ANS_MS; writeState(); }
    else { G.outcome='finalemiss'; banner(false, 'Nobody got it!', scoreStr()+' — next question.'); }
  }
}
function finishGame(winner){ G.phase='gameover'; G.winner=winner; const sk=streakKing(); SFX.fanfare(); SFX.applause(); HS('celebrate'); hostSay(pick(QUIPS.win));
  const flawless=(winner && G.blemished.indexOf(winner.id)<0);
  G.summary={ champ:winner, closer:G.closer, streakKing:sk, flawless:flawless, finaleScore:G.finaleScore||null, finalists:G.finalists||null };
  writeState(); render(); writeLegend(winner, flawless);
}
function pickQuestion(){ let cand=POOL.filter(o=>!G.used.has(o.tag||slug(o.correct))); if(!cand.length){ G.used=new Set(); cand=POOL.slice(); } const it=cand[Math.floor(Math.random()*cand.length)]; G.used.add(it.tag||slug(it.correct)); return it; }
function serveQuestion(){ const it=pickQuestion(); const opts=shuffle([it.correct].concat(it.wrong));
  G.q={ q:it.q, opts, correctIdx:opts.indexOf(it.correct) };
  G.qId=G.code+':'+(G.mode==='finale'?'F':'')+G.qIndex+':'+Math.floor(Math.random()*1e6);
  G.answerer=null; G.buzzWin=Date.now()+BUZZ_MS; G.ansWin=0; G.lockedOut=[]; G.firstResolved=false; G.outcome=null;
  G.phase='live'; G._lastTick=null; HS('ask'); writeState(); render();
}
function nextQuestion(){ G.qIndex++; serveQuestion(); }
function nextFinaleQuestion(){ serveQuestion(); }
function endGame(){ G.phase='gameover'; const sk=streakKing(); G.winner=G.champ;
  G.summary={ champ:G.champ, closer:G.lastWinner, streakKing:sk, flawless:(G.champ && G.blemished.indexOf(G.champ.id)<0) };
  writeState(); render(); }

async function startGame(){
  const live=livePlayers(); if(live.length<2){ return; }
  const order=shuffle(live.map(p=>({id:p.id,name:p.name})));
  G.champ=order[0]; G.chal=order[1]; G.queue=order.slice(2);
  G.streak=0; G.qIndex=0; G.used=new Set();
  G.bestStreak={}; G.totalCorrect={}; G.blemished=[]; G.lastWinner=null; G.summary=null;
  G.mode='spine'; G.closer=null; G.finalists=null; G.finaleScore=null; G.finaleWinner=null;
  $('lobby').style.display='none'; $('arena').style.display='block';
  try{ window.dispatchEvent(new Event('resize')); }catch(e){}
  SFX.on(); SFX.theme(); HS('welcome'); hostSay(pick(QUIPS.welcome));
  nextQuestion();
}

function writeState(){
  const st={ game:'throne', phase:G.phase, champ:G.champ, chal:G.chal, queue:G.queue, streak:G.streak,
    qIndex:G.qIndex, qTotal:G.qTotal, q:G.q?{q:G.q.q, opts:G.q.opts}:null, qId:G.qId, answerer:G.answerer, lockedOut:G.lockedOut,
    buzzWin:(G.phase==='live'&&!G.answerer)?G.buzzWin:0, ansWin:(G.phase==='live'&&G.answerer)?G.ansWin:0,
    reveal:G.phase==='reveal'?{ok:G.revealOk,msg:G.revealMsg,sub:G.revealSub,correctIdx:G.q?G.q.correctIdx:-1}:null,
    between:G.phase==='between'?{msg:G.betweenMsg}:null,
    mode:G.mode, finintro:G.phase==='finintro'?{msg:G.finIntroMsg}:null, finaleScore:G.finaleScore||null, finalists:G.finalists||null,
    winner:G.phase==='gameover'?G.winner:null, summary:G.phase==='gameover'?G.summary:null };
  setRoom({phase:G.phase, q_id:G.qId||'', state:st});
}

/* ---------- render ---------- */
function renderLobby(){
  const live=livePlayers();
  $('pcount').textContent='('+live.length+')';
  const pl=$('plist');
  if(!live.length){ pl.innerHTML='<span class="empty" style="color:var(--dim);font-weight:700">Waiting for players to join…</span>'; }
  else { pl.innerHTML=''; live.forEach(p=>{ const s=document.createElement('span'); s.className='pchip'; s.textContent=p.name; pl.appendChild(s); }); }
  $('startBtn').disabled = live.length<2;
}
function render(){
  if(G.phase==='lobby'){ renderLobby(); return; }
  const showBanner = (G.phase==='reveal'||G.phase==='between'||G.phase==='gameover'||G.phase==='finintro');
  $('playView').classList.toggle('hide', showBanner);
  $('bannerView').classList.toggle('hide', !showBanner);
  if(showBanner){
    const b=$('banner');
    if(G.phase==='finintro'){ b.className='banner good'; b.innerHTML='👑 Grand Finale<div class="sub">'+esc(G.finIntroMsg||'')+'</div>'; }
    else if(G.phase==='reveal'){ b.className='banner '+(G.revealOk?'good':'bad'); b.innerHTML=G.revealMsg+'<div class="sub">'+(G.revealSub||'')+'</div>'; }
    else if(G.phase==='between'){ b.className='banner'; b.innerHTML='<div class="sub" style="font-size:22px">'+(G.betweenMsg||'')+'</div>'; }
    else if(G.phase==='gameover'){ b.className='banner good'; const su=G.summary||{}; const sk=su.streakKing;
      let sub=''; if(G.deadmsg){ sub=G.deadmsg; } else { const bits=[]; if(sk&&sk.s>0) bits.push('Longest streak: '+sk.s+' by '+esc(sk.name)); if(su.closer&&su.closer.name) bits.push('Last question: '+esc(su.closer.name)); if(su.flawless) bits.push('A FLAWLESS LEGEND! 👑'); bits.push('Added to the Hall of Fame'); sub=bits.join(' · ')||('After '+G.qTotal+' questions.'); }
      b.innerHTML='👑 '+esc((G.winner&&G.winner.name)||'—')+' holds the throne!<div class="sub">'+sub+'</div>'; }
    return;
  }
  // play view
  $('qnum').textContent='Question '+G.qIndex; $('qmeta').textContent='of '+G.qTotal;
  { const pr=$('prog'); if(pr) pr.style.width=Math.min(100,(G.qIndex/G.qTotal)*100)+'%'; }
  { const be=$('best'); if(be){ const sk=streakKing(); be.textContent = (sk&&sk.s>0)? ('Longest streak so far: '+sk.s+' — '+sk.name) : ''; } }
  if(G.mode==='finale' && G.finalists){ $('qnum').textContent='Grand Finale'; $('qmeta').textContent='first to 2'; const pr=$('prog'); if(pr) pr.style.width='100%'; const be=$('best'); if(be) be.textContent=scoreStr(); }
  $('qtext').textContent=G.q?G.q.q:'—';
  const opts=$('opts'); opts.innerHTML='';
  (G.q?G.q.opts:[]).forEach((o,i)=>{ const d=document.createElement('div'); d.className='opt c'+i; const k=document.createElement('span'); k.className='k'; k.textContent='ABCD'[i]; const t=document.createElement('span'); t.textContent=o; d.appendChild(k); d.appendChild(t); opts.appendChild(d); });
  // timer
  const now=Date.now(); const wrap=$('timerWrap'); const bar=$('timer');
  if(G.answerer){ wrap.classList.add('ans'); const frac=Math.max(0,Math.min(1,(G.ansWin-now)/ANS_MS)); bar.style.width=(frac*100)+'%'; }
  else { wrap.classList.remove('ans'); const remain=G.buzzWin-now; const frac=Math.max(0,Math.min(1,remain/BUZZ_MS)); bar.style.width=(frac*100)+'%';
    if(remain>0 && remain<2600){ const sec=Math.ceil(remain/1000); if(G._lastTick!==sec){ G._lastTick=sec; SFX.tick(); } } }
  // seats
  $('champName').textContent=G.champ?G.champ.name:'—';
  $('champStreak').textContent=(G.mode==='finale'&&G.finaleScore)?('Points: '+(G.finaleScore[G.champ.id]||0)):(G.streak>0?('Streak '+G.streak):'');
  $('chalName').textContent=G.chal?G.chal.name:'—';
  $('seatChamp').classList.toggle('buzzed', !!(G.answerer&&G.champ&&G.answerer.id===G.champ.id));
  $('seatChal').classList.toggle('buzzed', !!(G.answerer&&G.chal&&G.answerer.id===G.chal.id));
  $('chalTag').textContent = (G.mode==='finale'&&G.finaleScore&&G.chal)?('Points: '+(G.finaleScore[G.chal.id]||0)):(G.answerer? (G.answerer.id===(G.chal&&G.chal.id)?'answering…':'') : '');
  // queue
  const q=$('queue'); const liveQ=G.queue.filter(p=>isLive(p.id));
  if(!liveQ.length){ q.innerHTML='<span class="empty">— nobody waiting —</span>'; }
  else { q.innerHTML=''; liveQ.forEach((p,i)=>{ const s=document.createElement('span'); s.textContent=(i+1)+'. '+p.name; q.appendChild(s); }); }
}

/* ---------- controls ---------- */
$('startBtn').addEventListener('click', startGame);
$('qMinus').addEventListener('click', ()=>{ G.qTotal=Math.max(3,G.qTotal-1); $('qTot').textContent=G.qTotal; });
$('qPlus').addEventListener('click', ()=>{ G.qTotal=Math.min(20,G.qTotal+1); $('qTot').textContent=G.qTotal; });
$('newBtn').addEventListener('click', ()=>{ clearTimeout(G._t); location.reload(); });
{ let muted=false; const mb=$('muteBtn'); if(mb) mb.addEventListener('click', ()=>{ muted=!muted; SFX.mute(muted); mb.textContent=muted?'🔇':'🔊'; }); }
{ const cb=$('copyBtn'); if(cb) cb.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(G.joinLink||''); }catch(e){ try{ const t=document.createElement('textarea'); t.value=G.joinLink||''; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }catch(_){} } cb.textContent='Copied \u2713'; cb.classList.add('done'); setTimeout(()=>{ cb.textContent='Copy join link'; cb.classList.remove('done'); }, 1600); }); }

createRoom();
setInterval(tick, 300);
</script>
