<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chapter &amp; Verse, Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4eede; --ink-dim:#b7b0a2;
    --indigo:#0e1230; --indigo2:#080a1c;
    --gold:#f5b23e; --gold-hi:#ffd47a; --gold-ink:#3a2a10;
    --teal:#2fb6a6; --teal-hi:#79e6d8; --teal-ink:#0c2c29;
    --card:#151936; --line:rgba(245,178,62,.16); --ruby:#c0455e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(120% 70% at 50% -10%, rgba(245,178,62,.10), transparent 55%),
      linear-gradient(180deg,var(--indigo),var(--indigo2)); background-attachment:fixed;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  .app{min-height:100%; max-width:520px; margin:0 auto; padding:22px; display:flex; flex-direction:column;}
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:26px; text-align:center; margin:6px 0 2px;}
  .brand .amp{color:var(--gold);}
  .tagline{text-align:center; color:var(--ink-dim); font-weight:700; font-size:14px; margin-bottom:20px;}

  .screen{flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px;}
  label{font-weight:800; font-size:14px; letter-spacing:.3px; color:var(--ink-dim); display:block; margin:0 0 7px 2px;}
  input{width:100%; font-family:'Nunito'; font-weight:800; font-size:20px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:15px 16px; outline:none;}
  input:focus{border-color:var(--gold);}
  #code{font-family:'Fraunces',serif; letter-spacing:8px; text-align:center; font-size:30px; text-transform:uppercase;}
  .field{margin-bottom:4px;}

  .teams{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .team-btn{border:none; border-radius:16px; padding:22px 12px; font-family:'Fraunces',serif; font-weight:700; font-size:22px;
    cursor:pointer; line-height:1.1; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .08s;}
  .team-btn small{font-family:'Nunito'; font-weight:800; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; opacity:.8;}
  .team-btn:active{transform:scale(.97);}
  .team-btn.youth{background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:var(--gold-ink);}
  .team-btn.adult{background:linear-gradient(180deg,var(--teal-hi),var(--teal)); color:var(--teal-ink);}
  .hint{color:var(--ink-dim); font-size:13px; font-weight:700; text-align:center; margin-top:2px;}
  .err{background:rgba(192,69,94,.16); border:1px solid rgba(192,69,94,.5); color:#f4c3cc; padding:12px 14px;
    border-radius:12px; font-weight:700; font-size:14px; display:none;}
  .err.show{display:block;}

  /* waiting */
  .badge{align-self:center; padding:7px 18px; border-radius:999px; font-family:'Nunito'; font-weight:800; font-size:13px;
    letter-spacing:2px; text-transform:uppercase;}
  .badge.youth{background:rgba(245,178,62,.18); color:var(--gold-hi); border:1px solid rgba(245,178,62,.5);}
  .badge.adult{background:rgba(47,182,166,.16); color:var(--teal-hi); border:1px solid rgba(47,182,166,.5);}
  .in-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px 22px; text-align:center;}
  .in-card .hi{font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:var(--ink-dim); letter-spacing:1px;}
  .in-card .who{font-family:'Fraunces',serif; font-weight:700; font-size:34px; margin:4px 0 14px; line-height:1.1;}
  .score-pill{display:inline-flex; align-items:baseline; gap:8px; background:rgba(255,255,255,.05); border-radius:14px; padding:10px 18px;}
  .score-pill b{font-size:30px;} .score-pill span{color:var(--ink-dim); font-weight:800; font-size:13px; letter-spacing:1px; text-transform:uppercase;}
  .waitline{margin-top:20px; color:var(--ink-dim); font-weight:700;}
  .heart{display:inline-block; width:9px; height:9px; border-radius:50%; background:#57d38a; margin-right:7px; vertical-align:middle; animation:beat 2s infinite;}
  @keyframes beat{0%,100%{opacity:1;}50%{opacity:.35;}}
  .room-note{color:var(--ink-dim); font-weight:800; font-size:13px; text-align:center; margin-top:22px; letter-spacing:1px;}
  .leave{background:none; border:none; color:var(--ink-dim); font-weight:800; font-size:13px; text-decoration:underline; cursor:pointer; margin-top:14px; align-self:center;}
  .big-btn{width:100%; border:none; border-radius:16px; padding:17px; font-family:'Fraunces',serif; font-weight:700; font-size:20px;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:var(--gold-ink); cursor:pointer;}
  .hide{display:none!important;}
  /* game screen */
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .who2{font-family:'Fraunces',serif; font-weight:700; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .playarea{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; min-height:52vh;}
  .pa-title{font-family:'Fraunces',serif; font-weight:700; font-size:30px; text-align:center;}
  .pa-msg{color:var(--ink-dim); font-weight:700; font-size:17px; text-align:center;}
  .pa-qhead{margin-bottom:16px;}
  .pa-prompt{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#b7b0a2;margin-bottom:7px;text-align:center;}
  .pa-question{font-size:21px;font-weight:800;line-height:1.32;text-align:center;color:#f6f0e2;}
  .pa-question.verse{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;}
  .pblank{display:inline-block;min-width:2.4em;border-bottom:2px solid currentColor;margin:0 .16em;vertical-align:baseline;}
  .pa-clues{display:flex;flex-direction:column;gap:7px;}
  .pa-clue{background:rgba(255,255,255,.05);border-radius:9px;padding:9px 13px;font-size:15px;font-weight:700;line-height:1.3;}
  .pa-hint{color:var(--ink-dim); font-weight:800; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; text-align:center;}
  .pa-good{font-family:'Fraunces',serif; font-weight:700; font-size:28px; text-align:center; color:#7fe0a6;}
  .pa-bad{font-family:'Fraunces',serif; font-weight:700; font-size:28px; text-align:center; color:#f0a6b4;}
  .pgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .pbtn{border:none; border-radius:18px; padding:20px 12px; min-height:88px; cursor:pointer; text-align:left;
    background:var(--card); border:2px solid transparent; display:flex; flex-direction:column; gap:8px; align-items:flex-start;
    color:var(--ink); font-family:'Nunito'; transition:transform .08s, opacity .3s;}
  .pbtn:active{transform:scale(.97);}
  .pbtn .pk{width:34px; height:34px; border-radius:9px; background:var(--oc); color:#0e1230;
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:19px;}
  .pbtn .pt{font-weight:800; font-size:16px; line-height:1.15;}
  .pbtn.mine{border-color:var(--oc); box-shadow:0 0 0 3px color-mix(in srgb, var(--oc) 35%, transparent);}
  .pbtn.good{border-color:#57d38a; background:rgba(87,211,138,.15);}
  .pbtn.bad{border-color:#c0455e; background:rgba(192,69,94,.15);}
  .pbtn.dim{opacity:.4;}
  .locked-note{text-align:center; font-weight:800; color:var(--gold-hi); font-size:15px; letter-spacing:.5px;}
  .buzzwrap{display:flex; justify-content:center; padding:12px 0;}
  .buzzbtn{width:min(72vw,300px); height:min(72vw,300px); border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 50% 36%, #ff7a7a, #c0273f 72%); color:#fff; font-family:'Fraunces',serif; font-weight:700;
    font-size:min(16vw,66px); letter-spacing:3px; box-shadow:0 12px 0 #7c1626, 0 18px 40px rgba(0,0,0,.5);
    transition:transform .06s, box-shadow .06s; animation:buzzpulse 1.1s ease-in-out infinite;}
  .buzzbtn:active,.buzzbtn.hit{transform:translateY(8px) scale(.98); box-shadow:0 4px 0 #7c1626, 0 8px 20px rgba(0,0,0,.5);}
  @keyframes buzzpulse{0%,100%{box-shadow:0 12px 0 #7c1626, 0 0 0 0 rgba(255,107,107,.5);}50%{box-shadow:0 12px 0 #7c1626, 0 0 0 22px rgba(255,107,107,0);}}
  .bzcd{height:10px; background:rgba(255,255,255,.1); border-radius:6px; overflow:hidden; margin:6px 0 12px;}
  .bzcdfill{height:100%; width:100%; background:linear-gradient(90deg,#e0728a,#f5b23e); border-radius:6px;}
  .buzzbtn.practice{width:min(46vw,170px); height:min(46vw,170px); font-size:min(9vw,32px);}
  @media (prefers-reduced-motion:reduce){ .buzzbtn{animation:none;} }
  @media (prefers-reduced-motion:reduce){ .heart{animation:none;} }
</style>
</head>
<body>
<div class="app">
  <div class="brand">Chapter <span class="amp">&amp;</span> Verse</div>
  <div class="tagline">a Bible game show</div>

  <!-- JOIN -->
  <div class="screen" id="joinScreen">
    <div class="err" id="err"></div>
    <div class="field">
      <label for="code">Room code (on the big screen)</label>
      <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="•••••">
    </div>
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" maxlength="16" autocomplete="off" placeholder="e.g. Sam">
    </div>
    <div>
      <label>Which team?</label>
      <div class="teams">
        <button class="team-btn youth" data-tag="youth">Youth<small>ages 13–18</small></button>
        <button class="team-btn adult" data-tag="adult">Adult<small>parent / grown-up</small></button>
      </div>
    </div>
    <div class="hint">Tap your team to join.</div>
  </div>

  <!-- WAITING -->
  <div class="screen hide" id="waitScreen">
    <div class="topbar">
      <span class="badge" id="teamBadge">YOUTH</span>
      <span class="who2" id="whoName">,</span>
      <span class="score-pill"><b id="myScore">0</b><span>pts</span></span>
    </div>
    <div id="playArea" class="playarea"></div>
    <div class="room-note">Room <span id="roomTag">,</span> · keep this screen open</div>
    <button class="leave" id="leaveBtn">Leave the game</button>
  </div>
</div>

<script>
const SB_URL='https://cgrbwtcydgfkbqhseeap.supabase.co';
const SB_KEY='sb_publishable_YHNDjX8gcSYJYJVWo_TmMw_8z6BBVAU';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const KEY='cv_player';
let me=null, hb=null, pollTimer=null;

async function sb(path, opts={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path, Object.assign({headers:H}, opts));
  const txt=await r.text();
  if(!r.ok) throw new Error(r.status+': '+txt);
  return txt?JSON.parse(txt):null;
}
function showErr(msg){ const e=$('err'); e.textContent=msg; e.classList.add('show'); }
function clearErr(){ $('err').classList.remove('show'); }

function prefillCode(){
  const m=location.search.match(/[?&]c=([^&]+)/) || location.hash.match(/#([A-Za-z0-9]+)/);
  if(m) $('code').value=decodeURIComponent(m[1]).toUpperCase().slice(0,5);
}

async function roomExists(code){
  const rows=await sb('rooms?code=eq.'+encodeURIComponent(code)+'&select=code,phase');
  return rows&&rows.length?rows[0]:null;
}

async function join(tag){
  clearErr();
  const code=($('code').value||'').trim().toUpperCase();
  const name=($('name').value||'').trim();
  if(code.length<4){ showErr('Enter the room code shown on the big screen.'); return; }
  if(!name){ showErr('Enter your name so it can appear on the board.'); return; }
  try{
    const rm=await roomExists(code);
    if(!rm){ showErr("No show found with code “"+code+"”. Check the big screen and try again."); return; }
    const rows=await sb('players', {method:'POST', headers:Object.assign({Prefer:'return=representation'},H),
      body:JSON.stringify({code, name, tag})});
    me={code, id:rows[0].id, name, tag};
    localStorage.setItem(KEY, JSON.stringify(me));
    enterWaiting();
  }catch(e){
    if(/relation .* does not exist|42P01/i.test(e.message)) showErr('The game isn\'t set up yet. Ask the host.');
    else showErr('Could not join, check your connection and try again.');
  }
}

function enterWaiting(){
  $('joinScreen').classList.add('hide');
  $('waitScreen').classList.remove('hide');
  $('whoName').textContent=me.name;
  $('roomTag').textContent=me.code;
  const badge=$('teamBadge'); badge.textContent = me.tag==='youth'?'YOUTH':'ADULT / PARENT';
  badge.className='badge '+me.tag;
  startHeartbeat(); startPoll();
}

function startHeartbeat(){
  clearInterval(hb);
  const beat=()=> sb('players?id=eq.'+me.id, {method:'PATCH', body:JSON.stringify({last_seen:new Date().toISOString()})}).catch(()=>{});
  beat(); hb=setInterval(beat, 12000);
}
const OPTC=['#f5b23e','#2fb6a6','#8f7be6','#e0728a'], OPTL=['A','B','C','D'];
let curQid=null, answered=false, myChoice=-1, lastSig='';
let bzBuzzedQid=null, bzAnsQid=-1, bzAnsChoice=-1;
let cluesAnsQid=-1, cluesAnsChoice=-1, cluesMyLevel=0;
function area(){ return $('playArea'); }
function setArea(html){ area().innerHTML=html; }
function liveHeader(o){ if(!o||!o.live||!o.qtext) return null;
  const wrap=document.createElement('div'); wrap.className='pa-qhead';
  if(o.prompt){ const p=document.createElement('div'); p.className='pa-prompt'; p.textContent=o.prompt; wrap.appendChild(p); }
  const c=document.createElement('div'); c.className='pa-question'+((o.qkind==='verse-blank'||o.qkind==='verse-ref')?' verse':'');
  if(o.qkind==='verse-blank'){ String(o.qtext).split('{b}').forEach(function(pp,i,arr){ c.appendChild(document.createTextNode(pp)); if(i<arr.length-1){ const b=document.createElement('span'); b.className='pblank'; c.appendChild(b);} }); }
  else if(o.qkind==='verse-ref'){ c.textContent='\u201c'+o.qtext+'\u201d'; }
  else { c.textContent=o.qtext; }
  wrap.appendChild(c); return wrap; }
function cluesHeader(fc){ if(!fc||!fc.live||!fc.clues) return null;
  const wrap=document.createElement('div'); wrap.className='pa-qhead';
  if(fc.cat){ const p=document.createElement('div'); p.className='pa-prompt'; p.textContent='It\u2019s a '+String(fc.cat).toLowerCase()+'\u2026'; wrap.appendChild(p); }
  const list=document.createElement('div'); list.className='pa-clues';
  fc.clues.forEach(function(cl){ const d=document.createElement('div'); d.className='pa-clue'; d.textContent=cl; list.appendChild(d); });
  wrap.appendChild(list); return wrap; }
function renderActive(st){ const opts=(st&&st.opts)||[];
  const wrap=document.createElement('div');
  const qh=liveHeader(st); if(qh) wrap.appendChild(qh);
  const hint=document.createElement('div'); hint.className='pa-hint'; hint.textContent='Tap your answer'; wrap.appendChild(hint);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='pbtn'; b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i];
    const t=document.createElement('span'); t.className='pt'; t.textContent=o;
    b.appendChild(k); b.appendChild(t); b.addEventListener('click',()=>sendAnswer(i,opts)); grid.appendChild(b); });
  wrap.appendChild(grid); area().innerHTML=''; area().appendChild(wrap);
}
function renderLocked(opts){
  const wrap=document.createElement('div');
  const note=document.createElement('div'); note.className='locked-note'; note.textContent='Locked in \u2713'; wrap.appendChild(note);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach((o,i)=>{ const b=document.createElement('div'); b.className='pbtn '+(i===myChoice?'mine':'dim'); b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i];
    const t=document.createElement('span'); t.className='pt'; t.textContent=o; b.appendChild(k); b.appendChild(t); grid.appendChild(b); });
  wrap.appendChild(grid);
  const hint=document.createElement('div'); hint.className='pa-hint'; hint.textContent='Waiting for the timer…'; wrap.appendChild(hint);
  area().innerHTML=''; area().appendChild(wrap);
}
function renderReveal(st,qid){
  const opts=st.opts||[], c=st.correct;
  const mineThis=(curQid===qid && myChoice>=0);
  const wrap=document.createElement('div');
  const qh=liveHeader(st); if(qh) wrap.appendChild(qh);
  const v=document.createElement('div');
  if(mineThis){ v.className=myChoice===c?'pa-good':'pa-bad'; v.textContent=myChoice===c?'\u2713 Correct!':'\u2717 Not this time'; }
  else { v.className='pa-msg'; v.textContent='The answer is…'; }
  wrap.appendChild(v);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach((o,i)=>{ const cls=i===c?'good':(i===myChoice?'bad':'dim'); const b=document.createElement('div'); b.className='pbtn '+cls; b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i];
    const t=document.createElement('span'); t.className='pt'; t.textContent=o; b.appendChild(k); b.appendChild(t); grid.appendChild(b); });
  wrap.appendChild(grid);
  const hint=document.createElement('div'); hint.className='pa-hint'; hint.textContent='Next question coming…'; wrap.appendChild(hint);
  area().innerHTML=''; area().appendChild(wrap);
}
async function sendAnswer(i,opts){ if(answered) return; answered=true; myChoice=i; lastSig=''; renderLocked(opts);
  try{ await sb('answers',{method:'POST', body:JSON.stringify({code:me.code,q_id:curQid,player_id:me.id,tag:me.tag,choice:i})}); }catch(e){} }

let bzActx=null, bzTimer=null;
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function playBuzz(){ try{ if(!bzActx) bzActx=new (window.AudioContext||window.webkitAudioContext)(); const a=bzActx; if(a.state==='suspended') a.resume();
  const t=a.currentTime, dur=0.6;
  const o1=a.createOscillator(), o2=a.createOscillator(); o1.type='sawtooth'; o2.type='sawtooth'; o1.frequency.value=150; o2.frequency.value=158;
  const mix=a.createGain(); mix.gain.value=0.4;
  const lfo=a.createOscillator(); lfo.type='square'; lfo.frequency.value=23; const ld=a.createGain(); ld.gain.value=0.4; lfo.connect(ld); ld.connect(mix.gain);
  o1.connect(mix); o2.connect(mix);
  const out=a.createGain(); out.gain.setValueAtTime(0.0001,t); out.gain.linearRampToValueAtTime(0.5,t+0.015); out.gain.setValueAtTime(0.5,t+dur-0.06); out.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  mix.connect(out); out.connect(a.destination); o1.start(t); o2.start(t); lfo.start(t); o1.stop(t+dur); o2.stop(t+dur); lfo.stop(t+dur); }catch(e){} }
function clearBzTimer(){ if(bzTimer){ clearInterval(bzTimer); bzTimer=null; } }
function renderBuzzer(bz, qid){ clearBzTimer();
  const lane=(bz.lanes&&bz.lanes[me.tag])||{st:'open',out:[]};
  if(bz.phase==='reveal'){ renderBuzzReveal(bz,lane,qid); return; }
  if(bz.phase==='arm'){ setArea('<div class="pa-title">Get ready\u2026</div><div class="pa-msg">Buzzers arming!</div>'); return; }
  if(lane.st==='answering' && lane.bid===me.id){ renderBuzzAnswer(bz,lane,qid); return; }
  if(lane.st==='answering'){ setArea('<div class="pa-title">'+esc(lane.bname||'Someone')+' buzzed in!</div><div class="pa-msg">Watch the big screen\u2026</div>'); return; }
  if(lane.st==='done'){ setArea('<div class="pa-msg">Your team\u2019s done this one, watch the screen.</div>'); return; }
  if((lane.out||[]).indexOf(me.id)>=0){ setArea('<div class="pa-msg">You\u2019re out this one, next question soon.</div>'); return; }
  renderBuzzButton(qid, bz);
}
function renderBuzzButton(qid, bz){
  if(bzBuzzedQid===qid){ setArea('<div class="pa-title">Buzzed!</div><div class="pa-msg"><span class="heart"></span>Waiting to see who was first\u2026</div>'); return; }
  const wrap=document.createElement('div'); wrap.className='buzzwrap';
  const b=document.createElement('button'); b.className='buzzbtn'; b.type='button'; b.textContent='BUZZ';
  b.addEventListener('click', function(){ if(bzBuzzedQid===qid) return; bzBuzzedQid=qid; playBuzz(); b.classList.add('hit');
    try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
    sb('buzzes',{method:'POST', body:JSON.stringify({code:me.code,q_id:qid,player_id:me.id,name:me.name,tag:me.tag})}).catch(function(){});
    lastSig=''; setTimeout(function(){ setArea('<div class="pa-title">Buzzed!</div><div class="pa-msg"><span class="heart"></span>Waiting to see who was first\u2026</div>'); }, 120);
  });
  const hint=document.createElement('div'); hint.className='pa-hint'; hint.textContent='First to buzz gets to answer!';
  area().innerHTML=''; const qh=liveHeader(bz); if(qh) area().appendChild(qh); area().appendChild(wrap); wrap.appendChild(b); area().appendChild(hint);
}
function renderBuzzAnswer(bz,lane,qid){
  if(bzAnsQid===qid && bzAnsChoice>=0){ renderBuzzLocked(bz.opts); return; }
  const wrap=document.createElement('div');
  const qh=liveHeader(bz); if(qh) wrap.appendChild(qh);
  const t=document.createElement('div'); t.className='pa-title'; t.textContent='You buzzed first, answer!'; wrap.appendChild(t);
  const bar=document.createElement('div'); bar.className='bzcd'; const fill=document.createElement('div'); fill.className='bzcdfill'; fill.id='bzcdfill'; bar.appendChild(fill); wrap.appendChild(bar);
  const grid=document.createElement('div'); grid.className='pgrid';
  bz.opts.forEach(function(o,i){ const btn=document.createElement('button'); btn.className='pbtn'; btn.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i]; const tx=document.createElement('span'); tx.className='pt'; tx.textContent=o;
    btn.appendChild(k); btn.appendChild(tx); btn.addEventListener('click', function(){ sendBuzzAnswer(i,qid,bz.opts); }); grid.appendChild(btn); });
  wrap.appendChild(grid);
  area().innerHTML=''; area().appendChild(wrap);
  const dl=lane.adl?Date.parse(lane.adl):0;
  clearBzTimer(); if(dl){ bzTimer=setInterval(function(){ const f=$('bzcdfill'); if(!f){ clearBzTimer(); return; } const frac=Math.max(0,Math.min(1,(dl-Date.now())/10000)); f.style.width=(frac*100)+'%'; if(frac<=0) clearBzTimer(); }, 150); }
}
function renderBuzzLocked(opts){ clearBzTimer();
  const wrap=document.createElement('div'); const n=document.createElement('div'); n.className='locked-note'; n.textContent='Locked in \u2713'; wrap.appendChild(n);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach(function(o,i){ const b=document.createElement('div'); b.className='pbtn '+(i===bzAnsChoice?'mine':'dim'); b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i]; const tx=document.createElement('span'); tx.className='pt'; tx.textContent=o; b.appendChild(k); b.appendChild(tx); grid.appendChild(b); });
  wrap.appendChild(grid); const h=document.createElement('div'); h.className='pa-hint'; h.textContent='Fingers crossed\u2026'; wrap.appendChild(h);
  area().innerHTML=''; area().appendChild(wrap);
}
async function sendBuzzAnswer(i,qid,opts){ if(bzAnsQid===qid && bzAnsChoice>=0) return; bzAnsQid=qid; bzAnsChoice=i; lastSig=''; renderBuzzLocked(opts);
  try{ await sb('answers',{method:'POST', body:JSON.stringify({code:me.code,q_id:qid,player_id:me.id,tag:me.tag,choice:i})}); }catch(e){} }
function renderBuzzReveal(bz,lane,qid){ clearBzTimer(); const c=bz.correct, opts=bz.opts||[];
  const wrap=document.createElement('div'); const v=document.createElement('div');
  const iWon = lane.win && bzAnsQid===qid && bzAnsChoice===c;
  if(iWon){ v.className='pa-good'; v.textContent='\u2713 You got it!'; }
  else if(lane.win){ v.className='pa-good'; v.textContent=esc(lane.win)+' got it for your team!'; }
  else { v.className='pa-msg'; v.textContent='The answer is\u2026'; }
  wrap.appendChild(v);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach(function(o,i){ const cls=i===c?'good':'dim'; const b=document.createElement('div'); b.className='pbtn '+cls; b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i]; const tx=document.createElement('span'); tx.className='pt'; tx.textContent=o; b.appendChild(k); b.appendChild(tx); grid.appendChild(b); });
  wrap.appendChild(grid); const h=document.createElement('div'); h.className='pa-hint'; h.textContent='Next up soon\u2026'; wrap.appendChild(h);
  area().innerHTML=''; area().appendChild(wrap);
}

function renderClues(fc, qid){ clearBzTimer();
  if(fc.phase==='reveal'){ renderCluesReveal(fc,qid); return; }
  if(cluesAnsQid===qid && cluesAnsChoice>=0){ renderCluesLocked(fc.opts||[]); return; }
  const pts=fc.pointsNow||1; const opts=fc.opts||[];
  const wrap=document.createElement('div');
  const ch=cluesHeader(fc); if(ch) wrap.appendChild(ch);
  const t=document.createElement('div'); t.className='pa-title'; t.textContent='Answer now for '+pts+' point'+(pts>1?'s':'')+'!'; wrap.appendChild(t);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach(function(o,i){ const b=document.createElement('button'); b.className='pbtn'; b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i]; const tx=document.createElement('span'); tx.className='pt'; tx.textContent=o;
    b.appendChild(k); b.appendChild(tx); b.addEventListener('click', function(){ sendCluesAnswer(i,qid,fc,opts); }); grid.appendChild(b); });
  wrap.appendChild(grid);
  const h=document.createElement('div'); h.className='pa-hint'; h.textContent='Guess as soon as you\u2019re sure, earlier is worth more!'; wrap.appendChild(h);
  area().innerHTML=''; area().appendChild(wrap);
}
function renderCluesLocked(opts){
  const wrap=document.createElement('div'); const n=document.createElement('div'); n.className='locked-note'; n.textContent='Locked in \u2713'; wrap.appendChild(n);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach(function(o,i){ const b=document.createElement('div'); b.className='pbtn '+(i===cluesAnsChoice?'mine':'dim'); b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i]; const tx=document.createElement('span'); tx.className='pt'; tx.textContent=o; b.appendChild(k); b.appendChild(tx); grid.appendChild(b); });
  wrap.appendChild(grid);
  const h=document.createElement('div'); h.className='pa-hint'; h.textContent='Waiting for the answer\u2026'; wrap.appendChild(h);
  area().innerHTML=''; area().appendChild(wrap);
}
async function sendCluesAnswer(i,qid,fc,opts){ if(cluesAnsQid===qid && cluesAnsChoice>=0) return;
  cluesAnsQid=qid; cluesAnsChoice=i; cluesMyLevel=fc.clueIdx||0; lastSig=''; renderCluesLocked(opts);
  try{ await sb('answers',{method:'POST', body:JSON.stringify({code:me.code,q_id:qid,player_id:me.id,tag:me.tag,choice:i})}); }catch(e){} }
function renderCluesReveal(fc,qid){ const c=fc.correct, opts=fc.opts||[];
  const wrap=document.createElement('div'); const v=document.createElement('div');
  const mineThis=(cluesAnsQid===qid && cluesAnsChoice>=0);
  if(mineThis && cluesAnsChoice===c){ v.className='pa-good'; v.textContent='\u2713 Correct! +'+(5-cluesMyLevel); }
  else if(mineThis){ v.className='pa-bad'; v.textContent='\u2717 Not this time'; }
  else { v.className='pa-msg'; v.textContent='The answer is\u2026'; }
  wrap.appendChild(v);
  const grid=document.createElement('div'); grid.className='pgrid';
  opts.forEach(function(o,i){ const cls=i===c?'good':(i===cluesAnsChoice?'bad':'dim'); const b=document.createElement('div'); b.className='pbtn '+cls; b.style.setProperty('--oc',OPTC[i]);
    const k=document.createElement('span'); k.className='pk'; k.textContent=OPTL[i]; const tx=document.createElement('span'); tx.className='pt'; tx.textContent=o; b.appendChild(k); b.appendChild(tx); grid.appendChild(b); });
  wrap.appendChild(grid); const h=document.createElement('div'); h.className='pa-hint'; h.textContent='Next up soon\u2026'; wrap.appendChild(h);
  area().innerHTML=''; area().appendChild(wrap);
}

function renderLobby(){ const wrap=document.createElement('div');
  const m=document.createElement('div'); m.className='pa-msg'; m.innerHTML='<span class="heart"></span>Waiting for the show to start\u2026'; wrap.appendChild(m);
  const pw=document.createElement('div'); pw.className='buzzwrap'; pw.style.paddingTop='16px';
  const b=document.createElement('button'); b.className='buzzbtn practice'; b.type='button'; b.textContent='Try it';
  b.addEventListener('click', function(){ playBuzz(); try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){} b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); });
  pw.appendChild(b); wrap.appendChild(pw);
  const h=document.createElement('div'); h.className='pa-hint'; h.textContent='Give the buzzer a practice press!'; wrap.appendChild(h);
  area().innerHTML=''; area().appendChild(wrap);
}

async function pollState(){
  if(!me) return;
  try{ const rows=await sb('players?id=eq.'+me.id+'&select=score'); if(rows&&rows.length) $('myScore').textContent=rows[0].score; }catch(e){}
  let rm;
  try{ const r=await sb('rooms?code=eq.'+encodeURIComponent(me.code)+'&select=phase,q_id,deadline,state'); rm=r&&r[0]; }catch(e){ return; }
  if(!rm){ if(lastSig!=='gone'){ lastSig='gone'; setArea('<div class="pa-msg">The room has closed. Rejoin when the host opens a new one.</div>'); } return; }
  const st=rm.state||{}, phase=rm.phase;
  if(phase==='question'){
    if(rm.q_id!==curQid){ curQid=rm.q_id; answered=false; myChoice=-1; lastSig=''; }
    const sig='q:'+curQid+':'+answered;
    if(sig!==lastSig){ lastSig=sig; if(answered) renderLocked(st.opts||[]); else renderActive(st); }
  } else if(phase==='reveal'){
    const sig='r:'+rm.q_id; if(sig!==lastSig){ lastSig=sig; renderReveal(st, rm.q_id); }
  } else if(phase==='buzzer'){
    const bz=st.bz||{lanes:{}}; const lane=(bz.lanes&&bz.lanes[me.tag])||{st:'open',out:[]};
    const sig='bz:'+rm.q_id+':'+bz.phase+':'+lane.st+':'+(lane.bid||'')+':'+(bzBuzzedQid===rm.q_id)+':'+(bzAnsChoice>=0&&bzAnsQid===rm.q_id)+':'+((lane.out||[]).indexOf(me.id)>=0);
    if(sig!==lastSig){ lastSig=sig; renderBuzzer(bz, rm.q_id); }
  } else if(phase==='fiveclues'){
    const fc=st.fc||{}; const sig='fc:'+rm.q_id+':'+fc.phase+':'+fc.clueIdx+':'+(cluesAnsChoice>=0&&cluesAnsQid===rm.q_id);
    if(sig!==lastSig){ lastSig=sig; renderClues(fc, rm.q_id); }
  } else if(phase==='round_intro'){
    const sig='intro:'+(st.round||'')+':'+(st.rules||'');
    if(sig!==lastSig){ lastSig=sig; setArea('<div class="pa-title">'+esc(st.round||'Get ready')+'</div><div class="pa-msg" style="margin-top:6px">'+esc(st.rules||'')+'</div>'); }
  } else if(phase==='final'){
    if(lastSig!=='final'){ lastSig='final'; const fin=st.fin||{}; const mine=fin[me.tag]||{top:[],total:0};
      const champ = (mine.top&&mine.top[0]) ? (esc(mine.top[0].name)+', '+mine.top[0].score+' pts') : 'No scores this time';
      let team=''; if(fin.teamWin && fin.youth && fin.adult){ const line='Youth '+fin.youth.total+' \u2013 Adults '+fin.adult.total;
        team = (fin.teamWin==='tie') ? ('It\u2019s a tie! '+line) : ((fin.teamWin===me.tag?'Your team wins! ':'')+line); }
      setArea('<div class="pa-title">That\u2019s a wrap!</div><div class="pa-good" style="font-size:22px">'+esc(team)+'</div><div class="pa-msg">Your team\u2019s champion: '+champ+'</div><div class="pa-hint">Thanks for playing, well done!</div>'); }
  } else if(phase==='closing'){
    if(lastSig!=='closing'){ lastSig='closing'; const c=st.close||{};
      setArea('<div class="pa-title">A closing word</div><div class="pa-msg" style="font-family:Fraunces,serif;font-style:italic;font-size:18px;line-height:1.4">\u201c'+esc(c.text||'')+'\u201d</div><div class="pa-hint" style="margin-top:8px">'+esc(c.ref||'')+'</div><div class="pa-hint" style="margin-top:16px">Thank you for coming!</div>'); }
  } else if(phase==='round_scores'){
    if(lastSig!=='scores'){ lastSig='scores'; setArea('<div class="pa-title">Round complete!</div><div class="pa-msg">Watch the big screen.</div>'); }
  } else {
    if(lastSig!=='lobby'){ lastSig='lobby'; renderLobby(); }
  }
}
function startPoll(){ clearInterval(pollTimer); pollState(); pollTimer=setInterval(pollState, 1500); }

async function tryResume(){
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!saved||!saved.id) return false;
  try{
    const rm=await roomExists(saved.code);
    const rows=await sb('players?id=eq.'+saved.id+'&select=id,name,tag,score');
    if(rm && rows && rows.length){ me=saved; enterWaiting(); return true; }
  }catch(e){}
  localStorage.removeItem(KEY); return false;
}

document.querySelectorAll('.team-btn').forEach(b=> b.addEventListener('click', ()=>join(b.dataset.tag)));
$('leaveBtn').addEventListener('click', ()=>{
  if(!confirm('Leave the game? Your name will drop off the board.')) return;
  clearInterval(hb); clearInterval(pollTimer);
  if(me) sb('players?id=eq.'+me.id, {method:'DELETE'}).catch(()=>{});
  localStorage.removeItem(KEY); me=null;
  $('waitScreen').classList.add('hide'); $('joinScreen').classList.remove('hide');
});
$('code').addEventListener('input', e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5); });

prefillCode();
tryResume();
</script>
