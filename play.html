<style>
  :root{
    --ink:#fbf1e2; --ink-dim:#c2a99a;
    --indigo:#1c1013; --indigo2:#130a0d;
    --gold:#e6b655; --gold-hi:#f2d27a; --gold-ink:#3a2a10;

    --card:#26151a; --line:rgba(230,182,85,.16); --ruby:#c9553f;

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(120% 70% at 50% -10%, rgba(230,182,85,.10), transparent 55%),

  .app{min-height:100%; max-width:520px; margin:0 auto; padding:22px; display:flex; flex-direction:column;}
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:26px; text-align:center; margin:6px 0 2px;}
  .brand .amp{color:var(--gold);}
  .tagline{text-align:center; color:var(--ink-dim); font-weight:700; font-size:14px; margin-bottom:20px;}

  .screen{flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px;}
  label{font-weight:800; font-size:14px; letter-spacing:.3px; color:var(--ink-dim); display:block; margin:0 0 7px 2px;}
  input{width:100%; font-family:'Nunito'; font-weight:800; font-size:20px; color:var(--ink); background:var(--card);

  input:focus{border-color:var(--gold);}

  .teams{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .team-btn{border:none; border-radius:16px; padding:22px 12px; font-family:'Fraunces',serif; font-weight:700; font-size:22px;
    cursor:pointer; line-height:1.1; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .08s;}
  .team-btn small{font-family:'Nunito'; font-weight:800; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; opacity:.8;}
  .team-btn:active{transform:scale(.97);}

  .hint{color:var(--ink-dim); font-size:13px; font-weight:700; text-align:center; margin-top:2px;}
  .err{background:rgba(192,69,94,.16); border:1px solid rgba(192,69,94,.5); color:#f4c3cc; padding:12px 14px;
    border-radius:12px; font-weight:700; font-size:14px; display:none;}
  .err.show{display:block;}

  /* waiting */
  .badge{align-self:center; padding:7px 18px; border-radius:999px; font-family:'Nunito'; font-weight:800; font-size:13px;
    letter-spacing:2px; text-transform:uppercase;}
  .badge.youth{background:rgba(230,182,85,.18); color:var(--gold-hi); border:1px solid rgba(230,182,85,.5);}
  .badge.adult{background:rgba(134,191,157,.16); color:var(--teal-hi); border:1px solid rgba(134,191,157,.5);}
  .in-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px 22px; text-align:center;}
  .in-card .hi{font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:var(--ink-dim); letter-spacing:1px;}
  .in-card .who{font-family:'Fraunces',serif; font-weight:700; font-size:34px; margin:4px 0 14px; line-height:1.1;}

  .who2{font-family:'Fraunces',serif; font-weight:700; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .pa-clues{display:flex;flex-direction:column;gap:7px;}
  .pa-clue{background:rgba(255,255,255,.05);border-radius:9px;padding:9px 13px;font-size:15px;font-weight:700;line-height:1.3;}
  .pa-hint{color:var(--ink-dim); font-weight:800; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; text-align:center;}
  .pa-good{font-family:'Fraunces',serif; font-weight:700; font-size:28px; text-align:center; color:#7fe0a6;}
  .pa-bad{font-family:'Fraunces',serif; font-weight:700; font-size:28px; text-align:center; color:#f0a6b4;}
  .pgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .pbtn{border:none; border-radius:18px; padding:20px 12px; min-height:88px; cursor:pointer; text-align:left;
    background:var(--card); border:2px solid transparent; display:flex; flex-direction:column; gap:8px; align-items:flex-start;
    color:var(--ink); font-family:'Nunito'; transition:transform .08s, opacity .3s;}
  .pbtn:active{transform:scale(.97);}
  .pbtn .pk{width:34px; height:34px; border-radius:9px; background:var(--oc); color:#1c1013;
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:19px;}
  .pbtn .pt{font-weight:800; font-size:16px; line-height:1.15;}
  .pbtn.mine{border-color:var(--oc); box-shadow:0 0 0 3px color-mix(in srgb, var(--oc) 35%, transparent);}
  .pbtn.good{border-color:#86bf9d; background:rgba(87,211,138,.15);}
  .pbtn.bad{border-color:#c9553f; background:rgba(192,69,94,.15);}
  .pbtn.dim{opacity:.4;}
  .locked-note{text-align:center; font-weight:800; color:var(--gold-hi); font-size:15px; letter-spacing:.5px;}
  .buzzwrap{display:flex; justify-content:center; padding:12px 0;}
  .buzzbtn{width:min(72vw,300px); height:min(72vw,300px); border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 50% 36%, #ff7a7a, #c0273f 72%); color:#fff; font-family:'Fraunces',serif; font-weight:700;
    font-size:min(16vw,66px); letter-spacing:3px; box-shadow:0 12px 0 #7c1626, 0 18px 40px rgba(0,0,0,.5);
    transition:transform .06s, box-shadow .06s; animation:buzzpulse 1.1s ease-in-out infinite;}
  .buzzbtn:active,.buzzbtn.hit{transform:translateY(8px) scale(.98); box-shadow:0 4px 0 #7c1626, 0 8px 20px rgba(0,0,0,.5);}
  @keyframes buzzpulse{0%,100%{box-shadow:0 12px 0 #7c1626, 0 0 0 0 rgba(255,107,107,.5);}50%{box-shadow:0 12px 0 #7c1626, 0 0 0 22px rgba(255,107,107,0);}}
  .bzcd{height:10px; background:rgba(255,255,255,.1); border-radius:6px; overflow:hidden; margin:6px 0 12px;}
  .bzcdfill{height:100%; width:100%; background:linear-gradient(90deg,#e8765f,#e6b655); border-radius:6px;}
  .buzzbtn.practice{width:min(46vw,170px); height:min(46vw,170px); font-size:min(9vw,32px);}
  @media (prefers-reduced-motion:reduce){ .buzzbtn{animation:none;} }
  @media (prefers-reduced-motion:reduce){ .heart{animation:none;} }
</style>

<script>
const SB_URL='https://cgrbwtcydgfkbqhseeap.supabase.co';
const SB_KEY='sb_publishable_YHNDjX8gcSYJYJVWo_TmMw_8z6BBVAU';
const $=id=>document.getElementById(id);
const access=ShowAccess.create(SB_URL,SB_KEY);
let me=null, hb=null, pollTimer=null, joining=false, leaving=false, pollBusy=false, viewGeneration=0, latestRoom=null;
function showErr(msg){ const e=$('err'); e.textContent=msg; e.classList.add('show'); }
function clearErr(){ $('err').classList.remove('show'); }
function joinBusy(on){joining=on;document.querySelectorAll('.team-btn').forEach(b=>{b.disabled=on;});}
function connectionError(error){$('connectionStatus').textContent=access.message(error)+' Retry the connection or reload this page.';$('connectionStatus').hidden=false;$('connectionRetry').hidden=false;}
function clearConnectionError(){$('connectionStatus').hidden=true;$('connectionRetry').hidden=true;}

function prefillCode(){
  const m=location.search.match(/[?&]c=([^&]+)/) || location.hash.match(/#([A-Za-z0-9]+)/);
  if(m) $('code').value=decodeURIComponent(m[1]).toUpperCase().slice(0,5);
  const ci=$('code');
  if(ci){ ci.addEventListener('input', peekTeams); peekTeams(); }
}

async function roomExists(code){
  const r=await access.preview(code);
  if(r && r.state && r.state.teams) applyTeamNames(r.state.teams);
  return r;
}

/* As soon as a full code is typed, look up what this host has called the teams,
   so the join buttons are right before anyone chooses. */
let peekTimer=null;
function peekTeams(){
  const c=($('code').value||'').trim().toUpperCase();
  if(c.length<4) return;
  clearTimeout(peekTimer);
  peekTimer=setTimeout(async ()=>{
    try{
      const r=await access.preview(c);
      if(($('code').value||'').trim().toUpperCase()!==c)return;
      if(r&&r.state&&r.state.teams)applyTeamNames(r.state.teams);
    }catch(e){if(!joining)showErr(access.message(e));}
  }, 350);
}

async function join(tag){
  if(joining||me)return;
  clearErr();
  const code=($('code').value||'').trim().toUpperCase();
  const name=($('name').value||'').trim();
  if(code.length<4){ showErr('Enter the room code shown on the big screen.'); return; }
  if(!name){ showErr('Enter your name so it can appear on the board.'); return; }
  joinBusy(true);
  try{
    const rm=await roomExists(code);
    if(!rm){ showErr("No show found with code “"+code+"”. Check the big screen and try again."); return; }
    const member=await access.join(code,name,tag);
    if(!member||!member.id)throw new Error('The game did not confirm that you joined.');
    me=Object.assign({code},member);viewGeneration++;latestRoom=null;lastSig='';
    access.rememberPlayer(code);
    enterWaiting();
  }catch(e){
    showErr(access.message(e));
  }finally{joinBusy(false);}
}

function enterWaiting(){
  $('joinScreen').classList.add('hide');
  $('waitScreen').classList.remove('hide');
  $('whoName').textContent=me.name;
  $('roomTag').textContent=me.code;
  const badge=$('teamBadge'); badge.textContent = me.tag==='youth'?'YOUTH':'ADULT / PARENT';
  badge.className='badge '+me.tag;
  $('myScore').textContent=me.score||0;clearConnectionError();
  restoreSubmissionHints();startHeartbeat();startPoll();
}

function startHeartbeat(){
  clearInterval(hb);
  let beating=false;
  const beat=async()=>{if(!me||beating)return;beating=true;const member=me;
    try{const updated=await access.heartbeat(member.code);if(me===member&&updated)$('myScore').textContent=updated.score||0;}
    catch(e){if(me===member)connectionError(e);}finally{beating=false;}};
  beat(); hb=setInterval(beat, 12000);
}
const OPTC=['#e6b655','#86bf9d','#8f7be6','#e8765f'], OPTL=['A','B','C','D'];
let curQid=null, answered=false, myChoice=-1, lastSig='';
let bzBuzzedQid=null, bzAnsQid=-1, bzAnsChoice=-1;
let cluesAnsQid=-1, cluesAnsChoice=-1, cluesMyLevel=0;
const SUBMISSIONS_KEY='tb_show_submissions_v1',submissions=new Map();
function submissionKey(kind,qid){return (me?me.id:'')+':'+kind+':'+qid;}
function submission(kind,qid){return submissions.get(submissionKey(kind,qid))||null;}
function rememberSubmissions(){try{
  const rows=Array.from(submissions.values()).slice(-20).map(r=>({kind:r.kind,qid:r.qid,code:r.code,member:r.member,choice:r.choice,mode:r.mode,clueLevel:r.clueLevel}));
  localStorage.setItem(SUBMISSIONS_KEY,JSON.stringify(rows));
}catch(e){}}
function restoreSubmissionHints(){try{
  const rows=JSON.parse(localStorage.getItem(SUBMISSIONS_KEY)||'[]');if(!Array.isArray(rows))return;
  rows.slice(-20).forEach(r=>{
    if(!r||r.member!==me.id||r.code!==me.code||!['answer','buzz'].includes(r.kind)||typeof r.qid!=='string'||r.qid.length>64)return;
    if(r.kind==='answer'&&(!Number.isInteger(r.choice)||r.choice<0||r.choice>3))return;
    if(!['normal','buzzer','clues'].includes(r.mode))return;
    const key=submissionKey(r.kind,r.qid);if(submissions.has(key))return;
    submissions.set(key,{kind:r.kind,qid:r.qid,code:r.code,member:r.member,choice:r.choice,mode:r.mode,clueLevel:r.clueLevel||0,state:'unknown',restored:true,rechecked:false,mayHaveCommitted:true,error:null});
  });
}catch(e){}}
function currentSubmission(record){return !!(record&&me&&me.id===record.member&&me.code===record.code&&latestRoom&&latestRoom.q_id===record.qid);}
function confirmedAnswer(qid){const record=submission('answer',qid);return record&&record.state==='confirmed'?record:null;}
function submissionNote(record){
  const noun=record.kind==='buzz'?'buzz':'answer';
  if(record.state==='pending')return 'Sending your '+noun+'…';
  if(record.state==='confirmed')return record.kind==='buzz'?'Buzz recorded!':'Locked in ✓';
  if(record.state==='failed')return 'Your '+noun+' was not recorded. '+access.message(record.error);
  return 'Could not confirm your '+noun+'.'+(record.error?' '+access.message(record.error):'')+' Retry the same '+noun+' to check.';
}
function appendSubmissionStatus(wrap,record){
  const note=document.createElement('div');note.className='locked-note';note.id='submissionStatus';note.setAttribute('role','status');note.setAttribute('aria-live','polite');note.dataset.state=record.state;note.textContent=submissionNote(record);wrap.appendChild(note);
  if(record.state==='pending'||record.state==='confirmed')return;
  const closed=record.error&&/closed|not accepting|question.*current|question unavailable|not.*active|no active|selected buzzer player|buzzer is not open/i.test(record.error.message||'');
  const auth=record.error&&(record.error.status===401||/session|token|jwt|anonymous/i.test(record.error.message||''));
  if(auth){const reload=document.createElement('button');reload.type='button';reload.className='leave';reload.textContent='Reload connection';reload.onclick=()=>location.reload();wrap.appendChild(reload);return;}
  if(!closed||record.state==='unknown'){
    const retry=document.createElement('button');retry.type='button';retry.id='submissionRetry';retry.className='leave';retry.textContent=record.kind==='buzz'?'Retry buzz':'Retry same answer';retry.onclick=()=>attemptSubmission(record);wrap.appendChild(retry);
  }
}
async function attemptSubmission(record){
  if(!me||me.id!==record.member||me.code!==record.code||record.state==='pending'||record.state==='confirmed')return;
  record.state='pending';record.error=null;lastSig='';renderCurrentRoom();rememberSubmissions();
  try{
    const ack=record.kind==='buzz'?await access.buzz(record.code,record.qid):await access.answer(record.code,record.qid,record.choice);
    if(!ack||ack.q_id!==record.qid||ack.player_id!==record.member||(record.kind==='answer'&&ack.choice!==record.choice))throw new Error('The game did not confirm this submission.');
    record.state='confirmed';record.ack=ack;
    if(record.kind==='buzz')bzBuzzedQid=record.qid;
    else if(record.mode==='normal'){if(currentSubmission(record)){answered=true;myChoice=record.choice;}}
    else if(record.mode==='buzzer'){if(currentSubmission(record)){bzAnsQid=record.qid;bzAnsChoice=record.choice;}}
    else {if(currentSubmission(record)){cluesAnsQid=record.qid;cluesAnsChoice=record.choice;cluesMyLevel=record.clueLevel;}}
  }catch(error){
    record.error=error;
    const conflict=/already|different choice|conflict|did not confirm/i.test(error.message||'');
    const definite=error.status>=400&&error.status<500&&error.status!==408&&!conflict;
    if(!definite)record.mayHaveCommitted=true;
    record.state=definite&&!record.mayHaveCommitted?'failed':'unknown';
  }
  rememberSubmissions();if(currentSubmission(record)){lastSig='';renderCurrentRoom();}
}
function submitChoice(kind,qid,choice,mode,clueLevel){
  if(!me||!latestRoom||latestRoom.q_id!==qid)return;
  let record=submission(kind,qid);
  if(!record){record={kind,qid,code:me.code,member:me.id,choice,mode,clueLevel:clueLevel||0,state:'idle',mayHaveCommitted:false,error:null};submissions.set(submissionKey(kind,qid),record);rememberSubmissions();}
  // Never replace a possibly committed choice with a different one.
  if(record.choice!==choice||record.state!=='idle')return;
  return attemptSubmission(record);
}
function area(){ return $('playArea'); }
function setArea(html){ area().innerHTML=html; }
function liveHeader(o){ if(!o||!o.live||!o.qtext) return null;
  const wrap=document.createElement('div'); wrap.className='pa-qhead';
  if(o.prompt){ const p=document.createElement('div'); p.className='pa-prompt'; p.textContent=o.prompt; wrap.appendChild(p); }
  const c=document.createElement('div'); c.className='pa-question'+((o.qkind==='verse-blank'||o.qkind==='verse-ref')?' verse':'');
  if(o.qkind==='verse-blank'){ String(o.qtext).split('{b}').forEach(function(pp,i,arr){ c.appendChild(document.createTextNode(pp)); if(i<arr.length-1){ const b=document.createElement('span'); b.className='pblank'; c.appendChild(b);} }); }
  else if(o.qkind==='verse-ref'){ c.textContent='\u201c'+o.qtext+'\u201d'; }
  else { c.textContent=o.qtext; }
  wrap.appendChild(c); return wrap; }

function playBuzz(){ try{ if(!bzActx) bzActx=new (window.AudioContext||window.webkitAudioContext)(); const a=bzActx; if(a.state==='suspended') a.resume();
  const t=a.currentTime, dur=0.6;
  const o1=a.createOscillator(), o2=a.createOscillator(); o1.type='sawtooth'; o2.type='sawtooth'; o1.frequency.value=150; o2.frequency.value=158;
  const mix=a.createGain(); mix.gain.value=0.4;
  const lfo=a.createOscillator(); lfo.type='square'; lfo.frequency.value=23; const ld=a.createGain(); ld.gain.value=0.4; lfo.connect(ld); ld.connect(mix.gain);
  o1.connect(mix); o2.connect(mix);
  const out=a.createGain(); out.gain.setValueAtTime(0.0001,t); out.gain.linearRampToValueAtTime(0.5,t+0.015); out.gain.setValueAtTime(0.5,t+dur-0.06); out.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  mix.connect(out); out.connect(a.destination); o1.start(t); o2.start(t); lfo.start(t); o1.stop(t+dur); o2.stop(t+dur); lfo.stop(t+dur); }catch(e){} }

/* The host can rename the teams; those names arrive with the room state. */
let TEAM_NAMES = {youth:'Team A', adult:'Team B'};
function applyTeamNames(t){
  if(!t) return;
  let changed=false;
  if(t.youth && t.youth!==TEAM_NAMES.youth){ TEAM_NAMES.youth=t.youth; changed=true; }
  if(t.adult && t.adult!==TEAM_NAMES.adult){ TEAM_NAMES.adult=t.adult; changed=true; }
  if(!changed) return;
  const yb=$('teamBtnYouth'), ab=$('teamBtnAdult');
  if(yb) yb.textContent=TEAM_NAMES.youth;
  if(ab) ab.textContent=TEAM_NAMES.adult;
}

function returnToJoin(message){
  clearInterval(hb);clearInterval(pollTimer);clearBzTimer();viewGeneration++;
  me=null;latestRoom=null;curQid=null;lastSig='';access.rememberPlayer('');
  $('waitScreen').classList.add('hide');$('joinScreen').classList.remove('hide');
  clearConnectionError();if(message)showErr(message);
}
async function pollState(){
  if(!me||pollBusy)return;pollBusy=true;const member=me,generation=viewGeneration;
  try{
    const updated=await access.membership(member.code);
    if(me!==member||viewGeneration!==generation)return;
    if(!updated||!updated.id){returnToJoin('You are no longer in that room. Enter the code to rejoin.');return;}
    if(updated.id!==member.id){returnToJoin('Your place in the room changed. Rejoin to continue.');return;}
    $('myScore').textContent=updated.score||0;
    const rm=await access.playerState(member.code);
    if(me!==member||viewGeneration!==generation)return;
    if(!rm){returnToJoin('The room has closed. Rejoin when the host opens a new one.');return;}
    latestRoom=rm;clearConnectionError();renderCurrentRoom();
    for(const kind of ['answer','buzz']){
      const record=submission(kind,rm.q_id);
      if(record&&record.restored&&!record.rechecked){record.rechecked=true;attemptSubmission(record);}
    }
  }catch(error){if(me===member&&viewGeneration===generation)connectionError(error);}
  finally{pollBusy=false;}
}
function renderCurrentRoom(){
  const rm=latestRoom;if(!me||!rm)return;
  if(rm.q_id!==curQid){curQid=rm.q_id;answered=false;myChoice=-1;}
  const answer=submission('answer',rm.q_id),buzz=submission('buzz',rm.q_id);
  const signature=JSON.stringify([rm.id,rm.run_id,rm.version,rm.phase,rm.q_id,rm.state,answer&&answer.state,buzz&&buzz.state]);
  if(signature===lastSig)return;lastSig=signature;
  const st=rm.state||{}, phase=rm.phase;
  applyTeamNames(st.teams);
  if(phase==='question'){
    if(rm.q_id!==curQid){ curQid=rm.q_id; answered=false; myChoice=-1; lastSig=''; }
    const sig='q:'+curQid+':'+answered;
    if(sig!==lastSig){ lastSig=sig; if(answered) renderLocked(st.opts||[]); else renderActive(st); }
  } else if(phase==='reveal'){
    const sig='r:'+rm.q_id; if(sig!==lastSig){ lastSig=sig; renderReveal(st, rm.q_id); }
  } else if(phase==='buzzer'){
    const bz=st.bz||{lanes:{}}; const lane=(bz.lanes&&bz.lanes[me.tag])||{st:'open',out:[]};
    const sig='bz:'+rm.q_id+':'+bz.phase+':'+lane.st+':'+(lane.bid||'')+':'+(bzBuzzedQid===rm.q_id)+':'+(bzAnsChoice>=0&&bzAnsQid===rm.q_id)+':'+((lane.out||[]).indexOf(me.id)>=0);
    if(sig!==lastSig){ lastSig=sig; renderBuzzer(bz, rm.q_id); }
  } else if(phase==='fiveclues'){
    const fc=st.fc||{}; const sig='fc:'+rm.q_id+':'+fc.phase+':'+fc.clueIdx+':'+(cluesAnsChoice>=0&&cluesAnsQid===rm.q_id);
    if(sig!==lastSig){ lastSig=sig; renderClues(fc, rm.q_id); }
  } else if(phase==='round_intro'){
    const sig='intro:'+(st.round||'')+':'+(st.rules||'');
    if(sig!==lastSig){ lastSig=sig; setArea('<div class="pa-title">'+esc(st.round||'Get ready')+'</div><div class="pa-msg" style="margin-top:6px">'+esc(st.rules||'')+'</div>'); }
  } else if(phase==='final'){
    if(lastSig!=='final'){ lastSig='final'; const fin=st.fin||{}; const mine=fin[me.tag]||{top:[],total:0};
      const champ = (mine.top&&mine.top[0]) ? (esc(mine.top[0].name)+', '+mine.top[0].score+' pts') : 'No scores this time';
      let team='';
      const _solo = fin.youth && fin.adult && ((fin.youth.count && !fin.adult.count) || (fin.adult.count && !fin.youth.count));
      if(!_solo && fin.teamWin && fin.youth && fin.adult){
        const yN=(TEAM_NAMES.youth||'Team A'), aN=(TEAM_NAMES.adult||'Team B');
        const line=yN+' '+fin.youth.total+' \u2013 '+aN+' '+fin.adult.total;
        team = (fin.teamWin==='tie') ? ('It\u2019s a tie! '+line) : ((fin.teamWin===me.tag?'Your team wins! ':'')+line); }
      setArea('<div class="pa-title">That\u2019s a wrap!</div><div class="pa-good" style="font-size:22px">'+esc(team)+'</div><div class="pa-msg">Your team\u2019s champion: '+champ+'</div><div class="pa-hint">Thanks for playing, well done!</div>'); }
  } else if(phase==='closing'){
    if(lastSig!=='closing'){ lastSig='closing'; const c=st.close||{};
      setArea('<div class="pa-title">A closing word</div><div class="pa-msg" style="font-family:Fraunces,serif;font-style:italic;font-size:18px;line-height:1.4">\u201c'+esc(c.text||'')+'\u201d</div><div class="pa-hint" style="margin-top:8px">'+esc(c.ref||'')+'</div><div class="pa-hint" style="margin-top:16px">Thank you for coming!</div>'); }
  } else if(phase==='round_scores'){
    if(lastSig!=='scores'){ lastSig='scores'; setArea('<div class="pa-title">Round complete!</div><div class="pa-msg">Watch the big screen.</div>'); }
  } else {
    if(lastSig!=='lobby'){ lastSig='lobby'; renderLobby(); }
  }
  lastSig=signature;
}

async function tryResume(){
  const code=access.savedPlayerCode();if(!code)return false;
  const explicit=($('code').value||'').trim().toUpperCase();if(explicit&&explicit!==code)return false;
  joinBusy(true);const generation=viewGeneration;
  try{
    const member=await access.membership(code);
    if(viewGeneration!==generation||me)return false;
    if(member&&member.id){me=Object.assign({code},member);viewGeneration++;latestRoom=null;lastSig='';restoreSubmissionHints();enterWaiting();return true;}
    access.rememberPlayer('');return false;
  }catch(error){showErr(access.message(error)+' Reload this page to reconnect, or enter the room code again.');return false;}
  finally{joinBusy(false);}
}

});
