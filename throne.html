<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold The Throne — Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#0e1230;--indigo2:#080a1c;--panel:#151936;--gold:#f5b23e;--gold-hi:#ffd47a;--teal:#2fb6a6;--teal-hi:#79e6d8;--ink:#f4eede;--dim:#b7b0a2;--line:rgba(245,178,62,.18);--good:#57d38a;--bad:#e0728a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  .hide{display:none!important;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 70% at 50% -10%,rgba(245,178,62,.10),transparent 55%),linear-gradient(180deg,#0e1230,#080a1c);min-height:100vh;overflow-x:hidden;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(20px,2.4vw,30px);}
  .brand b{color:var(--gold-hi);}
  .status{font-weight:800;font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;background:#555;}
  .dot.live{background:var(--good);box-shadow:0 0 10px var(--good);}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 22px 60px;}

  /* lobby */
  .lobby{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;}
  .hymn{text-align:center;}
  .hymn .lab{font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-size:12px;}
  .code{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(44px,7vw,84px);letter-spacing:.14em;color:var(--gold-hi);margin:6px 0;}
  .qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:8px;margin:12px auto 8px;}
  .qr img{width:100%;height:100%;}
  .url{font-weight:800;color:var(--teal-hi);font-size:15px;word-break:break-all;}
  .plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .pchip{background:rgba(255,255,255,.06);border-radius:999px;padding:6px 14px;font-weight:800;}
  .hd{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin-bottom:12px;}
  .btn{border:0;border-radius:12px;padding:14px 22px;font-weight:900;font-size:17px;cursor:pointer;font-family:inherit;}
  .go{background:linear-gradient(180deg,var(--gold),#e0912f);color:#241a12;}
  a.url{display:inline-block;text-decoration:none;}
  a.url:hover{text-decoration:underline;}
  .btn.copy{margin-top:12px;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);font-size:14px;padding:10px 16px;}
  .btn.copy.done{background:rgba(87,211,138,.18);color:var(--good);}
  .btn:disabled{opacity:.4;cursor:default;}
  .row{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;}
  .step{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--dim);}
  .step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer;}

  /* arena */
  .arena{display:none;}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .qnum{font-weight:800;color:var(--gold-hi);letter-spacing:.06em;}
  .qmeta{color:var(--dim);font-weight:800;}
  .qbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center;margin-bottom:14px;}
  .qtext{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,3vw,38px);line-height:1.25;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
  .opt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:2px solid transparent;border-radius:12px;padding:14px 16px;font-weight:800;font-size:clamp(15px,1.8vw,21px);text-align:left;}
  .opt .k{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#12162e;}
  .opt.c0 .k{background:#f5b23e;}.opt.c1 .k{background:#2fb6a6;}.opt.c2 .k{background:#8f7be6;}.opt.c3 .k{background:#e0728a;}
  .opt.right{border-color:var(--good);background:rgba(87,211,138,.14);}
  .opt.wrong{border-color:var(--bad);opacity:.6;}
  .timer{height:12px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:16px;}
  .timer > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .25s linear;}
  .timer.ans > i{background:linear-gradient(90deg,var(--teal),var(--teal-hi));}

  .seats{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:16px 0;}
  .seat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;position:relative;}
  .seat.champ{border-color:rgba(245,178,62,.5);box-shadow:0 0 0 1px rgba(245,178,62,.25);}
  .seat .role{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--dim);}
  .seat.champ .role{color:var(--gold-hi);}
  .seat .who{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(20px,2.4vw,30px);margin-top:4px;}
  .seat .streak{margin-top:6px;font-weight:900;color:var(--gold-hi);}
  .seat.buzzed{outline:3px solid var(--teal-hi);}
  .vs{font-family:'Fraunces',serif;font-weight:700;color:var(--dim);font-size:22px;}
  .crown{font-size:26px;position:absolute;top:-14px;left:50%;transform:translateX(-50%);}

  .queue{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
  .queue .lab{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--dim);margin-bottom:8px;}
  .queue .qq{display:flex;flex-wrap:wrap;gap:8px;}
  .queue .qq span{background:rgba(255,255,255,.05);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;}
  .queue .empty{color:var(--dim);font-weight:700;}
  .progress{height:7px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-bottom:14px;}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-hi));transition:width .3s;}
  .beststreak{text-align:center;color:var(--dim);font-weight:800;margin-top:12px;font-size:14px;}
  .beststreak b{color:var(--gold-hi);}

  .banner{text-align:center;font-family:'Fraunces',serif;font-weight:700;font-size:clamp(22px,3.2vw,40px);padding:26px;}
  .banner.good{color:var(--good);}.banner.bad{color:var(--bad);}
  .sub{color:var(--dim);font-weight:800;margin-top:8px;font-family:'Nunito';font-size:16px;}
  .ops{position:fixed;bottom:14px;right:14px;display:flex;gap:8px;}
  .ops button{border:1px solid var(--line);background:rgba(20,24,52,.9);color:var(--dim);border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:13px;}
  @media(max-width:720px){.lobby{grid-template-columns:1fr;}.opts{grid-template-columns:1fr;}.seats{grid-template-columns:1fr;}.vs{display:none;}}
</style>
</head>

        <div class="beststreak" id="best"></div>
      </div>

    </div>

  </div>
  <div class="ops"><button id="newBtn">New room</button></div>

function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t;} return a; }
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

const BUZZ_MS=6000, ANS_MS=4000, REVEAL_MS=2600, BETWEEN_MS=2800, STALE_MS=32000;
let G={ code:null, phase:'lobby', champ:null, chal:null, queue:[], streak:0, qIndex:0, qTotal:20,
        q:null, qId:null, answerer:null, buzzWin:0, ansWin:0, lockedOut:[], firstResolved:false,
        outcome:null, pendingLoser:null, used:new Set(), players:[], _t:null, winner:null,
        bestStreak:{}, totalCorrect:{}, blemished:[], lastWinner:null, summary:null };

function code5(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function baseUrl(){ const h=location.href||''; if(/^https?:\/\//.test(h)){ const b=h.replace(/\/[^\/]*\.html.*$/,'').replace(/\/$/,''); if(b) return b; } return 'https://tierbrain.github.io'; }

async function createRoom(){
  G.code=code5(); G.phase='lobby';
  await sb('rooms',{method:'POST',body:JSON.stringify({code:G.code, seed:(Math.random()*1e9)|0, phase:'lobby', state:{game:'throne',phase:'lobby'}})});
  $('code').textContent=G.code;
  const link=baseUrl()+'/throne-play.html?c='+G.code;
  const u=$('url'); u.textContent=link.replace(/^https?:\/\//,''); u.href=link;
  G.joinLink=link;
  $('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=170x170&data='+encodeURIComponent(link);
  $('dot').classList.add('live'); $('stat').textContent='Live · room '+G.code;
  writeState();
}
function setRoom(patch){ return sb('rooms?code=eq.'+G.code,{method:'PATCH',body:JSON.stringify(patch)}); }

function livePlayers(){ const now=Date.now(); return G.players.filter(p=>{ const t=p.last_seen?Date.parse(p.last_seen):0; return (now-t)<STALE_MS || !p.last_seen; }); }
function isLive(id){ return livePlayers().some(p=>p.id===id); }
function enqueue(p){ if(p) G.queue.push({id:p.id,name:p.name}); }
function dequeue(){ while(G.queue.length){ const p=G.queue.shift(); if(isLive(p.id)) return p; } return null; }

async function pollPlayers(){ try{ const r=await sb('players?code=eq.'+G.code+'&select=id,name,last_seen&order=joined_at.asc'); if(r) G.players=r; }catch(e){} }

async function tick(){
  if(!G.code) return;
  await pollPlayers();
  if(G.phase==='lobby'){ renderLobby(); return; }
  if(G.phase==='live'){ await liveTick(); }
  render();
}
async function liveTick(){
  const now=Date.now();
  if(!G.answerer){
    let bz=[]; try{ bz=await sb('buzzes?code=eq.'+G.code+'&q_id=eq.'+encodeURIComponent(G.qId)+'&select=player_id,created_at&order=created_at.asc')||[]; }catch(e){}
    const first=bz.find(b=> (G.champ&&b.player_id===G.champ.id)||(G.chal&&b.player_id===G.chal.id) );
    const elig = first && G.lockedOut.indexOf(first.player_id)<0 ? first : null;
    if(elig){ const who=(elig.player_id===G.champ.id)?G.champ:G.chal; G.answerer={id:who.id,name:who.name}; G.ansWin=now+ANS_MS; writeState(); }
    else if(now>G.buzzWin){ await bothMiss(); }
  } else {
    let ans=[]; try{ ans=await sb('answers?code=eq.'+G.code+'&q_id=eq.'+encodeURIComponent(G.qId)+'&player_id=eq.'+G.answerer.id+'&select=choice,created_at&order=created_at.asc')||[]; }catch(e){}
    if(ans.length){ await grade(ans[0].choice); }
    else if(now>G.ansWin){ await grade(-1); }
  }
}
async function grade(choice){
  const ok = (choice===G.q.correctIdx);
  if(ok){ await win(G.answerer); return; }
  if(!G.firstResolved){ G.firstResolved=true; G.lockedOut.push(G.answerer.id);
    const opp=(G.answerer.id===G.champ.id)?G.chal:G.champ; G.answerer={id:opp.id,name:opp.name}; G.ansWin=Date.now()+ANS_MS; writeState();
  } else { await bothMiss(); }
}
async function win(p){
  const isChamp = G.champ && p.id===G.champ.id;
  G.pendingLoser = isChamp? G.chal : G.champ;
  if(isChamp){ G.streak++; } else { G.champ={id:p.id,name:p.name}; G.streak=1; }
  G.totalCorrect[p.id]=(G.totalCorrect[p.id]||0)+1;
  G.bestStreak[p.id]=Math.max(G.bestStreak[p.id]||0, G.streak);
  G.lastWinner={id:p.id,name:p.name};
  if(G.pendingLoser) blemish(G.pendingLoser.id);
  G.outcome='win';
  banner(true, esc(p.name)+' takes it!', G.streak>1?('A streak of '+G.streak+'!'):'Holds the throne.');
}
function blemish(id){ if(id && G.blemished.indexOf(id)<0) G.blemished.push(id); }
function nameFor(id){ if(G.champ&&G.champ.id===id) return G.champ.name; if(G.chal&&G.chal.id===id) return G.chal.name; const q=G.queue.find(p=>p.id===id); if(q) return q.name; const p=G.players.find(x=>x.id===id); return p?p.name:'\u2014'; }
function streakKing(){ let best=null; Object.keys(G.bestStreak).forEach(function(id){ const sc=G.bestStreak[id]; if(!best || sc>best.s || (sc===best.s && (G.totalCorrect[id]||0)>(G.totalCorrect[best.id]||0))){ best={id:id, s:sc, name:nameFor(id)}; } }); return best; }
async function bothMiss(){ G.outcome='bothmiss'; G.pendingLoser=null;
  if(G.champ) blemish(G.champ.id); if(G.chal) blemish(G.chal.id);
  banner(false, 'Nobody got it!', 'Both step aside — two new challengers.');
}
function banner(ok,msg,sub){
  G.phase='reveal'; G.revealOk=ok; G.revealMsg=msg; G.revealSub=sub; writeState(); render();
  clearTimeout(G._t); G._t=setTimeout(afterReveal, REVEAL_MS);
}
function afterReveal(){
  if(G.outcome==='win'){ enqueue(G.pendingLoser); G.chal=dequeue(); }
  else if(G.outcome==='bothmiss'){ enqueue(G.champ); enqueue(G.chal); G.champ=dequeue(); G.chal=dequeue(); G.streak=0; }
  if(!G.champ || !G.chal){ G.phase='gameover'; G.winner=G.champ||G.chal; G.deadmsg='Not enough players left.'; writeState(); render(); return; }
  G.phase='between'; G.betweenMsg = (G.streak>0? (esc(G.champ.name)+' holds — streak '+G.streak) : 'Fresh duel!')+' · Next: '+esc(G.chal.name);
  writeState(); render();
  clearTimeout(G._t); G._t=setTimeout(nextOrEnd, BETWEEN_MS);
}
function nextOrEnd(){ if(G.qIndex>=G.qTotal){ endGame(); return; } nextQuestion(); }
function pickQuestion(){ let cand=POOL.filter(o=>!G.used.has(o.tag||slug(o.correct))); if(!cand.length){ G.used=new Set(); cand=POOL.slice(); } const it=cand[Math.floor(Math.random()*cand.length)]; G.used.add(it.tag||slug(it.correct)); return it; }
function nextQuestion(){
  G.qIndex++; const it=pickQuestion(); const opts=shuffle([it.correct].concat(it.wrong));
  G.q={ q:it.q, opts, correctIdx:opts.indexOf(it.correct) };
  G.qId=G.code+':'+G.qIndex+':'+Math.floor(Math.random()*1e6);
  G.answerer=null; G.buzzWin=Date.now()+BUZZ_MS; G.ansWin=0; G.lockedOut=[]; G.firstResolved=false; G.outcome=null;
  G.phase='live'; writeState(); render();
}
function endGame(){ G.phase='gameover'; const sk=streakKing(); G.winner=G.champ;
  G.summary={ champ:G.champ, closer:G.lastWinner, streakKing:sk, flawless:(G.champ && G.blemished.indexOf(G.champ.id)<0) };
  writeState(); render(); }

async function startGame(){
  const live=livePlayers(); if(live.length<2){ return; }
  const order=shuffle(live.map(p=>({id:p.id,name:p.name})));
  G.champ=order[0]; G.chal=order[1]; G.queue=order.slice(2);
  G.streak=0; G.qIndex=0; G.used=new Set();
  G.bestStreak={}; G.totalCorrect={}; G.blemished=[]; G.lastWinner=null; G.summary=null;
  $('lobby').style.display='none'; $('arena').style.display='block';
  nextQuestion();
}

function writeState(){
  const st={ game:'throne', phase:G.phase, champ:G.champ, chal:G.chal, queue:G.queue, streak:G.streak,
    qIndex:G.qIndex, qTotal:G.qTotal, q:G.q?{q:G.q.q, opts:G.q.opts}:null, qId:G.qId, answerer:G.answerer, lockedOut:G.lockedOut,
    buzzWin:(G.phase==='live'&&!G.answerer)?G.buzzWin:0, ansWin:(G.phase==='live'&&G.answerer)?G.ansWin:0,
    reveal:G.phase==='reveal'?{ok:G.revealOk,msg:G.revealMsg,sub:G.revealSub,correctIdx:G.q?G.q.correctIdx:-1}:null,
    between:G.phase==='between'?{msg:G.betweenMsg}:null,
    winner:G.phase==='gameover'?G.winner:null, summary:G.phase==='gameover'?G.summary:null };
  setRoom({phase:G.phase, q_id:G.qId||'', state:st});
}

/* ---------- render ---------- */
function renderLobby(){
  const live=livePlayers();
  $('pcount').textContent='('+live.length+')';
  const pl=$('plist');
  if(!live.length){ pl.innerHTML='<span class="empty" style="color:var(--dim);font-weight:700">Waiting for players to join…</span>'; }
  else { pl.innerHTML=''; live.forEach(p=>{ const s=document.createElement('span'); s.className='pchip'; s.textContent=p.name; pl.appendChild(s); }); }
  $('startBtn').disabled = live.length<2;
}
function render(){
  if(G.phase==='lobby'){ renderLobby(); return; }
  const showBanner = (G.phase==='reveal'||G.phase==='between'||G.phase==='gameover');
  $('playView').classList.toggle('hide', showBanner);
  $('bannerView').classList.toggle('hide', !showBanner);
  if(showBanner){
    const b=$('banner');
    if(G.phase==='reveal'){ b.className='banner '+(G.revealOk?'good':'bad'); b.innerHTML=G.revealMsg+'<div class="sub">'+(G.revealSub||'')+'</div>'; }
    else if(G.phase==='between'){ b.className='banner'; b.innerHTML='<div class="sub" style="font-size:22px">'+(G.betweenMsg||'')+'</div>'; }
    else if(G.phase==='gameover'){ b.className='banner good'; const su=G.summary||{}; const sk=su.streakKing;
      let sub=''; if(G.deadmsg){ sub=G.deadmsg; } else { const bits=[]; if(sk&&sk.s>0) bits.push('Longest streak: '+sk.s+' by '+esc(sk.name)); if(su.closer&&su.closer.name) bits.push('Last question: '+esc(su.closer.name)); if(su.flawless) bits.push('A flawless run! 👑'); sub=bits.join(' · ')||('After '+G.qTotal+' questions.'); }
      b.innerHTML='👑 '+esc((G.winner&&G.winner.name)||'—')+' holds the throne!<div class="sub">'+sub+'</div>'; }
    return;
  }
  // play view
  $('qnum').textContent='Question '+G.qIndex; $('qmeta').textContent='of '+G.qTotal;
  { const pr=$('prog'); if(pr) pr.style.width=Math.min(100,(G.qIndex/G.qTotal)*100)+'%'; }
  { const be=$('best'); if(be){ const sk=streakKing(); be.textContent = (sk&&sk.s>0)? ('Longest streak so far: '+sk.s+' — '+sk.name) : ''; } }
  $('qtext').textContent=G.q?G.q.q:'—';
  const opts=$('opts'); opts.innerHTML='';
  (G.q?G.q.opts:[]).forEach((o,i)=>{ const d=document.createElement('div'); d.className='opt c'+i; const k=document.createElement('span'); k.className='k'; k.textContent='ABCD'[i]; const t=document.createElement('span'); t.textContent=o; d.appendChild(k); d.appendChild(t); opts.appendChild(d); });
  // timer
  const now=Date.now(); const wrap=$('timerWrap'); const bar=$('timer');
  if(G.answerer){ wrap.classList.add('ans'); const frac=Math.max(0,Math.min(1,(G.ansWin-now)/ANS_MS)); bar.style.width=(frac*100)+'%'; }
  else { wrap.classList.remove('ans'); const frac=Math.max(0,Math.min(1,(G.buzzWin-now)/BUZZ_MS)); bar.style.width=(frac*100)+'%'; }
  // seats
  $('champName').textContent=G.champ?G.champ.name:'—';
  $('champStreak').textContent=G.streak>0?('Streak '+G.streak):'';
  $('chalName').textContent=G.chal?G.chal.name:'—';
  $('seatChamp').classList.toggle('buzzed', !!(G.answerer&&G.champ&&G.answerer.id===G.champ.id));
  $('seatChal').classList.toggle('buzzed', !!(G.answerer&&G.chal&&G.answerer.id===G.chal.id));
  $('chalTag').textContent = G.answerer? (G.answerer.id===(G.chal&&G.chal.id)?'answering…':'') : '';
  // queue
  const q=$('queue'); const liveQ=G.queue.filter(p=>isLive(p.id));
  if(!liveQ.length){ q.innerHTML='<span class="empty">— nobody waiting —</span>'; }
  else { q.innerHTML=''; liveQ.forEach((p,i)=>{ const s=document.createElement('span'); s.textContent=(i+1)+'. '+p.name; q.appendChild(s); }); }
}

/* ---------- controls ---------- */
$('startBtn').addEventListener('click', startGame);
$('qMinus').addEventListener('click', ()=>{ G.qTotal=Math.max(3,G.qTotal-1); $('qTot').textContent=G.qTotal; });
$('qPlus').addEventListener('click', ()=>{ G.qTotal=Math.min(20,G.qTotal+1); $('qTot').textContent=G.qTotal; });
$('newBtn').addEventListener('click', ()=>{ clearTimeout(G._t); location.reload(); });
{ const cb=$('copyBtn'); if(cb) cb.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(G.joinLink||''); }catch(e){ try{ const t=document.createElement('textarea'); t.value=G.joinLink||''; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }catch(_){} } cb.textContent='Copied \u2713'; cb.classList.add('done'); setTimeout(()=>{ cb.textContent='Copy join link'; cb.classList.remove('done'); }, 1600); }); }

createRoom();
setInterval(tick, 300);
</script>
