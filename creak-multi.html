<script>

/* ============================================================
   TierBrain shareable score card, drop-in module
   Usage: TBShare.open({ game, kicker, big, lines, footer, accent })
   game:   short slug used in the filename, e.g. 'creak'
   kicker: small caps label, e.g. 'CREAK & COIL'
   big:    the headline stat, e.g. '22 turns'
   lines:  array of small caption lines under the big stat
   footer: bottom-line, e.g. 'Can you beat me?'
   accent: hex colour for the glow/border, e.g. '#e6b655'
   ============================================================ */
(function(){
  function esc(s){ return String(s==null?'':s); }
  function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

  const CSS = `
  .tbs-ov{position:fixed;inset:0;background:rgba(6,7,16,.86);z-index:999;display:flex;align-items:center;justify-content:center;
    padding:22px;backdrop-filter:blur(3px);}
  .tbs-ov.hide{display:none;}
  .tbs-card{width:100%;max-width:380px;}
  .tbs-canwrap{border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);}
  .tbs-canwrap canvas{display:block;width:100%;height:auto;}
  .tbs-actions{display:flex;gap:10px;margin-top:16px;}
  .tbs-btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;cursor:pointer;
    font-family:inherit;color:#fff;background:linear-gradient(180deg,#3fc79a,#1f9d76);box-shadow:0 6px 0 #2a7550;}
  .tbs-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #2a7550;}
  .tbs-btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.18);}
  .tbs-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;
    background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;}
  .tbs-note{color:rgba(255,255,255,.55);font-size:12px;text-align:center;margin-top:10px;font-weight:700;}
  `;

  function ensureStyle(){ if(document.getElementById('tbs-style')) return;
    const s=document.createElement('style'); s.id='tbs-style'; s.textContent=CSS; document.head.appendChild(s); }

  function ensureDom(){ if(document.getElementById('tbsOverlay')) return;
    const ov=el(`<div class="tbs-ov hide" id="tbsOverlay">
      <button class="tbs-close" id="tbsClose">&times;</button>
      <div class="tbs-card">
        <div class="tbs-canwrap"><canvas id="tbsCanvas" width="760" height="950"></canvas></div>
        <div class="tbs-actions">
          <button class="tbs-btn" id="tbsSave">Save image</button>
          <button class="tbs-btn ghost" id="tbsShare">Share</button>
        </div>
        <div class="tbs-note">tierbrain.co</div>
      </div>
    </div>`);
    document.body.appendChild(ov);
    document.getElementById('tbsClose').addEventListener('click', close);
    ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  }

  function close(){ const ov=document.getElementById('tbsOverlay'); if(ov) ov.classList.add('hide'); }

  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function wrap(ctx,text,x,y,maxW,lh){ const words=String(text).split(' '); let line=''; const out=[];
    for(const w of words){ const t=(line+' '+w).trim(); if(ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; }
    if(line) out.push(line);
    out.forEach((l,i)=>ctx.fillText(l, x, y+i*lh));
    return y+out.length*lh; }

  function draw(opts){
    const cv=document.getElementById('tbsCanvas'), ctx=cv.getContext('2d');
    const W=cv.width, H=cv.height, accent=opts.accent||'#e6b655';
    // background
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#12142b'); bg.addColorStop(1,'#080a1a');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // glow
    const g=ctx.createRadialGradient(W/2,H*0.32,40,W/2,H*0.32,H*0.6);
    g.addColorStop(0, accent+'33'); g.addColorStop(1, accent+'00');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // frame
    ctx.strokeStyle=accent+'99'; ctx.lineWidth=3; roundRect(ctx,22,22,W-44,H-44,26); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=1; roundRect(ctx,32,32,W-64,H-64,20); ctx.stroke();
    // kicker
    ctx.textAlign='center'; ctx.fillStyle=accent; ctx.font='800 26px Arial';
    ctx.save(); ctx.letterSpacing='6px'; ctx.fillText((opts.kicker||'TIERBRAIN').toUpperCase(), W/2, 140); ctx.restore();
    // big stat (auto-shrink to fit the card width)
    ctx.fillStyle='#fdf7ee';
    var bigText=opts.big||'', bigSize=108, maxTextW=W-140;
    ctx.font='800 '+bigSize+'px Georgia';
    while(bigSize>44 && ctx.measureText(bigText).width>maxTextW){ bigSize-=4; ctx.font='800 '+bigSize+'px Georgia'; }
    ctx.fillText(bigText, W/2, 220+bigSize*0.62);
    // caption lines
    ctx.font='600 30px Arial'; ctx.fillStyle='rgba(255,255,255,.82)';
    let y=220+bigSize*0.62+70;
    (opts.lines||[]).forEach(function(ln){ y=wrap(ctx, ln, W/2, y, W-160, 40)+14; ctx.textAlign='center'; });
    // divider
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(W*0.28,y+18); ctx.lineTo(W*0.72,y+18); ctx.stroke();
    // footer challenge line
    ctx.font='800 32px Georgia'; ctx.fillStyle=accent;
    ctx.fillText(opts.footer||'Can you beat me?', W/2, y+70);
    // brand
    ctx.font='800 24px Arial'; ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillText('tierbrain.co', W/2, H-56);
  }

  function open(opts){
    ensureStyle(); ensureDom(); draw(opts);
    document.getElementById('tbsOverlay').classList.remove('hide');
    const cv=document.getElementById('tbsCanvas');
    document.getElementById('tbsSave').onclick=function(){
      cv.toBlob(function(blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download='tierbrain-'+(opts.game||'card')+'.png'; a.click(); }, 'image/png');
    };
    document.getElementById('tbsShare').onclick=function(){
      cv.toBlob(async function(blob){
        const file=new File([blob], 'tierbrain-'+(opts.game||'card')+'.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          try{ await navigator.share({files:[file], title:'TierBrain', text: opts.shareText||'Play at tierbrain.co'}); }catch(e){}
        } else {
          cv.toBlob(function(b2){ const a=document.createElement('a'); a.href=URL.createObjectURL(b2);
            a.download='tierbrain-'+(opts.game||'card')+'.png'; a.click(); }, 'image/png');
        }
      }, 'image/png');
    };
  }

  window.TBShare = { open: open, close: close };
})();


</script>

  const spanLo=Math.max(5,Math.round(TOP*0.08)), spanHi=Math.max(spanLo+2,Math.round(TOP*0.28));

    const from=freeSquare(2, TOP-spanLo-1); if(from<0) continue;
    const to=from+rint(spanLo,spanHi); if(to>=TOP || used.has(to)) continue;

  const a=squareCenter(l.from), b=squareCenter(l.to);
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy); const nx=-dy/len, ny=dx/len;
  const wRail=Math.max(4, CELL*0.15); ctx.lineCap='round';
  ctx.strokeStyle = h>=4?'#c9924e':(h>=2?'#a9793f':'#916a4c'); ctx.lineWidth=Math.max(3,CELL*0.05*(h>=2?1:0.85));
  for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(a.x+nx*wRail*s,a.y+ny*wRail*s); ctx.lineTo(b.x+nx*wRail*s,b.y+ny*wRail*s); ctx.stroke(); }
  ctx.strokeStyle = h>=4?'#8a5a2b':(h>=2?'#79532c':'#6b4a3a'); ctx.lineWidth=Math.max(2,CELL*0.035);
  const rungs=Math.max(2,Math.floor(len/(CELL*0.5)));
  for(let i=1;i<rungs;i++){
    if(h<=1 && i%2===0) continue;
    if(h<=3 && h>1 && i===2) continue;
    const t=i/rungs, px=a.x+dx*t, py=a.y+dy*t; ctx.beginPath(); ctx.moveTo(px+nx*wRail,py+ny*wRail); ctx.lineTo(px-nx*wRail,py-ny*wRail); ctx.stroke();
  }
}
function drawSnake(s){
  if(!s.alive) return;
  const head=squareCenter(s.from), tail=squareCenter(s.to);
  const dx=tail.x-head.x, dy=tail.y-head.y, len=Math.hypot(dx,dy); const nx=-dy/len, ny=dx/len; const amp=CELL*0.32;
  ctx.strokeStyle='#57b26a'; ctx.lineWidth=Math.max(6,CELL*0.19); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  for(let i=0;i<=24;i++){ const t=i/24, bx=head.x+dx*t, by=head.y+dy*t, wob=Math.sin(t*Math.PI*3)*amp*(1-t*0.15);
    const px=bx+nx*wob, py=by+ny*wob; if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  ctx.fillStyle='#57b26a'; ctx.beginPath(); ctx.arc(head.x,head.y,CELL*0.19,0,7); ctx.fill();
  const eo=CELL*0.06, ey=head.y-eo*0.4;
  if((s.stir||0)===0){
    ctx.strokeStyle='#2e1c20'; ctx.lineWidth=Math.max(1.3,CELL*0.02); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(head.x-eo-CELL*0.025,ey); ctx.lineTo(head.x-eo+CELL*0.025,ey); ctx.moveTo(head.x+eo-CELL*0.025,ey); ctx.lineTo(head.x+eo+CELL*0.025,ey); ctx.stroke();
  } else {
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(head.x-eo,ey,CELL*0.045,0,7); ctx.arc(head.x+eo,ey,CELL*0.045,0,7); ctx.fill();
    ctx.fillStyle='#2e1c20'; ctx.beginPath(); ctx.arc(head.x-eo,ey,CELL*0.02,0,7); ctx.arc(head.x+eo,ey,CELL*0.02,0,7); ctx.fill();
  }
}
function drawTokens(){
  if(!G.order || !G.order.length) return;
  G.order.forEach(function(pid,i){
    const p=G.tokenPix[pid]; if(!p) return;
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=7; ctx.shadowOffsetY=2;
    ctx.fillStyle=PALETTE[i%PALETTE.length]; ctx.beginPath(); ctx.arc(p.x,p.y,CELL*0.22,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#20141a'; ctx.beginPath(); ctx.arc(p.x,p.y,CELL*0.09,0,7); ctx.fill();
  });
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawCells();
  (G.board.ladders||[]).forEach(drawLadder);
  (G.board.snakes||[]).forEach(drawSnake);
  drawTokens();
}

// ---------- game state (host-authoritative) ----------
let G={ code:null, phase:'lobby', players:[], board:{ladders:[],snakes:[]}, order:[], turnIdx:0, positions:{}, turnSeq:0, winner:null, lastProcessedMoveId:0, tokenPix:{}, qCounter:0, pendingQ:null, pendingQCorrect:null, turnStartedAt:0 };
const TURN_TIMEOUT_MS=25000;

function settleStationaryTokens(excludePid){
  if(!G.order || !G.order.length || !CELL) return;
  const bySquare={};
  G.order.forEach(function(pid){ if(pid===excludePid) return; const pos=G.positions[pid]||1; (bySquare[pos]=bySquare[pos]||[]).push(pid); });
  Object.keys(bySquare).forEach(function(posKey){
    const group=bySquare[posKey]; const c=squareCenter(parseInt(posKey,10));
    group.forEach(function(pid,gi){
      const n=group.length;
      const offx=(n>1)? (gi-(n-1)/2)*CELL*0.30 : 0;
      const offy=(n>1)? Math.abs(gi-(n-1)/2)*CELL*0.10 : 0;
      G.tokenPix[pid]={x:c.x+offx, y:c.y-offy};
    });
  });
}
function animateTokenTo(pid, n, dur){
  const from=G.tokenPix[pid]||squareCenter(1); const to=squareCenter(n);
  return addTween(dur, function(t){ const e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; G.tokenPix[pid]={x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e}; }, function(){ G.tokenPix[pid]=to; });
}
async function walkToken(pid, fromN, toN){
  const step = toN>fromN?1:-1;
  for(let n=fromN+step; step>0? n<=toN : n>=toN; n+=step){ await animateTokenTo(pid, n, 150); }
}

async function createRoom(){
  G.code=code5(); G.phase='lobby';
  const made = await sb('rooms',{method:'POST',body:JSON.stringify({code:G.code, phase:'lobby', state:{game:'creak-multi',phase:'lobby'}})});
  if(!made || made.ok===false){
    $('code').textContent='----';
    const u=$('url'); if(u) u.textContent='Cannot reach the game server. Check your connection and reload.';
    const q=$('qr'); if(q) q.style.display='none';
    const sb2=$('startBtn'); if(sb2){ sb2.disabled=true; sb2.textContent='No connection'; }
    return;
  }
  $('code').textContent=G.code;
  const link=baseUrl()+'/creak-multi-play.html?c='+G.code;
  const u=$('url'); u.textContent=link.replace(/^https?:\/\//,'');
  $('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data='+encodeURIComponent(link);
}
function setRoom(patch){ return sb('rooms?code=eq.'+G.code,{method:'PATCH',body:JSON.stringify(patch)}); }
function writeState(){ setRoom({state:{
  game:'creak-multi', phase:G.phase, board:G.board, order:G.order, turnIdx:G.turnIdx,
  positions:G.positions, turnSeq:G.turnSeq, winner:G.winner, pendingQ:G.pendingQ
}}); }

async function pollPlayers(){ try{ const r=await sb('players?code=eq.'+G.code+'&select=id,name&order=joined_at.asc'); if(r) G.players=r; }catch(e){}
  if(G.phase==='live') reconcileDropouts(); }

// If someone leaves mid-race, drop them from the rotation so the table doesn't
// stall waiting on a player who isn't there any more.
function reconcileDropouts(){
  if(!G.order || G.order.length<2) return;
  const present=new Set(G.players.map(function(p){ return p.id; }));
  const survivors=G.order.filter(function(pid){ return present.has(pid); });
  if(survivors.length===G.order.length) return;          // nobody left
  const goneNames=G.order.filter(function(pid){ return !present.has(pid); }).map(nameOf);

  if(survivors.length===0){ return; }                    // everyone vanished; leave state alone
  if(survivors.length===1){
    // last player standing wins by default rather than racing themselves
    G.order=survivors; G.turnIdx=0;
    G.winner={id:survivors[0], name:nameOf(survivors[0])};
    G.phase='gameover'; draw(); renderTurnbar(); showWin(); writeState(); return;
  }

  // keep whoever's turn it is pointing at the right person after the splice
  const activeBefore=G.order[G.turnIdx];
  G.order=survivors;
  const idx=survivors.indexOf(activeBefore);
  G.turnIdx = idx>=0 ? idx : (G.turnIdx % survivors.length);
  if(idx<0) G.turnStartedAt=Date.now();                  // active player left: fresh clock for the next one
  if(G.pendingQ && !present.has(G.pendingQ.forPlayer)){  // they left mid-question
    G.pendingQ=null; G.pendingQCorrect=null; hideQOverlay();
  }
  setStatus(goneNames.join(' & ')+(goneNames.length>1?' left':' left')+'. Waiting for <b>'+nameOf(G.order[G.turnIdx])+'</b>\u2026');
  draw(); renderTurnbar(); writeState();
}

function renderLobby(){
  const el=$('roster'); if(!G.players.length){ el.innerHTML='<div class="hint">Waiting for players to join…</div>'; }
  else{
    el.innerHTML=G.players.map(function(p,i){
      return '<div class="row"><span class="dot" style="background:'+PALETTE[i%PALETTE.length]+'"></span>'+esc(p.name)+'</div>';
    }).join('');
  }
  $('startBtn').disabled = G.players.length<2;
  $('startBtn').textContent = G.players.length<2 ? 'Start (need 2+ players)' : 'Start game ('+G.players.length+' players)';
}

function renderTurnbar(){
  const el=$('turnbar'); if(!G.order.length){ el.innerHTML=''; return; }
  el.innerHTML=G.order.map(function(pid,i){
    const p=G.players.find(function(x){return x.id===pid;});
    const name=p?p.name:'Player';
    const active=(i===G.turnIdx);
    return '<div class="chip'+(active?' active':'')+'"><span class="dot" style="background:'+PALETTE[i%PALETTE.length]+'"></span>'+esc(name)+' &middot; '+(G.positions[pid]||1)+'</div>';
  }).join('');
}

async function startGame(){
  G.board=genBoard();
  G.order=G.players.map(function(p){ return p.id; });
  G.turnIdx=0; G.turnSeq=0; G.winner=null; G.phase='live';
  G.positions={}; G.order.forEach(function(pid){ G.positions[pid]=1; });
  $('lobby').style.display='none'; $('boardwrap').style.display='block'; $('die').style.display='block';
  G.turnStartedAt=Date.now();
  resize(); renderTurnbar();
  setStatus('Waiting for <b>'+nameOf(G.order[0])+'</b> to roll…');
  writeState();
}
function nameOf(pid){ const p=G.players.find(function(x){return x.id===pid;}); return p?esc(p.name):'Player'; }
function setStatus(html){ $('status').innerHTML=html; }

// ---------- authoritative move processing ----------
async function pollMoves(){
  if(G.phase!=='live') return;
  const activeId=G.order[G.turnIdx];
  if(!G.turnStartedAt) G.turnStartedAt=Date.now();
  let rows=[];
  try{ rows=await sb('moves?code=eq.'+G.code+'&player_id=eq.'+encodeURIComponent(activeId)+'&turn_seq=eq.'+G.turnSeq+'&select=id,player_id,turn_seq&order=created_at.asc')||[]; }catch(e){}
  if(rows.length){
    const mv=rows[0];
    if(mv.id<=G.lastProcessedMoveId) return; // already handled (poll overlap safety)
    G.lastProcessedMoveId=mv.id;
    await resolveTurn(activeId);
    return;
  }
  // nobody's rolled -- if they've been away too long, the host rolls for them so the table keeps moving
  if(Date.now()-G.turnStartedAt > TURN_TIMEOUT_MS){
    setStatus(nameOf(activeId)+' took too long, rolling for them\u2026');
    await resolveTurn(activeId);
  }
}

async function resolveTurn(playerId){
  setStatus(nameOf(playerId)+' is rolling\u2026');
  const roll=rint(1,6);
  const die=$('die'); if(die){ die.classList.add('rolling');
    let flick=0; const fi=setInterval(function(){ renderDie(rint(1,6)); },60);
    await sleep(500); clearInterval(fi); renderDie(roll); die.classList.remove('rolling'); }

  const fromPos=G.positions[playerId]||1;
  let pos=fromPos+roll;
  const willWin = pos>=TOP;
  const target = willWin ? TOP : pos;

  settleStationaryTokens(playerId);      // make sure everyone else is correctly placed first
  await walkToken(playerId, fromPos, target);  // animate the token step by step

  if(willWin){
    G.positions[playerId]=TOP; G.winner={id:playerId,name:nameOf(playerId)}; G.phase='gameover';
    settleStationaryTokens(null); draw(); renderTurnbar(); showWin(); writeState(); return;
  }

  // Landed on a missing tile? Straight down.
  if(isCrater(pos, G.board)){
    pos = await fallIntoCrater(playerId, pos);
    G.positions[playerId]=pos;
    settleStationaryTokens(null);
    await ageLadders();
    G.turnIdx=(G.turnIdx+1)%G.order.length;
    G.turnSeq++; G.turnStartedAt=Date.now();
    draw(); renderTurnbar();
    setStatus('Waiting for <b>'+nameOf(G.order[G.turnIdx])+'</b>\u2026');
    writeState();
    return;
  }

  const hit=resolveLanding(pos, G.board);
  if(hit){
    const ok = await askQuestionFor(playerId, hit.kind, pos);
    if(hit.kind==='ladder'){
      if(ok){ setStatus(nameOf(playerId)+' answered right and climbs! \ud83e\ude9c'); await animateTokenTo(playerId, hit.to, 480); pos=hit.to; }
      else { setStatus(nameOf(playerId)+' got it wrong, the rung snaps.'); hit.obj.health-=2; if(hit.obj.health<=0) await collapse(hit.obj); }
    } else {
      hit.obj.stir += ok?1:2;
      if(ok){ setStatus(nameOf(playerId)+' slips past the sleeping snake. \ud83d\udc0d'); }
      else { setStatus(nameOf(playerId)+' woke the snake, down it goes! \ud83d\udc0d'); await animateTokenTo(playerId, hit.to, 480); pos=hit.to;
        if(isCrater(pos, G.board)){ pos = await fallIntoCrater(playerId, pos); }
      }
      if(hit.obj.alive && hit.obj.stir>=hit.obj.threshold) await snakeActs(hit.obj);
    }
  } else {
    G.positions[playerId]=pos;            // commit before an event may move them again
    const after=await maybeEvent(playerId);
    if(typeof after==='number') pos=after;
    if(pos>=TOP){
      G.positions[playerId]=TOP; G.winner={id:playerId,name:nameOf(playerId)}; G.phase='gameover';
      settleStationaryTokens(null); draw(); renderTurnbar(); showWin(); writeState(); return;
    }
  }
  G.positions[playerId]=pos;
  settleStationaryTokens(null);
  await ageLadders();
  G.turnIdx=(G.turnIdx+1)%G.order.length;
  G.turnSeq++;
  G.turnStartedAt=Date.now();
  draw(); renderTurnbar();
  setStatus('Waiting for <b>'+nameOf(G.order[G.turnIdx])+'</b>\u2026');
  writeState();
}
function showWin(){
  const alive=(G.board.ladders||[]).filter(function(l){return l.alive;}).length;
  const totalL=(G.board.ladders||[]).length;
  $('ovLine').textContent=G.winner.name+' reached the summit first!';
  $('ovStats').innerHTML =
    '<div class="ovstat"><b>'+G.turnSeq+'</b><span>turns</span></div>'+
    '<div class="ovstat"><b>'+alive+'/'+totalL+'</b><span>ladders left</span></div>'+
    '<div class="ovstat"><b>'+G.order.length+'</b><span>racers</span></div>';
  const ranked=G.order.slice().sort(function(a,b){ return (G.positions[b]||1)-(G.positions[a]||1); });
  $('ovStand').innerHTML = ranked.map(function(pid,i){
    const idx=G.order.indexOf(pid);
    return '<div class="row'+(pid===G.winner.id?' win':'')+'"><span class="rank">'+(i+1)+'.</span>'+
      '<span class="dot" style="background:'+PALETTE[idx%PALETTE.length]+'"></span>'+
      '<span style="flex:1">'+nameOf(pid)+(pid===G.winner.id?' \ud83d\udc51':'')+'</span>'+
      '<span>'+(G.positions[pid]||1)+'</span></div>';
  }).join('');
  try{ SFX.summit(); }catch(e){}
  confetti();
  $('overlay').classList.remove('hide');
  setStatus('');
  $('ovShare').onclick=function(){
    TBShare.open({ game:'creak-multi', kicker:'Creak & Coil \u00b7 Multiplayer', big:G.winner.name,
      lines:['Beat '+(G.order.length-1)+' other climber'+(G.order.length===2?'':'s')+' to the summit.', 'Finished in '+G.turnSeq+' turns with '+alive+' of '+totalL+' ladders still standing.'],
      footer:'Think you can beat them?', accent:'#e6b655',
      shareText:G.winner.name+' just won a race up Creak & Coil. Think you can beat them?' });
  };
}
async function playAgain(){
  $('overlay').classList.add('hide');
  const cf=$('confetti'); if(cf) cf.innerHTML='';
  G.phase='lobby'; G.board={ladders:[],snakes:[]}; G.order=[]; G.turnIdx=0; G.positions={};
  G.turnSeq=0; G.winner=null; G.tokenPix={}; G.pendingQ=null; G.pendingQCorrect=null; usedTags=new Set();
  hideQOverlay();
  $('boardwrap').style.display='none'; $('die').style.display='none';
  $('lobby').style.display='block'; $('lobbyPre').style.display='block';
  await pollPlayers(); renderLobby();
  setStatus('');
  writeState();
}

async function loop(){
  if(G.phase==='lobby'){ await pollPlayers(); renderLobby(); }
  else if(G.phase==='live'){ await pollPlayers(); await pollMoves(); }
  setTimeout(loop, 900);
}

$('startBtn').addEventListener('click', function(){ if(G.players.length>=2) startGame(); });
$('ovAgain').addEventListener('click', playAgain);
window.addEventListener('resize', resize);
createRoom().then(function(){ loop(); });

</script>

<script>
/* ---- Creak & Coil: Shared Climb, the mountain guide host, cutscenes and host picker ---- */
(function(){
  if(!window.TBHost) return;
  var KEY_CUTS = 'tb-cutscenes-guide';
  function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  /* the guide stands beside the board on the big screen */
  var box = document.createElement('div'); box.className = 'cchost';
  box.innerHTML = '<canvas id="hostCv"></canvas><div class="hostbubble hide" id="hostBubble"></div>';
  document.body.appendChild(box);
  var host = TBHost.create(document.getElementById('hostCv'), document.getElementById('hostBubble'), 'guide', null, { transparent:true }); window.HOST = host;
  host.start(); host.set('calm');
  var bubT = 0;
  function say(t, pose){ if(pose) host.set(pose); var b = document.getElementById('hostBubble'); b.textContent = t; b.classList.remove('hide'); clearTimeout(bubT); bubT = setTimeout(function(){ b.classList.add('hide'); }, 2600); }

  /* every event in the climb is announced through setStatus, so the guide reacts to those */
  var R = [
    [/Waiting for <b>([^<]+)<\/b>/, 'present', ['{1}, your roll!', 'Over to you, {1}.', 'Roll on, {1}!']],
    [/answered right and climbs/, 'celebrate', ['Up you go!', 'Good climbing!', 'Hold that ladder!']],
    [/the rung snaps/, 'wince', ['Snap! Careful!', 'Ooh, that rung!']],
    [/slips past the sleeping snake/, 'shush', ['Shh… tiptoe past.']],
    [/woke the snake/, 'wince', ['Snake! Down you go!', 'You woke it!']],
    [/Roc sweeps down/, 'celebrate', ['Hold on to your hat!', 'What a lift!']],
    [/Rocks come loose/, 'wince', ['Rockfall! Look out!']],
    [/scrambles clear/, 'celebrate', ['Nimble!', 'Clear of the rocks!']],
    [/caught in the rockfall/, 'wince', ['Ouch! Back down.']],
    [/gale sweeps/, 'wince', ['Brace yourselves!']],
    [/shelters the ladders/, 'celebrate', ['The ladders hold!']],
    [/storm batters|tears tiles/, 'wince', ['The mountain shakes!']],
    [/ladder crumbles/, 'wince', ['There goes a ladder!']],
    [/snake lashes out/, 'wince', ['That snake’s angry!']],
    [/falls through a hole/, 'wince', ['Mind the holes!']],
    [/took too long/, 'ask', ['Come on, roll!']]
  ];
  var _status = window.setStatus;
  window.setStatus = function(html){
    var r = _status.apply(this, arguments), txt = String(html || '');
    for(var i = 0; i < R.length; i++){ var m = txt.match(R[i][0]); if(m){ var line = pick(R[i][2]).replace('{1}', (m[1] || '').replace(/&amp;/g, '&')); say(line, R[i][1]); break; } }
    return r;
  };
  /* sound for every event, the same effects as the solo climb */
  var S = [
    [/is rolling/, ['roll']], [/answered right and climbs/, ['correct', 'climb']], [/the rung snaps/, ['wrong']],
    [/slips past the sleeping snake/, ['correct']], [/woke the snake/, ['wrong', 'slide']], [/Roc sweeps down/, ['swoop']],
    [/Rocks come loose/, ['rumble']], [/scrambles clear/, ['correct']], [/caught in the rockfall/, ['wrong', 'slide']],
    [/gale sweeps|tears tiles/, ['wind']], [/shelters the ladders/, ['correct']], [/storm batters/, ['wrong', 'shake']],
    [/ladder crumbles/, ['collapse']], [/snake lashes out/, ['shake']], [/snake slithers away/, ['slither']], [/falls through a hole/, ['slide']]
  ];
  function sfx(names){ names.forEach(function(n, i){ setTimeout(function(){ try{ if(typeof SFX !== 'undefined' && SFX[n]) SFX[n](); }catch(e){} }, i * 260); }); }
  var _status2 = window.setStatus;
  window.setStatus = function(html){ var r = _status2.apply(this, arguments), txt = String(html || '');
    for(var i = 0; i < S.length; i++){ if(S[i][0].test(txt)){ sfx(S[i][1]); break; } } return r; };
  var _q = window.showQOverlay; if(_q) window.showQOverlay = function(){ var r = _q.apply(this, arguments); host.set('ask'); sfx(['question']); return r; };
  /* the last three seconds of a question tick */
  var _tick = window.tickQTimer, lastSec = -1;
  if(_tick) window.tickQTimer = function(deadline, dur){ var r = _tick.apply(this, arguments), rem = deadline - Date.now();
    if(rem < 3000 && rem > 0){ var sec = Math.ceil(rem / 1000); if(sec !== lastSec){ lastSec = sec; sfx(['tick']); } } else if(rem >= 3000) lastSec = -1; return r; };

  function cutsOn(){ return lsGet(KEY_CUTS, '1') === '1'; }
  function playScene(kind, opts, done){
    if(!window.TBScenes || !cutsOn()){ if(done) done(); return; }
    try{ TBScenes.mute(!!window.tbMuted); }catch(e){}
    var st = document.createElement('div'); st.style.cssText = 'position:fixed;inset:0;z-index:1200;'; document.body.appendChild(st);
    TBScenes.play(st, 'guide', kind, Object.assign({ person:host.person(), onEnd:function(){ if(st.parentNode) st.parentNode.removeChild(st); if(done) done(); } }, opts || {}));
  }

  /* playing: show the guide; summit: a short scene, then the results */
  var _start = window.startGame;
  window.startGame = function(){ var r = _start.apply(this, arguments); document.body.classList.add('cc-playing'); say('Rope up, everyone!', 'welcome'); return r; };
  var _win = window.showWin;
  window.showWin = function(){ var r = _win.apply(this, arguments); var w = G.winner ? G.winner.name : '';
    host.set('celebrate'); playScene('break', { name:w + ' reached the summit!', round:G.turnSeq + ' turns' }); return r; };
  var _again = window.playAgain;
  window.playAgain = function(){ document.body.classList.remove('cc-playing'); host.set('calm'); return _again.apply(this, arguments); };

  /* lobby: cutscenes and host */
  var pre = document.getElementById('lobbyPre');
  var set = document.createElement('div'); set.className = 'ccset';
  set.innerHTML = '<label><input type="checkbox" id="cutsToggle"> Cutscenes</label><span class="hlab">Host</span><span data-host-picker></span>';
  pre.insertBefore(set, document.getElementById('startBtn'));
  var ct = document.getElementById('cutsToggle'); ct.checked = cutsOn(); ct.addEventListener('change', function(){ lsSet(KEY_CUTS, ct.checked ? '1' : '0'); });
  TBHost.picker(set.querySelector('[data-host-picker]'), host, 'guide');

  /* the opening plays when the climb starts */
  var start = document.getElementById('startBtn'), opened = false;
  start.addEventListener('click', function(e){
    e.stopImmediatePropagation(); e.preventDefault();
    if(opened || start.disabled || G.players.length < 2) return;
    if(!cutsOn()){ startGame(); return; }
    opened = true; playScene('opening', {}, function(){ startGame(); opened = false; });
  }, true);
})();

</script>
<button type="button" class="tb-snd" id="tbSnd" aria-pressed="true" aria-label="Sound on">🔊</button><div class="tb-sr" id="tbSay" role="status" aria-live="polite"></div>
<script>
(function(){
  var b = document.getElementById('tbSnd');
  var show = function(){ var m = !!window.tbMuted; b.textContent = m ? '\uD83D\uDD07' : '\uD83D\uDD0A'; b.setAttribute('aria-pressed', String(!m)); b.setAttribute('aria-label', m ? 'Sound off' : 'Sound on'); };
  b.addEventListener('click', function(){ if(window.tbSetMuted) window.tbSetMuted(!window.tbMuted); show(); }); show();
  /* find a free corner: the button never sits on top of a game's own controls */
  var spots = [{ left:'12px', right:'auto', top:'auto', bottom:'calc(12px + env(safe-area-inset-bottom,0px))' }, { left:'auto', right:'12px', top:'auto', bottom:'calc(12px + env(safe-area-inset-bottom,0px))' },
               { left:'12px', right:'auto', top:'calc(12px + env(safe-area-inset-top,0px))', bottom:'auto' }, { left:'auto', right:'12px', top:'calc(12px + env(safe-area-inset-top,0px))', bottom:'auto' }];
  var clash = function(){ var s = b.getBoundingClientRect();
    return [].some.call(document.querySelectorAll('button, a, input, select, [role=button]'), function(e){ if(e === b || !e.offsetParent) return false; var r = e.getBoundingClientRect();
      return r.width && !(r.right < s.left || r.left > s.right || r.bottom < s.top || r.top > s.bottom); }); };
  var place = function(){ for(var i = 0; i < spots.length; i++){ var p = spots[i]; b.style.left = p.left; b.style.right = p.right; b.style.top = p.top; b.style.bottom = p.bottom; if(!clash()) return; }
    var q = spots[0]; b.style.left = q.left; b.style.right = q.right; b.style.top = q.top; b.style.bottom = q.bottom; };
  var later = 0; var replace = function(){ clearTimeout(later); later = setTimeout(place, 250); };
  window.addEventListener('resize', replace); document.addEventListener('click', replace, true); setTimeout(place, 300); setInterval(place, 3000);
  /* screen readers hear right and wrong the moment an answer is marked */
  var say = document.getElementById('tbSay'), good = null, bad = false, t = 0;
  /* the answer's words only: leave out the A/B/C/D badge, and any closing full stop */
  var txt = function(el){ var c = el.cloneNode(true); [].forEach.call(c.querySelectorAll('*'), function(x){ if(/^[A-F]$/.test((x.textContent || '').trim())) x.remove(); });
    return (c.textContent || '').replace(/\s+/g, ' ').trim().replace(/^[A-F]\s+(?=\S)/, '').replace(/[.!?]+$/, '').slice(0, 70); };
  new MutationObserver(function(ms){ ms.forEach(function(m){ var el = m.target; if(!el.classList) return;
      var was = ' ' + (m.oldValue || '') + ' ', now = ' ' + el.className + ' ';
      var gained = function(c){ return now.indexOf(' ' + c + ' ') >= 0 && was.indexOf(' ' + c + ' ') < 0; };
      if(gained('good') || gained('correct') || gained('right')){ good = el; clearTimeout(t); t = setTimeout(flush, 140); }
      if(gained('bad') || gained('wrong') || gained('incorrect')){ bad = true; clearTimeout(t); t = setTimeout(flush, 140); } }); })
    .observe(document.body, { subtree:true, attributes:true, attributeFilter:['class'], attributeOldValue:true });
  function flush(){ var a = good ? txt(good) : ''; say.textContent = bad ? ('Not quite.' + (a ? ' The answer was ' + a + '.' : '')) : ('Correct!' + (a ? ' ' + a + '.' : '')); good = null; bad = false; }
})();
</script>
