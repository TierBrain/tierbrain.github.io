<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="Join a live game of Creak &amp; Coil: The Shared Climb on your phone. Type the code from the big screen and start climbing.">
<meta property="og:type" content="website">

<meta property="og:title" content="Creak &amp; Coil: join">
<meta property="og:description" content="Join a live game of Creak &amp; Coil: The Shared Climb on your phone. Type the code from the big screen and start climbing.">
<meta property="og:image" content="https://tierbrain.co/og-image.png">

<link rel="canonical" href="https://tierbrain.co/creak-multi-play.html">
<script>
/* Anyone arriving on the old github.io address is moved to the real domain,
   keeping whatever page they asked for. Canonical tags alone are only a hint. */
(function(){
  if(location.hostname === 'tierbrain.github.io'){
    location.replace('https://tierbrain.co' + location.pathname + location.search + location.hash);
  }
})();
</script>
<title>Creak &amp; Coil · Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#0e1230;--indigo2:#080a1c;--panel:#151936;--gold:#f5b23e;--gold-hi:#ffd47a;--teal:#2fb6a6;--teal-hi:#79e6d8;--ink:#f4eede;--dim:#b7b0a2;--line:rgba(245,178,62,.18);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 60% at 50% -5%,rgba(245,178,62,.10),transparent 55%),linear-gradient(180deg,#0e1230,#080a1c);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:26px;text-align:center;margin-top:10px;}
  h1 b{color:var(--gold-hi);} h1 .amp{color:var(--teal-hi);font-style:italic;}
  .wrap{width:100%;max-width:420px;margin-top:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .field{margin-bottom:12px;}
  label{display:block;font-weight:800;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:16px;font-weight:800;letter-spacing:.15em;text-align:center;text-transform:uppercase;font-family:inherit;}
  input#nameIn{letter-spacing:normal;text-transform:none;}
  .btn{border:0;border-radius:14px;padding:15px;font-weight:900;font-size:16px;font-family:inherit;cursor:pointer;background:linear-gradient(180deg,var(--gold),#e0912f);color:#241a12;box-shadow:0 6px 0 #9c631f;width:100%;margin-top:6px;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c631f;}
  .btn:disabled{opacity:.5;box-shadow:0 6px 0 #9c631f;transform:none;}
  .err{color:#ff9b9b;font-weight:700;font-size:13px;text-align:center;margin-top:8px;min-height:16px;}

  .pa-title{font-weight:900;font-size:20px;text-align:center;}
  .pa-hint{color:var(--dim);font-weight:700;font-size:13px;text-align:center;margin-top:6px;}
  .rows{margin-top:16px;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:800;}
  .row .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .row .nm{flex:1;} .row.me{color:var(--gold-hi);}
  .row.active{background:rgba(245,178,62,.10);border-radius:10px;}
  .foot{color:var(--dim);font-size:12px;font-weight:700;margin-top:16px;text-align:center;}
  .leave{background:none;border:0;color:var(--dim);text-decoration:underline;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}
  .rollbtn{font-size:20px;padding:22px;}
  .qkind2{text-align:center;font-weight:900;font-size:13px;color:var(--teal-hi);margin-bottom:8px;}
  .qtimerbar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:12px;}
  .qtimerbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .1s linear;}
  .qtext2{font-family:'Fraunces',serif;font-weight:600;font-size:18px;text-align:center;margin-bottom:14px;line-height:1.3;}
  .qopts2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .qopt2{background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:10px;padding:13px 10px;font-weight:800;font-size:14px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);}
  .qopt2.picked{border-color:var(--gold);background:rgba(245,178,62,.16);}
  .qopt2:disabled{opacity:.55;}
  .win{text-align:center;padding:10px 4px;}
  .win .big{font-size:44px;margin-bottom:6px;}
</style>
</head>
<body>
  <h1>Creak <span class="amp">&amp;</span> <b>Coil</b></h1>
  <div class="wrap">
    <div class="card" id="joinCard">
      <div class="field"><label>Room code</label><input id="codeIn" maxlength="5" placeholder="ABCDE"></div>
      <div class="field"><label>Your name</label><input id="nameIn" maxlength="14" placeholder="Your name" style="letter-spacing:normal;text-transform:none"></div>
      <button class="btn" id="joinBtn">Join &#9656;</button>
      <div class="err" id="err"></div>
    </div>
    <div class="card" id="playCard" style="display:none"></div>
  </div>
  <div class="foot" id="foot"></div>

<script>
"use strict";
const SB_URL='https://cgrbwtcydgfkbqhseeap.supabase.co';
const SB_KEY='sb_publishable_YHNDjX8gcSYJYJVWo_TmMw_8z6BBVAU';
async function sb(path, opts){ opts=opts||{}; try{
  const headers=Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}, opts.headers||{});
  if(opts.method==='POST'||opts.method==='PATCH') headers['Prefer']='return=minimal';
  const r=await fetch(SB_URL+'/rest/v1/'+path, Object.assign({}, opts, {headers}));
  if(r.ok){ if(opts.method) return null; return await r.json(); }
  return opts.method?null:[];
}catch(e){ return opts.method?null:[]; } }

const $=id=>document.getElementById(id);
const PALETTE=['#f5b23e','#2fb6a6','#e0728a','#8f7be6','#57d38a','#5aa9e6'];
let myId=(crypto.randomUUID?crypto.randomUUID():('id'+Math.random().toString(36).slice(2)+Date.now()));
let code='', myName='', joined=false, lastBeat=0, lastSig='', myRolledSeq=-1, myQId=null, qTimerHandle=null;

const params=new URLSearchParams(location.search);

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function join(){
  code=$('codeIn').value.trim().toUpperCase(); myName=$('nameIn').value.trim();
  if(code.length!==5){ $('err').textContent='Enter the 5-letter code.'; return; }
  if(!myName){ $('err').textContent='Enter your name.'; return; }
  $('joinBtn').disabled=true; $('err').textContent='';
  const rooms=await sb('rooms?code=eq.'+code+'&select=code');
  if(!rooms||!rooms.length){ $('err').textContent='Room not found. Check the code.'; $('joinBtn').disabled=false; return; }
  const now=new Date().toISOString();
  await sb('players',{method:'POST',body:JSON.stringify({id:myId, code, name:myName, tag:'creak-multi', score:0, joined_at:now, last_seen:now})});
  try{ localStorage.setItem('creak_multi_session', JSON.stringify({code:code, playerId:myId, name:myName})); }catch(e){}
  enterGame();
}
function enterGame(){
  joined=true; $('joinCard').style.display='none'; $('playCard').style.display='block';
  $('foot').innerHTML='Room '+code+' &middot; <button class="leave" id="leaveBtn">Leave</button>';
  $('leaveBtn').addEventListener('click', function(){ try{ sb('players?id=eq.'+myId,{method:'DELETE'}); }catch(e){} try{ localStorage.removeItem('creak_multi_session'); }catch(e){} location.reload(); });
  poll(); setInterval(poll, 900);
}
function tryResume(){
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('creak_multi_session')||'null'); }catch(e){}
  if(!saved || !saved.code || !saved.playerId) return false;
  // if the URL points at a different room, don't auto-resume the old one
  const urlCode=params.get('c'); if(urlCode && urlCode.toUpperCase()!==saved.code) return false;
  code=saved.code; myId=saved.playerId; myName=saved.name||'Player';
  enterGame();
  return true;
}
if(!tryResume() && params.get('c')) $('codeIn').value=params.get('c').toUpperCase();
$('joinBtn').addEventListener('click', join);

async function beat(){ const now=Date.now(); if(now-lastBeat<10000) return; lastBeat=now; try{ await sb('players?id=eq.'+myId,{method:'PATCH',body:JSON.stringify({last_seen:new Date().toISOString()})}); }catch(e){} }

function area(){ return $('playCard'); }
function setHTML(h){ area().innerHTML=h; }

async function submitAnswer(qId, choice, btnEl){
  if(qTimerHandle){ clearInterval(qTimerHandle); qTimerHandle=null; }
  const all=document.querySelectorAll('.qopt2'); all.forEach(function(b){ b.disabled=true; });
  if(btnEl) btnEl.classList.add('picked');
  try{ await sb('moves',{method:'POST',body:JSON.stringify({code:code, player_id:myId, turn_seq:-1, q_id:qId, choice:choice})}); }catch(e){}
}
async function rollNow(){
  const btn=$('rollBtn'); if(btn){ btn.disabled=true; btn.textContent='Rolling…'; }
  myRolledSeq = window.__lastState ? window.__lastState.turnSeq : -1;
  try{ await sb('moves',{method:'POST',body:JSON.stringify({code:code, player_id:myId, turn_seq:myRolledSeq})}); }catch(e){}
}

function renderQuestion(pq){
  if(myQId===pq.qId) return; // already showing this exact question, don't re-render and lose disabled state
  myQId=pq.qId;
  const LABELS={ladder:'\ud83e\ude9c Climb it! Answer to hold the ladder',snake:'\ud83d\udc0d Sneak past! Answer to dodge the snake',rock:'\ud83e\udea8 Rockfall! Answer to scramble clear',storm:'\ud83c\udf29\ufe0f Storm! Answer to shelter the ladders'};
  const kindLabel = LABELS[pq.kind] || LABELS.snake;
  setHTML('<div class="qkind2">'+kindLabel+'</div>'+
    '<div class="qtimerbar"><i id="qfill"></i></div>'+
    '<div class="qtext2">'+esc(pq.q)+'</div>'+
    '<div class="qopts2">'+pq.opts.map(function(o,i){ return '<button class="qopt2" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+'</div>');
  document.querySelectorAll('.qopt2').forEach(function(btn){
    btn.addEventListener('click', function(){ submitAnswer(pq.qId, pq.opts[parseInt(btn.dataset.i,10)], btn); });
  });
  if(qTimerHandle) clearInterval(qTimerHandle);
  const totalDur = pq.dur || 10000;
  qTimerHandle=setInterval(function(){
    const fill=$('qfill'); if(!fill){ clearInterval(qTimerHandle); return; }
    const remain=Math.max(0, pq.deadline-Date.now());
    const pct=Math.max(0, Math.min(100, 100*remain/totalDur));
    fill.style.width=pct+'%';
    if(remain<=0){ clearInterval(qTimerHandle); qTimerHandle=null; }
  }, 150);
}
function renderRows(st, highlightTurn){
  const rows=(st.order||[]).map(function(pid,i){
    const p=(st.players||[]).find(function(x){return x.id===pid;}) || {name:'Player'};
    const active = highlightTurn && i===st.turnIdx;
    const mine = pid===myId;
    return '<div class="row'+(active?' active':'')+(mine?' me':'')+'"><span class="dot" style="background:'+PALETTE[i%PALETTE.length]+'"></span><span class="nm">'+esc(p.name)+(mine?' (you)':'')+'</span><span>'+(st.positions?(st.positions[pid]||1):1)+'</span></div>';
  }).join('');
  return '<div class="rows">'+rows+'</div>';
}

async function poll(){
  if(!joined) return; beat();
  if(!window.__lastState || !window.__lastState.pendingQ) myQId=null;
  let rooms=[]; try{ rooms=await sb('rooms?code=eq.'+code+'&select=state'); }catch(e){}
  if(!rooms||!rooms.length) return;
  const st=rooms[0].state||{};
  let players=[]; try{ players=await sb('players?code=eq.'+code+'&select=id,name&order=joined_at.asc')||[]; }catch(e){}
  st.players=players;
  window.__lastState=st;

  if(st.phase==='lobby' || !st.phase){
    const sig='lobby|'+players.length;
    if(sig!==lastSig){ lastSig=sig;
      setHTML('<div class="pa-title">Waiting for the host to start&hellip;</div>'+
        '<div class="pa-hint">'+players.length+' player'+(players.length===1?'':'s')+' joined</div>'+renderRows(st,false));
    }
    return;
  }

  if(st.phase==='live'){
    const myTurn = st.order && st.order[st.turnIdx]===myId;
    const sig='live|'+st.turnSeq+'|'+myTurn;
    if(sig!==lastSig){ lastSig=sig;
      if(myTurn && st.pendingQ && st.pendingQ.forPlayer===myId){
        renderQuestion(st.pendingQ);
      } else if(myTurn){
        setHTML('<div class="pa-title">Your turn! 🎲</div>'+
          '<button class="btn rollbtn" id="rollBtn">Roll the dice</button>'+renderRows(st,true));
        $('rollBtn').addEventListener('click', rollNow);
      } else if(st.pendingQ){
        const askedName=(players.find(function(p){return p.id===st.pendingQ.forPlayer;})||{}).name||'someone';
        setHTML('<div class="pa-title">'+esc(askedName)+' is answering&hellip;</div><div class="pa-hint">Watch the big screen.</div>'+renderRows(st,true));
      } else {
        const activeName=(players.find(function(p){return p.id===(st.order||[])[st.turnIdx];})||{}).name||'someone';
        setHTML('<div class="pa-title">Waiting for '+esc(activeName)+'&hellip;</div>'+renderRows(st,true));
      }
    } else if(!myTurn){
      // keep the position list fresh even without a signature change on repeated polls
      const list=area().querySelector('.rows'); if(list) list.outerHTML=renderRows(st,true);
    }
    return;
  }

  if(st.phase==='gameover'){
    const sig='over|'+(st.winner?st.winner.id:'');
    if(sig!==lastSig){ lastSig=sig;
      const won = st.winner && st.winner.id===myId;
      setHTML('<div class="win"><div class="big">'+(won?'👑':'🏁')+'</div>'+
        '<div class="pa-title">'+(won?'You reached the summit!':(esc(st.winner?st.winner.name:'Someone')+' won!'))+'</div>'+
        '<div class="pa-hint">Thanks for playing.</div></div>'+renderRows(st,false));
    }
  }
}

// expose for headless testing
window.__CMP={ join:function(c,n){ code=c; myName=n; }, poll, getMyId:function(){return myId;}, setJoined:function(v){joined=v;}, submitAnswer:submitAnswer };
</script>
</body>
</html>
