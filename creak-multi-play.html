<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#1c1013;--indigo2:#130a0d;--panel:#26151a;--gold:#e6b655;--gold-hi:#f2d27a;--teal:#86bf9d;--teal-hi:#b4dcc3;--ink:#fbf1e2;--dim:#c2a99a;--line:rgba(230,182,85,.18);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 60% at 50% -5%,rgba(230,182,85,.10),transparent 55%),linear-gradient(180deg,#1c1013,#130a0d);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:26px;text-align:center;margin-top:10px;}
  h1 b{color:var(--gold-hi);} h1 .amp{color:var(--teal-hi);font-style:italic;}
  .wrap{width:100%;max-width:420px;margin-top:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .field{margin-bottom:12px;}
  label{display:block;font-weight:800;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:16px;font-weight:800;letter-spacing:.15em;text-align:center;text-transform:uppercase;font-family:inherit;}
  input#nameIn{letter-spacing:normal;text-transform:none;}
  .btn{border:0;border-radius:14px;padding:15px;font-weight:900;font-size:16px;font-family:inherit;cursor:pointer;background:linear-gradient(180deg,var(--gold),#e0a458);color:#241a12;box-shadow:0 6px 0 #8a5f0a;width:100%;margin-top:6px;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5f0a;}
  .btn:disabled{opacity:.5;box-shadow:0 6px 0 #8a5f0a;transform:none;}
  .err{color:#ff9b9b;font-weight:700;font-size:13px;text-align:center;margin-top:8px;min-height:16px;}

  .pa-title{font-weight:900;font-size:20px;text-align:center;}
  .pa-hint{color:var(--dim);font-weight:700;font-size:13px;text-align:center;margin-top:6px;}
  .rows{margin-top:16px;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:800;}
  .row .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .row .nm{flex:1;} .row.me{color:var(--gold-hi);}
  .row.active{background:rgba(230,182,85,.10);border-radius:10px;}
  .foot{color:var(--dim);font-size:12px;font-weight:700;margin-top:16px;text-align:center;}
  .leave{background:none;border:0;color:var(--dim);text-decoration:underline;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}
  .rollbtn{font-size:20px;padding:22px;}
  .qkind2{text-align:center;font-weight:900;font-size:13px;color:var(--teal-hi);margin-bottom:8px;}
  .qtimerbar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:12px;}
  .qtimerbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .1s linear;}
  .qtext2{font-family:'Fraunces',serif;font-weight:600;font-size:18px;text-align:center;margin-bottom:14px;line-height:1.3;}
  .qopts2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .qopt2{background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:10px;padding:13px 10px;font-weight:800;font-size:14px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);}
  .qopt2.picked{border-color:var(--gold);background:rgba(230,182,85,.16);}
  .qopt2:disabled{opacity:.55;}
  .win{text-align:center;padding:10px 4px;}
  .win .big{font-size:44px;margin-bottom:6px;}
</style>

<body>
  <h1>Creak <span class="amp">&amp;</span> <b>Coil</b></h1>
  <div class="wrap">
    <div class="card" id="joinCard">
      <div class="field"><label>Room code</label><input id="codeIn" maxlength="5" placeholder="ABCDE"></div>
      <div class="field"><label>Your name</label><input id="nameIn" maxlength="14" placeholder="Your name" style="letter-spacing:normal;text-transform:none"></div>
      <button class="btn" id="joinBtn">Join &#9656;</button>
      <div class="err" id="err"></div>
    </div>
    <div id="partyConnection" role="status" aria-live="polite" hidden></div>
    <div id="partySubmission" hidden></div>
    <div id="partyControls" hidden><span id="partyRoom"></span> <button type="button" id="partyLeave">Leave the game</button></div>
    <div class="card" id="playCard" style="display:none"></div>
    <div class="card" id="climberCard" style="display:none;margin-top:12px">
      <label>Your climber</label>
      <div id="climberPick"></div>
      <div class="pa-hint" id="climberHint" style="margin-top:10px">It shows on the big screen. Colours with a line through are taken.</div>
    </div>
  </div>
  <div class="foot" id="foot"></div>

<script src="creak-art.js?v=2"></script>
<script src="vendor/supabase.js"></script>
<script src="js/party-access.js"></script>
<script>

"use strict";
const SB_URL='https://cgrbwtcydgfkbqhseeap.supabase.co';
const SB_KEY='sb_publishable_YHNDjX8gcSYJYJVWo_TmMw_8z6BBVAU';
const access=PartyAccess.create(SB_URL,SB_KEY,{family:'creak',edition:'general'});
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),submissions=new Map(),SUBMISSIONS_KEY='tb_party_'+'creak'+'_general_submissions_v1';
let me=null,latest=null,lastSig='',joining=false,leaving=false,polling=false,generation=0,pollTimer=null,beatTimer=null,beating=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function connectionError(error){const box=$('partyConnection');box.hidden=false;box.textContent=access.message(error)+' ';
 const retry=document.createElement('button');retry.type='button';retry.textContent='Retry connection';retry.onclick=()=>poll();box.appendChild(retry);}
function clearConnection(){$('partyConnection').hidden=true;}
function rememberSubmissions(){try{localStorage.setItem(SUBMISSIONS_KEY,JSON.stringify(Array.from(submissions.values()).slice(-40).map(r=>({code:r.code,member:r.member,run:r.run,window:r.window,choice:r.choice,request:r.request}))));}catch(e){}}
function restoreSubmissions(){try{const rows=JSON.parse(localStorage.getItem(SUBMISSIONS_KEY)||'[]');if(!Array.isArray(rows))return;
 for(const r of rows.slice(-40)){if(!r||r.member!==me.id||r.code!==me.code||typeof r.choice!=='string'||r.choice.length>2000||!['run','window','request'].every(k=>typeof r[k]==='string'&&/^[0-9a-f-]{36}$/i.test(r[k])))continue;
  if(!submissions.has(r.window))submissions.set(r.window,Object.assign({},r,{state:'unknown',mayHaveCommitted:true,error:null}));}
}catch(e){}}
function currentRecord(){const action=latest&&latest.room&&latest.room.action;const r=action&&submissions.get(action.id);return r&&me&&r.member===me.id&&r.code===me.code?r:null;}
function recordText(record){
 if(record.state==='pending')return 'Sending your move…';
 if(record.state==='confirmed')return 'Move recorded. Watch the big screen.';
 if(record.state==='failed')return 'Your move was not recorded. '+access.message(record.error);
 return 'Could not confirm your move. Retry the same move to check.';
}
function renderSubmission(record){const box=$('partySubmission');box.textContent='';box.hidden=!record;if(!record)return;
 const text=document.createElement('div');text.setAttribute('role','status');text.setAttribute('aria-live','polite');text.dataset.state=record.state;text.textContent=recordText(record);box.appendChild(text);
 if(record.state==='unknown'||record.state==='failed'){const retry=document.createElement('button');retry.type='button';retry.textContent='Retry same move';retry.onclick=()=>attemptSubmission(record);box.appendChild(retry);}
}
function reconcileReceipts(receipts){for(const receipt of receipts||[]){
 if(!me||receipt.player_id!==me.id||!receipt.window_id)continue;
 let record=submissions.get(receipt.window_id);
 if(!record){record={code:me.code,member:me.id,run:latest.room.run_id,window:receipt.window_id,choice:String(receipt.choice),request:access.uuid()};submissions.set(record.window,record);}
 if(record.code===me.code&&record.member===me.id&&record.choice===String(receipt.choice)){record.state='confirmed';record.ack=receipt;record.error=null;}
 }rememberSubmissions();}
async function attemptSubmission(record){
 if(!me||record.member!==me.id||record.code!==me.code||record.state==='pending'||record.state==='confirmed')return;
 record.state='pending';record.error=null;rememberSubmissions();lastSig='';render();
 try{const ack=await access.submit(record.code,record.run,record.window,record.choice,record.request);
  if(!ack||ack.window_id!==record.window||ack.player_id!==record.member||String(ack.choice)!==record.choice)throw new Error('The game did not confirm this move.');
  record.state='confirmed';record.ack=ack;
 }catch(error){record.error=error;const conflict=/already|different|conflict|did not confirm/i.test(error.message||'');
  const definite=error.status>=400&&error.status<500&&error.status!==408&&!conflict;
  if(!definite)record.mayHaveCommitted=true;record.state=definite&&!record.mayHaveCommitted?'failed':'unknown';
 }
 rememberSubmissions();if(me&&me.id===record.member&&me.code===record.code){lastSig='';render();}
}
function submitChoice(choice){
 const room=latest&&latest.room,action=room&&room.action;
 if(!me||!action||!action.accepting||action.member_id!==me.id)return;
 let record=submissions.get(action.id);if(record)return;
 record={code:me.code,member:me.id,run:room.run_id,window:action.id,choice:String(choice),request:access.uuid(),state:'idle',mayHaveCommitted:false,error:null};
 submissions.set(action.id,record);return attemptSubmission(record);
}
function returnToJoin(message){generation++;clearInterval(pollTimer);clearInterval(beatTimer);me=null;latest=null;lastSig='';access.rememberPlayer('');
 $('joinCard').classList.remove('hide');$('joinCard').style.display='';$('playCard').classList.add('hide');$('playCard').style.display='none';
 clearTimeout(lookTimer);lookTimer=0;$('climberCard').style.display='none';
 $('partySubmission').hidden=true;$('partyControls').hidden=true;clearConnection();if(message)$('err').textContent=message;}
function enterGame(){generation++;$('joinCard').classList.add('hide');$('joinCard').style.display='none';$('playCard').classList.remove('hide');$('playCard').style.display='';
 $('partyControls').hidden=false;$('partyRoom').textContent='Room '+me.code;restoreSubmissions();enterEdition();
 clearInterval(pollTimer);clearInterval(beatTimer);poll();beat();pollTimer=setInterval(poll,900);beatTimer=setInterval(beat,10000);}
async function join(){
 if(joining||me)return;const code=($('codeIn').value||'').trim().toUpperCase(),name=($('nameIn').value||'').trim();
 if(code.length!==5){$('err').textContent='Enter the five-letter code on the big screen.';return;}if(!name){$('err').textContent='Enter your name.';return;}
 joining=true;$('joinBtn').disabled=true;$('err').textContent='';
 try{await access.preview(code);const member=await access.join(code,name);if(!member||!member.id)throw new Error('The game did not confirm that you joined.');
  me=Object.assign({code},member);access.rememberPlayer(code);enterGame();
 }catch(error){$('err').textContent=access.message(error);}finally{joining=false;$('joinBtn').disabled=false;}
}
async function tryResume(){
 const saved=access.savedPlayerCode(),explicit=(params.get('c')||'').toUpperCase();if(!saved||(explicit&&explicit!==saved))return;
 joining=true;$('joinBtn').disabled=true;
 try{const member=await access.membership(saved);if(member&&member.id){me=Object.assign({code:saved},member);enterGame();}else access.rememberPlayer('');}
 catch(error){$('err').textContent=access.message(error);}finally{joining=false;$('joinBtn').disabled=false;}
}
async function beat(){if(!me||beating)return;beating=true;const member=me;try{await access.heartbeat(member.code);}catch(error){if(me===member)connectionError(error);}finally{beating=false;}}
async function poll(){
 if(!me||polling)return;polling=true;const member=me,view=generation;
 try{const state=await access.playerState(member.code);if(me!==member||generation!==view)return;
  if(!state||!state.member||state.member.id!==member.id){returnToJoin('You are no longer in that room. Enter the code to rejoin.');return;}
  latest=state;reconcileReceipts(state.receipts);clearConnection();render();
 }catch(error){if(me===member&&generation===view)connectionError(error);}finally{polling=false;}
}
async function leave(){
 if(!me||leaving)return;leaving=true;$('partyLeave').disabled=true;const member=me;
 try{const result=await access.leave(member.code);if(!result||result.left!==true)throw new Error('The game did not confirm that you left.');if(me===member)returnToJoin('You left the room.');}
 catch(error){if(me===member)connectionError(error);}finally{leaving=false;$('partyLeave').disabled=false;}
}
$('joinBtn').addEventListener('click',join);$('partyLeave').addEventListener('click',leave);
$('nameIn').addEventListener('keydown',event=>{if(event.key==='Enter')join();});
if(params.get('c'))$('codeIn').value=params.get('c').toUpperCase().slice(0,5);
tryResume();

const PALETTE=['#e6b655','#86bf9d','#e8765f','#8f7be6','#e58fb6','#5aa9e6','#d94f6a','#e9e2d4'];
let qTimerHandle=null;
/* The phone chooses a climber; the server binds the change to this verified membership. */
let myLook=window.CreakArt?CreakArt.savedLook():{c:0,s:0,h:'bobble'},lookPicker=null,lookTimer=0,lookBusy=false,lookDirty=false,lookVersion=0;
function pushLook(){
 lookDirty=true;lookVersion++;clearTimeout(lookTimer);lookTimer=setTimeout(sendLook,250);
}
async function sendLook(){
 lookTimer=0;
 if(lookBusy||!lookDirty||!me||!latest||latest.room.phase!=='lobby'||!window.CreakArt)return;
 const member=me,version=lookVersion,choice={c:myLook.c,s:myLook.s,h:myLook.h};lookBusy=true;
 $('climberHint').textContent='Saving your climber…';
 try{const saved=await access.heartbeat(member.code,choice);
  if(me!==member)return;
  if(!saved||saved.id!==member.id||!saved.look||saved.look.c!==choice.c||saved.look.s!==choice.s||saved.look.h!==choice.h)throw new Error('The game did not confirm your climber.');
  if(version===lookVersion)lookDirty=false;
  $('climberHint').textContent=lookDirty?'Saving your climber…':'Your climber is saved. Colours with a line through are taken.';
 }catch(error){if(me===member){$('climberHint').textContent='Could not confirm your climber. It will retry while you are in the lobby.';connectionError(error);}}
 finally{lookBusy=false;if(me===member&&lookDirty)lookTimer=setTimeout(sendLook,1200);}
}
function showClimber(on,players){
 const card=$('climberCard');if(!card||!window.CreakArt)return;card.style.display=on?'block':'none';if(!on)return;
 if(!lookPicker)lookPicker=CreakArt.picker($('climberPick'),myLook,function(look){myLook=look;CreakArt.saveLook(look);pushLook();});
 const memberIndex=players.findIndex(p=>p.id===me.id),takenAll=[],takenBefore=[];
 players.forEach(function(p,i){if(p.id===me.id||!p.look)return;takenAll.push(p.look.c);if(memberIndex<0||i<memberIndex)takenBefore.push(p.look.c);});
 if(takenBefore.includes(myLook.c)){let c=0;while(c<PALETTE.length&&takenAll.includes(c))c++;if(c<PALETTE.length){myLook.c=c;lookPicker.set(myLook);CreakArt.saveLook(myLook);pushLook();}}
 lookPicker.taken(takenAll);if(lookDirty&&!lookBusy&&!lookTimer)sendLook();
}
function enterEdition(){pushLook();}
function setHTML(html){$('playCard').innerHTML=html;}
function renderRows(st,highlight){return '<div class="rows">'+(st.order||[]).map((id,i)=>{
 const player=(latest.members||[]).find(p=>p.id===id)||{name:'Player'};
 return '<div class="row'+(highlight&&i===st.turnIdx?' active':'')+(id===me.id?' me':'')+'"><span class="dot" style="background:'+((st.looks&&st.looks[id])?st.looks[id].col:PALETTE[i%PALETTE.length])+'"></span><span class="nm">'+esc(player.name)+(id===me.id?' (you)':'')+'</span><span>'+((st.positions||{})[id]||1)+'</span></div>';
}).join('')+'</div>';}
function rollNow(){return submitChoice('roll');}
function submitAnswer(qId,choice){if(!latest||!latest.room.state.pendingQ||latest.room.state.pendingQ.qId!==qId)return;return submitChoice(choice);}
function renderQuestion(q,record){
 const labels={ladder:'🪜 Climb it! Answer to hold the ladder',snake:'🐍 Sneak past! Answer to dodge the snake',rock:'🪨 Rockfall! Answer to scramble clear',storm:'⛈️ Storm! Answer to shelter the ladders'};
 setHTML('<div class="qkind2">'+(labels[q.kind]||labels.snake)+'</div><div class="qtimerbar"><i id="qfill"></i></div><div class="qtext2">'+esc(q.q)+'</div><div class="qopts2">'+(q.opts||[]).map((o,i)=>'<button class="qopt2'+(record&&record.choice===o?' picked':'')+'" data-i="'+i+'"'+(record?' disabled':'')+'>'+esc(o)+'</button>').join('')+'</div>');
 document.querySelectorAll('.qopt2').forEach(button=>button.addEventListener('click',()=>submitAnswer(q.qId,q.opts[Number(button.dataset.i)])));
 clearInterval(qTimerHandle);qTimerHandle=setInterval(()=>{const fill=$('qfill');if(!fill){clearInterval(qTimerHandle);return;}fill.style.width=Math.max(0,Math.min(100,100*(q.deadline-Date.now())/(q.dur||10000)))+'%';},150);
}
function render(){
 if(!me||!latest)return;const room=latest.room,st=room.state||{},action=room.action,record=currentRecord();renderSubmission(record);showClimber(room.phase==='lobby',latest.members||[]);
 const sig=JSON.stringify([room.run_id,room.version,record&&record.state,(latest.members||[]).map(p=>[p.id,p.name,p.look])]);if(sig===lastSig)return;lastSig=sig;clearInterval(qTimerHandle);
 if(room.phase==='lobby'){setHTML('<div class="pa-title">Waiting for the host to start…</div><div class="pa-hint">'+(latest.members||[]).length+' players joined</div>'+renderRows(st,false));return;}
 if(st.phase==='live' && st.scene){setHTML('<div class="pa-title">🎬 Watch the big screen!</div><div class="pa-hint">Something is happening on the mountain…</div>'+renderRows(st,true));return;}
 if(room.phase==='gameover'){const won=st.winner&&st.winner.id===me.id;setHTML('<div class="win"><div class="big">'+(won?'👑':'🏁')+'</div><div class="pa-title">'+(won?'You reached the summit!':esc(st.winner?st.winner.name:'Someone')+' won!')+'</div><div class="pa-hint">Thanks for playing.</div></div>'+renderRows(st,false));return;}
 const mine=(st.order||[])[st.turnIdx]===me.id;
 if(mine&&st.pendingQ&&st.pendingQ.forPlayer===me.id){renderQuestion(st.pendingQ,record);return;}
 if(mine&&action&&action.accepting&&action.kind==='roll'&&!record){setHTML('<div class="pa-title">Your turn! 🎲</div><button class="btn rollbtn" id="rollBtn">Roll the dice</button>'+renderRows(st,true));$('rollBtn').addEventListener('click',rollNow);return;}
 const active=(latest.members||[]).find(p=>p.id===(st.order||[])[st.turnIdx]);
 setHTML('<div class="pa-title">'+(mine?(record&&record.state==='confirmed'?'Climbing…':'Watch the big screen.'):esc(active?active.name:'Someone')+' is playing…')+'</div>'+renderRows(st,true));
}

</script>
