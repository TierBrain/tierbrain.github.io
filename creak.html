<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Creak &amp; Coil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#0e1230;--indigo2:#080a1c;--panel:#151936;--gold:#f5b23e;--gold-hi:#ffd47a;--teal:#2fb6a6;--teal-hi:#79e6d8;--ink:#f4eede;--dim:#b7b0a2;--line:rgba(245,178,62,.18);--good:#57d38a;--bad:#e0728a;--wood:#c9924e;--wood-dk:#8a5a2b;--snake:#57b26a;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 60% at 50% -5%,rgba(245,178,62,.10),transparent 55%),linear-gradient(180deg,#0e1230,#080a1c);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  header{text-align:center;padding:16px 16px 6px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(26px,6vw,40px);letter-spacing:.01em;}
  h1 b{color:var(--gold-hi);}
  h1 .amp{color:var(--teal-hi);font-style:italic;}
  .sub{color:var(--dim);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;}
  .wrap{width:100%;max-width:560px;padding:8px 16px 30px;display:flex;flex-direction:column;align-items:center;}
  .boardwrap{width:100%;position:relative;}
  canvas{width:100%;height:auto;display:block;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.4);}
  .hud{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;}
  .status{font-weight:800;color:var(--dim);font-size:15px;flex:1;min-height:22px;}
  .status b{color:var(--gold-hi);}
  .die{width:58px;height:58px;flex:0 0 auto;border-radius:14px;background:#fff;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.4);}
  .die .pip{position:absolute;width:11px;height:11px;border-radius:50%;background:#20233c;transform:translate(-50%,-50%);}
  .die.rolling{animation:shake .5s ease;}
  @keyframes shake{0%,100%{transform:none;}20%{transform:translateY(-6px) rotate(-8deg);}50%{transform:translateY(2px) rotate(9deg);}75%{transform:translateY(-3px) rotate(-5deg);}}
  .btn{border:0;border-radius:14px;padding:16px 26px;font-weight:900;font-size:18px;font-family:inherit;cursor:pointer;background:linear-gradient(180deg,var(--gold),#e0912f);color:#241a12;box-shadow:0 6px 0 #9c631f;margin-top:16px;width:100%;max-width:280px;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c631f;}
  .btn:disabled{opacity:.5;box-shadow:0 6px 0 #9c631f;transform:none;cursor:default;}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:15px;padding:12px 20px;}
  .overlay{position:fixed;inset:0;background:rgba(8,10,28,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:20;backdrop-filter:blur(3px);}
  .overlay.hide{display:none;}
  .overlay .big{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(30px,8vw,52px);color:var(--gold-hi);}
  .overlay .line{color:var(--ink);font-weight:800;font-size:18px;}
  .foot{color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px 20px;text-align:center;}
  .mute{position:fixed;top:12px;right:12px;border:1px solid var(--line);background:rgba(20,24,52,.85);color:var(--dim);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;z-index:30;}
  .stats{display:flex;gap:20px;margin:4px 0 2px;}
  .st{display:flex;flex-direction:column;align-items:center;}
  .st b{font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--gold-hi);}
  .st span{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}
  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .confetti span{position:absolute;top:-8%;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(115vh) rotate(400deg);opacity:.35;}}
  .qoverlay{position:fixed;inset:0;background:rgba(8,10,28,.86);display:flex;align-items:center;justify-content:center;padding:20px;z-index:25;backdrop-filter:blur(3px);}
  .qoverlay.hide{display:none;}
  .qcard{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.55);}
  .qkind{text-align:center;font-weight:900;font-size:15px;margin-bottom:12px;}
  .qkind.lad{color:var(--gold-hi);} .qkind.sna{color:var(--teal-hi);} .qkind.rock{color:#d0a978;} .qkind.storm{color:#9fb6e6;}
  .qtimer{height:9px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:16px;}
  .qtimer > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .08s linear;}
  .qtext{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(18px,4.5vw,23px);line-height:1.3;text-align:center;margin-bottom:16px;}
  .qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .qopt{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:12px;padding:13px 12px;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer;text-align:left;font-family:inherit;}
  .qopt .qk{width:28px;height:28px;flex:0 0 auto;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#12162e;}
  .qopt.c0 .qk{background:#f5b23e;} .qopt.c1 .qk{background:#2fb6a6;} .qopt.c2 .qk{background:#8f7be6;} .qopt.c3 .qk{background:#e0728a;}
  .qopt:active{transform:scale(.98);}
  .qopt.right{border-color:var(--good);background:rgba(87,211,138,.16);}
  .qopt.wrong{border-color:var(--bad);opacity:.6;}
  @media(max-width:380px){ .qopts{grid-template-columns:1fr;} }
  .coffee{display:inline-block;margin-top:16px;color:var(--dim);font-weight:800;font-size:13px;letter-spacing:.02em;text-decoration:none;opacity:.8;}
  .coffee:hover{opacity:1;color:var(--gold-hi);}
</style>
</head>
<body>
  <header>
    <h1>Creak <span class="amp">&amp;</span> <b>Coil</b></h1>
    <div class="sub">the long climb</div>
  </header>
  <button class="mute" id="mute" title="Sound">🔊</button>
  <div class="wrap">
    <div class="boardwrap"><canvas id="board"></canvas></div>
    <div class="hud">
      <div class="status" id="status">Roll to begin your climb.</div>
      <div class="die" id="die"></div>
    </div>
    <button class="btn" id="roll">Roll</button>
    <button class="btn ghost" id="newgame" style="margin-top:10px">New board</button>
  </div>
  <div class="foot">Ladders rot, snakes strike, and watch for the Roc that lifts you, the rockfalls, and storms that batter the ladders. 🔊 top-right.</div>

  <div class="qoverlay hide" id="qoverlay">
    <div class="qcard">
      <div class="qkind" id="qkind"></div>
      <div class="qtimer"><i id="qtimerbar"></i></div>
      <div class="qtext" id="qtext"></div>
      <div class="qopts" id="qopts"></div>
    </div>
  </div>

  <div class="overlay hide" id="overlay">
    <div class="confetti" id="confetti"></div>
    <div class="big" id="ovBig">🏔️ Summit!</div>
    <div class="line" id="ovLine"></div>
    <div class="stats" id="ovStats"></div>
    <button class="btn" id="ovAgain" style="max-width:240px">Climb again</button>
    <a class="coffee" href="https://ko-fi.com/tierbrain" target="_blank" rel="noopener">Enjoyed the climb? ☕ Buy me a coffee</a>
  </div>

function rint(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function genBoard(){

  const used=new Set([1,TOP]);
  function freeSquare(lo,hi){ for(let tries=0;tries<40;tries++){ const s=rint(lo,hi); if(!used.has(s)) return s; } return -1; }

    const to=from+rint(spanLo,spanHi); if(to>=TOP || used.has(to)) continue;
    used.add(from); used.add(to);

  }

    const from=freeSquare(Math.round(TOP*0.10), TOP-1); if(from<0) continue;
    const to=from-rint(spanLo,spanHi); if(to<2 || used.has(to)) continue;
    used.add(from); used.add(to); const thr=(from>TOP*0.6)?2:3; snakes.push({from,to,stir:0,threshold:thr,alive:true});

}

function squareCenter(n){ // n: 1..TOP, boustrophedon from bottom-left
  const idx=n-1;

  const inRow=idx%COLS;
  const col=(row%2===0)? inRow : (COLS-1-inRow);

  const y=H - (row*CELL + CELL/2);             // invert: row 0 at bottom

let shakeAmt=0, shakeDur=1, shakeUntil=0;
let particles=[], tweens=[];
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function addTween(dur, update, done){ return new Promise(res=>{ tweens.push({start:T,dur:Math.max(1,dur),update:update,done:function(){ if(done)done(); res(); }}); }); }
function shake(amt,dur){ shakeAmt=amt; shakeDur=Math.max(1,dur); shakeUntil=T+dur; }
function punch(peak){ addTween(420,function(t){ cam.scale=1+(peak-1)*Math.sin(t*Math.PI); },function(){ cam.scale=1; }); }
function snakePointAt(s,u){ const head=squareCenter(s.from), tail=squareCenter(s.to); const dx=tail.x-head.x, dy=tail.y-head.y, len=Math.hypot(dx,dy)||1; const nx=-dy/len, ny=dx/len; const amp=CELL*0.34; const strike=s._writhe||0; const wob=Math.sin(u*Math.PI*3 + T*0.0018 + s.from + strike*6)*amp*(1-u*0.12)*(1+strike*1.1)*(0.15+0.85*u); return {x:head.x+dx*u+nx*wob, y:head.y+dy*u+ny*wob}; }
function spawnDust(x,y,n){ for(let i=0;i<(n||8);i++){ const a=Math.random()*6.283, sp=CELL*(0.02+Math.random()*0.05); particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-CELL*0.02,g:CELL*0.004,life:0,max:500+Math.random()*300,r:CELL*(0.05+Math.random()*0.07),col:'rgba(205,185,155,0.5)',kind:'dust'}); } }
function spawnDebris(x,y){ for(let i=0;i<14;i++){ const a=Math.random()*6.283, sp=CELL*(0.04+Math.random()*0.10); particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:-Math.abs(Math.sin(a))*sp-CELL*0.05,g:CELL*0.013,life:0,max:600+Math.random()*400,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,w:CELL*(0.06+Math.random()*0.09),h:CELL*(0.02+Math.random()*0.04),col:Math.random()<0.5?'#c9924e':'#8a5a2b',kind:'wood'}); } spawnDust(x,y,10); }
function updateParticles(dt){ for(const p of particles){ p.life+=dt; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; if(p.kind==='wood') p.rot+=p.vr; } if(particles.length) particles=particles.filter(p=>p.life<p.max); }
function drawParticles(){ for(const p of particles){ const k=1-p.life/p.max; if(k<=0) continue; if(p.kind==='wood'){ ctx.save(); ctx.globalAlpha=k; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); } else if(p.kind==='rock'){ ctx.save(); ctx.globalAlpha=k; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.restore(); } else if(p.kind==='wind'){ ctx.save(); ctx.globalAlpha=k*0.5; ctx.strokeStyle=p.col; ctx.lineWidth=Math.max(1,CELL*0.03); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.len,p.y); ctx.stroke(); ctx.restore(); } else { ctx.save(); ctx.globalAlpha=k*0.6; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.6+0.6*(1-k)),0,7); ctx.fill(); ctx.restore(); } } }
function animateTo(n,dur){ const from={x:tokenPix.x,y:tokenPix.y}, to=squareCenter(n); tokenMoving=true; return addTween(dur,function(t){ const e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; tokenPix={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e}; },function(){ tokenPix=to; tokenMoving=false; }); }
async function walk(fromN,toN){ const step=toN>fromN?1:-1; for(let n=fromN+step; step>0?n<=toN:n>=toN; n+=step){ await animateTo(n,150); } }
async function slideAlongSnake(s){ tokenMoving=true; await addTween(240,function(t){ s._writhe=t*0.9; },null); shake(CELL*0.10,520); await addTween(780,function(t){ const e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; tokenPix=snakePointAt(s,e); s._writhe=0.9*(1-t*0.35); },function(){ tokenPix=squareCenter(s.to); tokenMoving=false; }); await addTween(300,function(t){ s._writhe=0.55*(1-t); },function(){ s._writhe=0; }); }
function loop(now){ const dt=Math.min(50,now-(loop._last||now)); loop._last=now; T=now; for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; const t=Math.min(1,(T-tw.start)/tw.dur); tw.update(t); if(t>=1){ tweens.splice(i,1); tw.done(); } } updateParticles(dt); draw(); requestAnimationFrame(loop); }

// ---------- dice face ----------
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,28],[72,28],[28,50],[72,50],[28,72],[72,72]]};
function renderDie(v){ const d=$('die'); d.innerHTML=''; (PIPS[v]||[]).forEach(p=>{ const s=document.createElement('span'); s.className='pip'; s.style.left=p[0]+'%'; s.style.top=p[1]+'%'; d.appendChild(s); }); }

// ---------- question ----------
function askQuestion(q, kind, dur){ dur=dur||ANSWER_MS;
  return new Promise(resolve=>{
    const ov=$('qoverlay'), bar=$('qtimerbar'); let done=false, timer=null, raf=0;
    const PR={ladder:['🪜 Climb it. Answer to hold the ladder!','lad'], snake:['🐍 Sneak past. Answer without waking it!','sna'], rock:['🪨 Rockfall! Answer to scramble clear!','rock'], storm:['🌩️ A storm! Answer to shelter the ladders!','storm']}[kind]||['','lad'];
    $('qkind').className='qkind '+PR[1]; $('qkind').textContent=PR[0];
    $('qtext').textContent=q.q;
    const opts=shuffle([q.correct].concat(q.wrong)); const correctIdx=opts.indexOf(q.correct);
    const grid=$('qopts'); grid.innerHTML='';
    function finish(ok){ if(done) return; done=true; clearTimeout(timer); cancelAnimationFrame(raf); try{ ok?SFX.correct():SFX.wrong(); }catch(e){}
      const kids=grid.children; if(kids[correctIdx]) kids[correctIdx].classList.add('right');
      setTimeout(function(){ ov.classList.add('hide'); resolve(ok); }, ok?450:800); }
    opts.forEach(function(o,i){ const b=document.createElement('button'); b.className='qopt c'+i;
      const k=document.createElement('span'); k.className='qk'; k.textContent='ABCD'[i];
      const t=document.createElement('span'); t.textContent=o; b.appendChild(k); b.appendChild(t);
      b.addEventListener('click',function(){ if(done) return; if(i!==correctIdx) b.classList.add('wrong'); finish(i===correctIdx); });
      grid.appendChild(b); });
    ov.classList.remove('hide');
    const start=performance.now(); bar.style.width='100%';
    (function tick(now){ const t=Math.min(1,(now-start)/dur); bar.style.width=((1-t)*100)+'%'; const rem=dur*(1-t); if(rem<2000){ const sc=Math.ceil(rem/1000); if(tick._s!==sc){ tick._s=sc; try{SFX.tick();}catch(e){} } } if(t<1 && !done) raf=requestAnimationFrame(tick); })(start);
    timer=setTimeout(function(){ finish(false); }, dur);
  });
}

// ---------- decay & snake behaviour ----------
function collapse(l){ try{SFX.collapse();}catch(e){} setStatus('A ladder crumbles to pieces! 🪜'); const mid=squareCenter(l.from), top=squareCenter(l.to); spawnDebris((mid.x+top.x)/2,(mid.y+top.y)/2); shake(CELL*0.14,540); punch(1.05);
  return addTween(560,function(t){ l._shake=Math.sin(t*44)*(1-t)*CELL*0.14; l._alpha=1-t; },function(){ l.alive=false; l._alpha=null; l._shake=0; }); }
function slitherAway(s){ try{SFX.slither();}catch(e){} const h=squareCenter(s.from); spawnDust(h.x,h.y,8);
  return addTween(640,function(t){ s._alpha=1-t; s._writhe=0.5*(1-t)+0.15; },function(){ s.alive=false; s._alpha=null; s._writhe=0; }); }
function jolt(l){ const m=squareCenter(l.from); shake(CELL*0.07,340); spawnDust(m.x,m.y,7);
  return addTween(380,function(t){ l._shake=Math.sin(t*50)*(1-t)*CELL*0.15; },function(){ l._shake=0; }); }
async function ageLadders(){ const dying=[]; board.ladders.forEach(l=>{ if(l.alive){ l.health--; if(l.health<=0) dying.push(l); } }); for(const l of dying) await collapse(l); }
async function snakeActs(s){
  const targets=board.ladders.filter(l=>l.alive);
  const shake = targets.length>0 && Math.random()<0.55;
  if(shake){ targets.sort((a,b)=>Math.abs(a.from-s.from)-Math.abs(b.from-s.from)); const l=targets[0];
    setStatus('The snake lashes out and shakes a ladder! 🐍'); try{SFX.shake();}catch(e){} await jolt(l); l.health-=3; s.stir=0; if(l.health<=0) await collapse(l);
  } else { setStatus('The snake slithers away, the path clears. 🐍'); await slitherAway(s); }
}

// ---------- third-force events: Roc, Rockfall, Storm ----------
const P_ROC=0.08, P_ROCK=0.07, P_STORM=0.04;
let roc={show:false,x:0,y:0};
function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function spawnRocks(c){ for(let i=0;i<9;i++){ particles.push({x:c.x+(Math.random()-0.5)*CELL*1.2, y:c.y-CELL*(0.8+Math.random()*2.2), vx:(Math.random()-0.5)*CELL*0.06, vy:CELL*(0.05+Math.random()*0.08), g:CELL*0.015, life:0, max:700+Math.random()*300, r:CELL*(0.08+Math.random()*0.12), col:Math.random()<0.5?'#8a8f99':'#6b6f78', kind:'rock'}); } spawnDust(c.x,c.y,10); }
function spawnWind(){ for(let i=0;i<26;i++){ particles.push({x:-CELL, y:Math.random()*H, vx:CELL*(0.28+Math.random()*0.45), vy:(Math.random()-0.5)*CELL*0.02, g:0, life:0, max:700+Math.random()*300, len:CELL*(0.6+Math.random()*1.3), col:'rgba(200,220,255,0.4)', kind:'wind'}); } }
function drawRoc(){ if(!roc.show) return; const flap=Math.sin(T*0.02); ctx.save(); ctx.translate(roc.x,roc.y);
  ctx.fillStyle='#8f6ab0';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-CELL*0.42,-CELL*0.28-flap*CELL*0.28,-CELL*0.58,CELL*0.06); ctx.quadraticCurveTo(-CELL*0.34,CELL*0.06,0,0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(CELL*0.42,-CELL*0.28-flap*CELL*0.28,CELL*0.58,CELL*0.06); ctx.quadraticCurveTo(CELL*0.34,CELL*0.06,0,0); ctx.fill();
  ctx.fillStyle='#6b4a8a'; ctx.beginPath(); ctx.ellipse(0,0,CELL*0.2,CELL*0.13,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(CELL*0.19,-CELL*0.03,CELL*0.08,0,7); ctx.fill();
  ctx.fillStyle='#f5b23e'; ctx.beginPath(); ctx.moveTo(CELL*0.26,-CELL*0.03); ctx.lineTo(CELL*0.37,0); ctx.lineTo(CELL*0.26,CELL*0.03); ctx.fill();
  ctx.restore(); }
async function flyRoc(toN){ const s0=squareCenter(pos), dest=squareCenter(toN); roc={show:true,x:-CELL,y:s0.y-CELL*2};
  await addTween(500,function(t){ const e=ease(t); roc.x=lerp(-CELL,s0.x,e); roc.y=lerp(s0.y-CELL*2,s0.y-CELL*0.55,e); });
  tokenMoving=true;
  await addTween(1000,function(t){ const e=ease(t); roc.x=lerp(s0.x,dest.x,e); roc.y=lerp(s0.y-CELL*0.55,dest.y-CELL*0.55,e)-Math.sin(t*Math.PI)*CELL*1.1; tokenPix={x:roc.x,y:roc.y+CELL*0.5}; });
  tokenPix=dest; tokenMoving=false;
  await addTween(450,function(t){ const e=ease(t); roc.x=lerp(dest.x,W+CELL,e); roc.y=lerp(dest.y-CELL*0.55,dest.y-CELL*2.2,e); },function(){ roc.show=false; }); }
async function braceHop(){ const c=squareCenter(pos); await addTween(320,function(t){ tokenPix={x:c.x,y:c.y-Math.sin(t*Math.PI)*CELL*0.4}; },function(){ tokenPix=c; }); }
async function rocEvent(){ const to=Math.min(TOP, pos+rint(5,16)); setStatus('A great Roc sweeps down and carries you upward! 🦅'); try{SFX.swoop();}catch(e){} await flyRoc(to); pos=to; }
async function rockfallEvent(){ setStatus('Rocks come loose above you! 🪨'); try{SFX.rumble();}catch(e){}
  const ok=await askQuestion(pickQuestion(),'rock',8000);
  if(ok){ setStatus('You scramble clear of the rockfall!'); await braceHop(); }
  else { const to=Math.max(1,pos-rint(5,16)); setStatus('Caught in the rockfall. Down you tumble!'); shake(CELL*0.16,600); punch(1.06); spawnRocks(squareCenter(pos)); await animateTo(to,640); pos=to; } }
async function stormEvent(){ setStatus('A gale sweeps across the board! 🌩️'); try{SFX.wind();}catch(e){} spawnWind();
  const ok=await askQuestion(pickQuestion(),'storm',8000);
  if(ok){ setStatus('You shelter the ladders, they hold!'); shake(CELL*0.06,400); }
  else { setStatus('The storm batters every ladder!'); shake(CELL*0.18,720); punch(1.05); spawnWind();
    const alive=board.ladders.filter(function(l){return l.alive;}); alive.forEach(function(l){ l.health-=4; jolt(l); }); await sleep(440);
    for(const l of board.ladders){ if(l.alive && l.health<=0) await collapse(l); } } }
async function maybeEvent(){ const r=Math.random();
  if(r<P_ROC){ if(pos<TOP-2) await rocEvent(); }
  else if(r<P_ROC+P_ROCK){ if(pos>4) await rockfallEvent(); }
  else if(r<P_ROC+P_ROCK+P_STORM){ if(board.ladders.some(function(l){return l.alive;})) await stormEvent(); } }

// ---------- game flow ----------
function setStatus(html){ $('status').innerHTML=html; }
async function rollTurn(){
  if(busy) return; busy=true; $('roll').disabled=true;
  const d=rint(1,6); lastRoll=d; turns++;
  try{SFX.roll();}catch(e){} $('die').classList.add('rolling');
  let flick=0; const fi=setInterval(()=>renderDie(rint(1,6)), 60);
  await sleep(500); clearInterval(fi); renderDie(d); $('die').classList.remove('rolling');
  setStatus('Rolled a <b>'+d+'</b>…');

  let target=pos+d;
  if(target>=TOP){ await walk(pos, TOP); pos=TOP; return win(); }
  await walk(pos, target); pos=target;

  const hit=resolveLanding(pos, board);
  if(hit){
    await sleep(150);
    const ok=await askQuestion(pickQuestion(), hit.kind, timerFor(pos));
    total++; if(ok) correct++;
    try{ if(hit.kind==='ladder'&&ok) SFX.climb(); else if(hit.kind==='snake'&&!ok) SFX.slide(); }catch(e){}
    if(hit.kind==='ladder'){
      if(ok){ setStatus('The ladder holds! Up you climb. 🪜'); await animateTo(hit.to,480); pos=hit.to; }
      else { hit.obj.health-=2; setStatus('The rung snaps. No climb.'); if(hit.obj.health<=0) await collapse(hit.obj); }
    } else {
      hit.obj.stir += ok?1:2;
      if(ok){ setStatus('You slip past the sleeping snake. 🐍'); }
      else { setStatus('The snake wakes. Down you slide! 🐍'); punch(1.06); await slideAlongSnake(hit.obj); pos=hit.to; }
      if(hit.obj.alive && hit.obj.stir>=hit.obj.threshold) await snakeActs(hit.obj);
    }
  } else {
    setStatus('On square <b>'+pos+'</b>.');
    await maybeEvent();
  }

  if(pos>=TOP) return win();
  await ageLadders();
  busy=false; $('roll').disabled=false;
}
function bestScore(){ try{ return parseInt(localStorage.getItem('creak_best')||'0',10)||null; }catch(e){ return null; } }
function confetti(){ const c=$('confetti'); if(!c) return; c.innerHTML=''; const em=['🎉','⭐','🏔️','🪜','✨']; for(let i=0;i<26;i++){ const sp=document.createElement('span'); sp.textContent=em[i%em.length]; sp.style.left=(Math.random()*100)+'%'; sp.style.animationDelay=(Math.random()*0.9)+'s'; sp.style.animationDuration=(2+Math.random()*1.4)+'s'; sp.style.fontSize=(14+Math.random()*16)+'px'; c.appendChild(sp); } }
function win(){
  busy=false;
  const left=board.ladders.filter(l=>l.alive).length, tot=board.ladders.length;
  const prev=bestScore(); const isBest = !prev || turns<prev;
  if(isBest){ try{ localStorage.setItem('creak_best', String(turns)); }catch(e){} }
  $('ovBig').textContent = isBest ? '🏔️ New best!' : '🏔️ Summit!';
  $('ovLine').textContent = isBest && prev ? ('Beat your record of '+prev+' turns!') : 'You reached the summit.';
  $('ovStats').innerHTML =
    '<div class="st"><b>'+turns+'</b><span>turns</span></div>'+
    '<div class="st"><b>'+correct+'/'+total+'</b><span>correct</span></div>'+
    '<div class="st"><b>'+left+'/'+tot+'</b><span>ladders left</span></div>';
  try{ SFX.summit(); }catch(e){}
  confetti();
  $('overlay').classList.remove('hide');
}
function newGame(){
  board=genBoard(); pos=1; lastRoll=0; busy=false; usedTags=new Set(); turns=0; correct=0; total=0;
  tokenPix=squareCenter(pos);
  const cf=$('confetti'); if(cf) cf.innerHTML='';
  $('overlay').classList.add('hide');
  $('roll').disabled=false; $('die').innerHTML='';
  const b=bestScore();
  setStatus('Roll to begin your climb.'+(b?(' <b>Best: '+b+'</b>'):''));
  draw();
}

$('roll').addEventListener('click', rollTurn);
$('newgame').addEventListener('click', newGame);
$('ovAgain').addEventListener('click', newGame);
{ let muted=false; const mb=$('mute'); if(mb) mb.addEventListener('click', function(){ muted=!muted; try{SFX.mute(muted);}catch(e){} mb.textContent=muted?'🔇':'🔊'; }); }
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

// expose pure logic for testing
window.__CC={genBoard,resolveLanding,TOP,COLS,ROWS,POOL,pickQuestion,slug,timerFor,spawnDebris,shake,punch,snakePointAt,loop,getParticles:function(){return particles;},setBoard:function(b){board=b;},spawnRocks,spawnWind,showRoc:function(){roc.show=true;roc.x=100;roc.y=100;}};
</script>
