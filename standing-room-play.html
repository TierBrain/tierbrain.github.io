<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Standing Room | join</title>
<meta name="description" content="Join a game of Standing Room on your phone.">
<link rel="canonical" href="https://tierbrain.co/standing-room-play.html">
<meta name="theme-color" content="#16232b">
<script>
(function(){ if(location.hostname==='tierbrain.github.io'){
  location.replace('https://tierbrain.co'+location.pathname+location.search+location.hash); } })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--deep:#101b22;--water:#16232b;--plank:#8a6e4e;--plank-lit:#a58760;--plank-dark:#6b5540;
        --bone:#e8dcc4;--gold:#d8a23c;--rust:#b5654a;--line:rgba(232,220,196,.14);}
  html,body{height:100%;}
  body{font-family:'Archivo',system-ui,sans-serif;color:var(--bone);
    background:radial-gradient(120% 70% at 50% -20%,#22323c,transparent 60%),
      linear-gradient(180deg,var(--water),var(--deep));background-attachment:fixed;
    min-height:100dvh;padding:18px 16px 26px;display:flex;flex-direction:column;align-items:center;}
  .wrap{width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;}
  h1{font-weight:800;font-size:22px;text-align:center;}
  h1 b{color:var(--gold);}
  .sub{text-align:center;color:rgba(232,220,196,.55);font-weight:600;font-size:13px;margin-top:4px;}

  label{display:block;font-weight:700;font-size:12.5px;color:rgba(232,220,196,.6);margin:16px 0 6px;}
  input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:11px;
    color:var(--bone);font-family:inherit;font-weight:800;font-size:17px;padding:14px;text-align:center;}
  input:focus{outline:none;border-color:var(--gold);}
  #code{letter-spacing:.3em;text-transform:uppercase;}
  .go{width:100%;margin-top:18px;background:var(--gold);border:0;border-radius:11px;color:#241905;
    font-family:inherit;font-weight:800;font-size:17px;padding:16px;cursor:pointer;box-shadow:0 4px 0 #8f6a1f;}
  .go:active{transform:translateY(4px);box-shadow:0 0 0 #8f6a1f;}
  .err{color:var(--rust);font-weight:700;font-size:13.5px;text-align:center;margin-top:10px;min-height:19px;}

  .hide{display:none!important;}
  .me{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:15px;margin-top:6px;}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);}
  .area{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .msg{text-align:center;font-weight:700;font-size:16px;line-height:1.5;color:rgba(232,220,196,.75);padding:26px 8px;}
  .qtext{font-weight:700;font-size:17px;line-height:1.4;text-align:center;margin-bottom:16px;}
  .opts{display:grid;gap:9px;}
  .opt{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--bone);
    font-family:inherit;font-weight:700;font-size:16px;padding:17px 10px;cursor:pointer;}
  .opt:active{transform:translateY(2px);}
  .opt:disabled{opacity:.45;}
  .grid{display:grid;gap:5px;margin-top:6px;}
  .cell{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.05);border:1px solid rgba(232,220,196,.07);}
  .cell.solid{background:linear-gradient(170deg,var(--plank-lit),var(--plank) 45%,var(--plank-dark));border-color:transparent;}
  .cell.step{cursor:pointer;box-shadow:inset 0 0 0 2px var(--gold),0 0 14px rgba(216,162,60,.45);}
  .cell.meHere{box-shadow:inset 0 0 0 3px #fff;}
  .cell i{display:block;width:60%;height:60%;margin:20% auto;border-radius:50%;}
  .lead{text-align:center;font-weight:700;font-size:14px;color:var(--gold);margin-bottom:10px;}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <h1>Standing <b>Room</b></h1>
  <div class="sub">one floor, everybody on it</div>

  <div id="joinCard">
    <label for="code">Room code (on the big screen)</label>
    <input id="code" maxlength="5" autocomplete="off" spellcheck="false" placeholder="ABCDE">
    <label for="name">Your name</label>
    <input id="name" maxlength="14" autocomplete="off" placeholder="e.g. Sam">
    <button class="go" id="joinBtn">Step onto the floor</button>
    <div class="err" id="err"></div>
  </div>

  <div id="partyConnection" role="status" aria-live="polite" hidden></div>
    <div id="partySubmission" hidden></div>
    <div id="partyControls" hidden><span id="partyRoom"></span> <button type="button" id="partyLeave">Leave the game</button></div>
    <div id="playCard" class="hide">
    <div class="me"><i class="dot" id="myDot"></i><span id="myName"></span></div>
    <div class="area" id="area"><div class="msg">Waiting for the game to start&hellip;</div></div>
  </div>
</div>

<script src="vendor/supabase.js"></script>
<script src="js/party-access.js"></script>
<script>

"use strict";
const SB_URL='https://cgrbwtcydgfkbqhseeap.supabase.co';
const SB_KEY='sb_publishable_YHNDjX8gcSYJYJVWo_TmMw_8z6BBVAU';
const access=PartyAccess.create(SB_URL,SB_KEY,{family:'standing',edition:'general'});
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),submissions=new Map(),SUBMISSIONS_KEY='tb_party_'+'standing'+'_general_submissions_v1';
let me=null,latest=null,lastSig='',joining=false,leaving=false,polling=false,generation=0,pollTimer=null,beatTimer=null,beating=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function connectionError(error){const box=$('partyConnection');box.hidden=false;box.textContent=access.message(error)+' ';
 const retry=document.createElement('button');retry.type='button';retry.textContent='Retry connection';retry.onclick=()=>poll();box.appendChild(retry);}
function clearConnection(){$('partyConnection').hidden=true;}
function rememberSubmissions(){try{localStorage.setItem(SUBMISSIONS_KEY,JSON.stringify(Array.from(submissions.values()).slice(-40).map(r=>({code:r.code,member:r.member,run:r.run,window:r.window,choice:r.choice,request:r.request}))));}catch(e){}}
function restoreSubmissions(){try{const rows=JSON.parse(localStorage.getItem(SUBMISSIONS_KEY)||'[]');if(!Array.isArray(rows))return;
 for(const r of rows.slice(-40)){if(!r||r.member!==me.id||r.code!==me.code||typeof r.choice!=='string'||r.choice.length>2000||!['run','window','request'].every(k=>typeof r[k]==='string'&&/^[0-9a-f-]{36}$/i.test(r[k])))continue;
  if(!submissions.has(r.window))submissions.set(r.window,Object.assign({},r,{state:'unknown',mayHaveCommitted:true,error:null}));}
}catch(e){}}
function currentRecord(){const action=latest&&latest.room&&latest.room.action;const r=action&&submissions.get(action.id);return r&&me&&r.member===me.id&&r.code===me.code?r:null;}
function recordText(record){
 if(record.state==='pending')return 'Sending your move…';
 if(record.state==='confirmed')return 'Move recorded. Watch the big screen.';
 if(record.state==='failed')return 'Your move was not recorded. '+access.message(record.error);
 return 'Could not confirm your move. Retry the same move to check.';
}
function renderSubmission(record){const box=$('partySubmission');box.textContent='';box.hidden=!record;if(!record)return;
 const text=document.createElement('div');text.setAttribute('role','status');text.setAttribute('aria-live','polite');text.dataset.state=record.state;text.textContent=recordText(record);box.appendChild(text);
 if(record.state==='unknown'||record.state==='failed'){const retry=document.createElement('button');retry.type='button';retry.textContent='Retry same move';retry.onclick=()=>attemptSubmission(record);box.appendChild(retry);}
}
function reconcileReceipts(receipts){for(const receipt of receipts||[]){
 if(!me||receipt.player_id!==me.id||!receipt.window_id)continue;
 let record=submissions.get(receipt.window_id);
 if(!record){record={code:me.code,member:me.id,run:latest.room.run_id,window:receipt.window_id,choice:String(receipt.choice),request:access.uuid()};submissions.set(record.window,record);}
 if(record.code===me.code&&record.member===me.id&&record.choice===String(receipt.choice)){record.state='confirmed';record.ack=receipt;record.error=null;}
 }rememberSubmissions();}
async function attemptSubmission(record){
 if(!me||record.member!==me.id||record.code!==me.code||record.state==='pending'||record.state==='confirmed')return;
 record.state='pending';record.error=null;rememberSubmissions();lastSig='';render();
 try{const ack=await access.submit(record.code,record.run,record.window,record.choice,record.request);
  if(!ack||ack.window_id!==record.window||ack.player_id!==record.member||String(ack.choice)!==record.choice)throw new Error('The game did not confirm this move.');
  record.state='confirmed';record.ack=ack;
 }catch(error){record.error=error;const conflict=/already|different|conflict|did not confirm/i.test(error.message||'');
  const definite=error.status>=400&&error.status<500&&error.status!==408&&!conflict;
  if(!definite)record.mayHaveCommitted=true;record.state=definite&&!record.mayHaveCommitted?'failed':'unknown';
 }
 rememberSubmissions();if(me&&me.id===record.member&&me.code===record.code){lastSig='';render();}
}
function submitChoice(choice){
 const room=latest&&latest.room,action=room&&room.action;
 if(!me||!action||!action.accepting||action.member_id!==me.id)return;
 let record=submissions.get(action.id);if(record)return;
 record={code:me.code,member:me.id,run:room.run_id,window:action.id,choice:String(choice),request:access.uuid(),state:'idle',mayHaveCommitted:false,error:null};
 submissions.set(action.id,record);return attemptSubmission(record);
}
function returnToJoin(message){generation++;clearInterval(pollTimer);clearInterval(beatTimer);me=null;latest=null;lastSig='';access.rememberPlayer('');
 $('joinCard').classList.remove('hide');$('joinCard').style.display='';$('playCard').classList.add('hide');$('playCard').style.display='none';
 $('partySubmission').hidden=true;$('partyControls').hidden=true;clearConnection();if(message)$('err').textContent=message;}
function enterGame(){generation++;$('joinCard').classList.add('hide');$('joinCard').style.display='none';$('playCard').classList.remove('hide');$('playCard').style.display='';
 $('partyControls').hidden=false;$('partyRoom').textContent='Room '+me.code;restoreSubmissions();enterEdition();
 clearInterval(pollTimer);clearInterval(beatTimer);poll();beat();pollTimer=setInterval(poll,1100);beatTimer=setInterval(beat,10000);}
async function join(){
 if(joining||me)return;const code=($('code').value||'').trim().toUpperCase(),name=($('name').value||'').trim();
 if(code.length!==5){$('err').textContent='Enter the five-letter code on the big screen.';return;}if(!name){$('err').textContent='Enter your name.';return;}
 joining=true;$('joinBtn').disabled=true;$('err').textContent='';
 try{await access.preview(code);const member=await access.join(code,name);if(!member||!member.id)throw new Error('The game did not confirm that you joined.');
  me=Object.assign({code},member);access.rememberPlayer(code);enterGame();
 }catch(error){$('err').textContent=access.message(error);}finally{joining=false;$('joinBtn').disabled=false;}
}
async function tryResume(){
 const saved=access.savedPlayerCode(),explicit=(params.get('c')||'').toUpperCase();if(!saved||(explicit&&explicit!==saved))return;
 joining=true;$('joinBtn').disabled=true;
 try{const member=await access.membership(saved);if(member&&member.id){me=Object.assign({code:saved},member);enterGame();}else access.rememberPlayer('');}
 catch(error){$('err').textContent=access.message(error);}finally{joining=false;$('joinBtn').disabled=false;}
}
async function beat(){if(!me||beating)return;beating=true;const member=me;try{await access.heartbeat(member.code);}catch(error){if(me===member)connectionError(error);}finally{beating=false;}}
async function poll(){
 if(!me||polling)return;polling=true;const member=me,view=generation;
 try{const state=await access.playerState(member.code);if(me!==member||generation!==view)return;
  if(!state||!state.member||state.member.id!==member.id){returnToJoin('You are no longer in that room. Enter the code to rejoin.');return;}
  latest=state;reconcileReceipts(state.receipts);clearConnection();render();
 }catch(error){if(me===member&&generation===view)connectionError(error);}finally{polling=false;}
}
async function leave(){
 if(!me||leaving)return;leaving=true;$('partyLeave').disabled=true;const member=me;
 try{const result=await access.leave(member.code);if(!result||result.left!==true)throw new Error('The game did not confirm that you left.');if(me===member)returnToJoin('You left the room.');}
 catch(error){if(me===member)connectionError(error);}finally{leaving=false;$('partyLeave').disabled=false;}
}
$('joinBtn').addEventListener('click',join);$('partyLeave').addEventListener('click',leave);
$('name').addEventListener('keydown',event=>{if(event.key==='Enter')join();});
if(params.get('c'))$('code').value=params.get('c').toUpperCase().slice(0,5);
tryResume();

const COLOURS=['#d8a23c','#4fb0a8','#c96fa8','#7fb85c','#6f8fd8','#e0855c'];
function enterEdition(){$('myName').textContent=me.name;}
function setArea(html){$('area').innerHTML=html;}
function render(){
 if(!me||!latest)return;const room=latest.room,st=room.state||{},action=room.action,record=currentRecord();renderSubmission(record);
 const sig=JSON.stringify([room.run_id,room.version,record&&record.state]);if(sig===lastSig)return;lastSig=sig;
 const index=(st.order||[]).indexOf(me.id);if(index>=0)$('myDot').style.background=COLOURS[index%COLOURS.length];
 if(room.phase==='lobby'){setArea('<div class="msg">You are on the floor.<br>Waiting for the host to start…</div>');return;}
 if(room.phase==='over'){const alive=(st.order||[]).filter(id=>!(st.outOf||{})[id]);setArea('<div class="msg">'+(alive.length===1&&alive[0]===me.id?'You are still standing.':'The floor is gone.')+'</div>');return;}
 if((st.outOf||{})[me.id]){setArea('<div class="msg">You went under.<br>Watch the rest of them.</div>');return;}
 const actor=(st.order||[])[st.turn];
 if(actor!==me.id){const who=(latest.members||[]).find(p=>p.id===actor)||(st.names||[]).find(p=>p.id===actor);setArea('<div class="msg">'+esc(who?who.name:'Someone')+' is deciding…<br><span style="font-size:13px;opacity:.65">Every step sinks a board for all of us.</span></div>');return;}
 if(record||!action||!action.accepting){setArea('<div class="msg">Watch the big screen…</div>');return;}
 if(action.kind==='answer'){
  const q=st.q||{};setArea('<div class="lead">Your turn</div><div class="qtext">'+esc(q.q||'')+'</div><div class="opts">'+(q.opts||[]).map((option,i)=>'<button class="opt" data-i="'+i+'">'+esc(option)+'</button>').join('')+'</div>');
  $('area').querySelectorAll('.opt').forEach(button=>button.addEventListener('click',()=>submitChoice(q.opts[Number(button.dataset.i)])));return;
 }
 if(action.kind==='step'){
  const N=st.N||6,solid=st.solid||[],pos=st.pos||{},tile=pos[me.id],occupied={};(st.order||[]).forEach(id=>{if(!(st.outOf||{})[id]&&id!==me.id)occupied[pos[id]]=true;});
  const choices=[];const r0=Math.floor(tile/N),c0=tile%N;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=r0+dr,c=c0+dc,t=r*N+c;if((dr||dc)&&r>=0&&c>=0&&r<N&&c<N&&solid[t]&&!occupied[t])choices.push(t);}
  let html='<div class="lead">Right. Choose your step.</div><div class="grid" style="grid-template-columns:repeat('+N+',1fr)">';
  for(let i=0;i<N*N;i++){let token='';(st.order||[]).forEach((id,j)=>{if(!(st.outOf||{})[id]&&pos[id]===i)token='<i style="background:'+COLOURS[j%COLOURS.length]+'"></i>';});html+='<div class="cell'+(solid[i]?' solid':'')+(choices.includes(i)?' step':'')+(i===tile?' meHere':'')+'" data-t="'+i+'">'+token+'</div>';}
  setArea(html+'</div>');$('area').querySelectorAll('.cell.step').forEach(cell=>cell.addEventListener('click',()=>submitChoice(cell.getAttribute('data-t'))));
 }
}

</script>
